<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<meta name="theme-color" content="#1976D2">

<title>صحتي+ | الرئيسية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{

    --blue:#1976D2;
    --blue-dark:#0D47A1;
    --blue-deep:#083B78;
    --blue-medium:#2587DF;
    --blue-light:#EAF5FF;
    --blue-soft:#F3F9FF;

    --green:#149B7E;
    --green-light:#E8F8F3;

    --purple:#7050D8;
    --purple-light:#F1EEFF;

    --pink:#D94F91;
    --pink-light:#FFF0F7;

    --orange:#E98A08;
    --orange-light:#FFF5E3;

    --red:#D94738;
    --red-light:#FFF0EE;

    --gray-blue:#607D8B;
    --gray-blue-light:#EEF2F4;

    --text:#172333;
    --text-dark:#101B29;
    --muted:#657486;

    --bg:#F4F8FC;
    --card:#FFFFFF;
    --border:#DCE6F0;

    --shadow:
        0 6px 20px rgba(20,72,120,.07);
}


/* =========================================================
   BASE
========================================================= */

html{
    scroll-behavior:smooth;
}

body{

    font-family:"Cairo",sans-serif;

    background:
        radial-gradient(
            circle at 100% 0%,
            rgba(25,118,210,.08),
            transparent 28%
        ),
        var(--bg);

    color:var(--text);

    min-height:100vh;

    font-size:15px;

    font-weight:700;

    -webkit-font-smoothing:antialiased;
}

button,
a,
input{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}


/* =========================================================
   APP
========================================================= */

.app{

    width:100%;

    max-width:650px;

    margin:auto;

    padding:
        0
        15px
        105px;
}


/* =========================================================
   MEDICAL HEADER
========================================================= */

.top-medical{

    position:relative;

    margin-left:-15px;
    margin-right:-15px;

    padding:
        14px
        15px
        18px;

    background:

        radial-gradient(
            circle at 8% 15%,
            rgba(255,255,255,.18),
            transparent 25%
        ),

        radial-gradient(
            circle at 92% 0%,
            rgba(105,202,255,.25),
            transparent 30%
        ),

        linear-gradient(
            145deg,
            #0B56A5 0%,
            #1976D2 48%,
            #2D91E5 100%
        );

    border-radius:
        0
        0
        28px
        28px;

    box-shadow:
        0 12px 30px
        rgba(25,118,210,.18);

    overflow:hidden;

    margin-bottom:22px;
}


.top-medical::before{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    border-radius:50%;

    background:
        rgba(255,255,255,.07);

    top:-100px;
    right:-65px;
}


.top-medical::after{

    content:"";

    position:absolute;

    width:110px;
    height:110px;

    border-radius:50%;

    background:
        rgba(255,255,255,.05);

    bottom:-60px;
    left:-35px;
}


/* =========================================================
   PROFILE CARD
========================================================= */

.profile-card{

    position:relative;

    z-index:3;

    overflow:hidden;

    background:
        rgba(255,255,255,.98);

    border:
        1px solid
        rgba(255,255,255,.8);

    border-radius:22px;

    padding:13px 14px;

    margin-bottom:14px;

    box-shadow:
        0 8px 22px
        rgba(7,61,117,.17);
}


.profile-card::before{

    content:"";

    position:absolute;

    top:-55px;
    right:-65px;

    width:190px;
    height:120px;

    background:#EAF5FF;

    transform:rotate(-12deg);

    border-radius:30px;
}


.profile-card::after{

    content:"";

    position:absolute;

    top:0;
    right:0;

    width:5px;
    height:100%;

    background:
        linear-gradient(
            180deg,
            #0D47A1,
            #42A5F5
        );
}


/* =========================================================
   PROFILE CONTENT
========================================================= */

.profile-content{

    position:relative;

    z-index:2;

    display:grid;

    grid-template-columns:
        62px 1fr;

    gap:12px;

    direction:ltr;

    align-items:center;
}


.profile-avatar-wrap{

    width:62px;
    height:62px;

    border-radius:50%;

    background:#F1F6FB;

    padding:3px;

    border:
        1px solid
        #D6E2ED;

    overflow:hidden;

    box-shadow:
        0 4px 12px
        rgba(25,118,210,.10);
}


.profile-avatar{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:50%;
}


.profile-info{

    direction:rtl;

    min-width:0;
}


.profile-name{

    font-size:18px;

    font-weight:900;

    color:#132236;

    margin-bottom:7px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.profile-details{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:6px 9px;
}


.profile-detail{

    display:flex;

    align-items:center;

    gap:6px;

    color:#4F6072;

    font-size:12px;

    font-weight:800;

    min-width:0;
}


.profile-detail i{

    width:23px;
    height:23px;

    border-radius:8px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex:none;

    background:#EDF6FF;

    color:#1268BC;

    font-size:11px;
}


.profile-detail span{

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   MEDICAL INFORMATION
========================================================= */

.profile-medical{

    position:relative;

    z-index:2;

    margin-top:11px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:7px;
}


.medical-item{

    border:
        1px solid
        #E2EAF2;

    background:#F8FBFE;

    border-radius:12px;

    padding:8px 9px;

    min-width:0;
}


.medical-label{

    display:flex;

    align-items:center;

    gap:5px;

    color:#738193;

    font-size:11px;

    font-weight:800;

    margin-bottom:2px;
}


.medical-label i{

    color:#1976D2;

    font-size:10px;
}


.medical-value{

    font-size:12px;

    font-weight:900;

    color:#263648;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.medical-value.empty{

    color:#8C98A6;

    font-weight:700;
}


.profile-edit{

    position:absolute;

    left:12px;
    bottom:12px;

    z-index:5;

    width:30px;
    height:30px;

    border-radius:9px;

    background:#EDF6FF;

    color:#1268BC;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:12px;
}


/* =========================================================
   CALENDAR
========================================================= */

.integrated-calendar{

    position:relative;

    z-index:4;
}


.date-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:8px;

    padding:0 2px;
}


.date-title{

    font-size:15px;

    font-weight:900;

    color:#fff;
}


.calendar-button{

    width:38px;
    height:38px;

    border-radius:11px;

    background:
        rgba(255,255,255,.17);

    color:#fff;

    border:
        1px solid
        rgba(255,255,255,.25);

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:16px;

    backdrop-filter:blur(8px);
}


.week{

    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    gap:4px;
}


.day{

    text-align:center;

    padding:5px 2px;

    border-radius:13px;

    cursor:pointer;

    color:
        rgba(255,255,255,.92);

    transition:.2s;
}


.day-name{

    font-size:10px;

    font-weight:800;

    margin-bottom:4px;

    color:
        rgba(255,255,255,.78);
}


.day-number{

    width:34px;
    height:34px;

    margin:auto;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:14px;

    font-weight:900;

    color:#fff;
}


.day.active{

    background:
        rgba(255,255,255,.14);
}


.day.active .day-number{

    background:#fff;

    color:#1268BC;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.16);
}


.day.today .day-number{

    border:
        2px solid
        rgba(255,255,255,.90);
}


.day.active.today .day-number{

    border:0;

    background:#fff;

    color:#1268BC;
}


/* =========================================================
   SCORE CARD
========================================================= */

.score-card{

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #1268BC,
            #2388E5
        );

    color:#fff;

    border-radius:22px;

    padding:17px;

    margin-bottom:23px;

    box-shadow:
        0 9px 24px
        rgba(25,118,210,.19);
}


.score-card::before{

    content:"";

    position:absolute;

    width:160px;
    height:160px;

    border-radius:50%;

    background:
        rgba(255,255,255,.06);

    left:-65px;
    top:-75px;
}


.score-inner{

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}


.score-text{

    flex:1;
}


.score-title{

    font-size:19px;

    font-weight:900;

    margin-bottom:5px;
}


.score-subtitle{

    font-size:13px;

    line-height:1.9;

    color:
        rgba(255,255,255,.94);

    font-weight:700;
}


.progress-ring{

    width:90px;
    height:90px;

    position:relative;

    flex:none;
}


.progress-ring svg{

    width:100%;
    height:100%;

    transform:rotate(-90deg);
}


.progress-ring circle{

    fill:none;

    stroke-width:8;
}


.progress-bg{

    stroke:
        rgba(255,255,255,.20);
}


.progress-value{

    stroke:#fff;

    stroke-linecap:round;

    stroke-dasharray:251;

    stroke-dashoffset:251;

    transition:1s ease;
}


.progress-number{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:20px;

    font-weight:900;
}


/* =========================================================
   SECTIONS
========================================================= */

.section{

    margin-bottom:24px;
}


.section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:12px;
}


.section-title{

    display:flex;

    align-items:center;

    gap:9px;

    font-size:18px;

    font-weight:900;

    color:#18283A;
}


.section-title i{

    color:#1976D2;

    font-size:18px;
}


/* =========================================================
   HEALTH SHORTCUTS
========================================================= */

.health-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;
}


.health-item{

    background:#fff;

    border:
        1px solid
        var(--border);

    border-radius:18px;

    padding:12px 5px;

    text-align:center;

    box-shadow:
        var(--shadow);

    transition:.2s;
}


.health-item:active{

    transform:scale(.96);
}


.health-icon{

    width:46px;
    height:46px;

    margin:auto auto 7px;

    border-radius:15px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:19px;
}


.health-name{

    font-size:12px;

    font-weight:900;

    color:#344456;
}


.blue-icon{

    background:#E7F3FF;

    color:#1268BC;
}


.pink-icon{

    background:#FFF0F7;

    color:#D94F91;
}


.purple-icon{

    background:#F1EEFF;

    color:#7050D8;
}


.green-icon{

    background:#E8F8F3;

    color:#149B7E;
}


/* =========================================================
   DAILY CHALLENGES
========================================================= */

.daily-list{

    display:grid;

    gap:10px;
}


.daily-card{

    position:relative;

    display:flex;

    align-items:center;

    gap:11px;

    min-height:78px;

    background:#fff;

    border:
        1px solid
        var(--border);

    border-radius:18px;

    padding:11px 12px;

    box-shadow:
        var(--shadow);

    overflow:hidden;

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}


.daily-card::before{

    content:"";

    position:absolute;

    right:0;
    top:0;
    bottom:0;

    width:4px;

    background:
        var(--card-color);
}


.daily-card:active{

    transform:scale(.985);
}


.daily-icon{

    width:48px;
    height:48px;

    border-radius:15px;

    flex:none;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        var(--icon-bg);

    color:
        var(--card-color);

    font-size:20px;
}


.daily-main{

    flex:1;

    min-width:0;
}


.daily-name{

    color:#1B2B3D;

    font-size:15px;

    font-weight:900;

    margin-bottom:2px;
}


.daily-value{

    color:#667587;

    font-size:11px;

    font-weight:800;

    margin-bottom:6px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.daily-progress{

    height:6px;

    width:100%;

    background:#EAF0F5;

    border-radius:10px;

    overflow:hidden;
}


.daily-progress span{

    display:block;

    height:100%;

    border-radius:10px;

    background:
        var(--card-color);

    transition:
        width .5s ease;
}


.daily-percent{

    width:45px;

    text-align:center;

    color:
        var(--card-color);

    font-size:13px;

    font-weight:900;

    flex:none;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty-challenges{

    background:#fff;

    border:
        2px dashed
        #C8D8E8;

    border-radius:20px;

    padding:28px 18px;

    text-align:center;
}


.empty-icon{

    width:56px;
    height:56px;

    border-radius:17px;

    margin:0 auto 12px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#EAF5FF;

    color:#1976D2;

    font-size:22px;
}


.empty-challenges strong{

    display:block;

    font-size:16px;

    font-weight:900;

    margin-bottom:6px;

    color:#233447;
}


.empty-challenges p{

    font-size:13px;

    color:#738193;

    line-height:1.9;

    font-weight:700;

    margin-bottom:15px;
}


.empty-button{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    background:#1976D2;

    color:#fff;

    padding:11px 18px;

    border-radius:13px;

    font-size:13px;

    font-weight:900;

    box-shadow:
        0 5px 14px
        rgba(25,118,210,.18);
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{

    position:fixed;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:min(650px,100%);

    background:
        rgba(255,255,255,.97);

    backdrop-filter:blur(15px);

    border-top:
        1px solid
        #DCE5EE;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    padding:
        7px
        8px
        max(8px,env(safe-area-inset-bottom));

    z-index:100;
}


.nav-item{

    text-align:center;

    color:#8491A0;

    font-size:12px;

    font-weight:800;

    padding:5px;

    transition:.2s;
}


.nav-item i{

    display:block;

    font-size:20px;

    margin-bottom:4px;
}


.nav-item.active{

    color:#1976D2;

    font-weight:900;
}


/* =========================================================
   LOADING
========================================================= */

.loading-screen{

    position:fixed;

    inset:0;

    background:#fff;

    z-index:9999;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:.3s;
}


.loading-screen.hide{

    opacity:0;

    pointer-events:none;
}


.loading-box{

    text-align:center;
}


.loading-logo{

    width:72px;
    height:72px;

    border-radius:22px;

    background:#EAF5FF;

    color:#1976D2;

    display:flex;

    align-items:center;
    justify-content:center;

    margin:auto auto 12px;

    font-size:30px;
}


.loading-box strong{

    display:block;

    font-size:22px;

    font-weight:900;
}


.loading-box p{

    font-size:13px;

    color:#7C8997;

    font-weight:700;

    margin-top:3px;
}


.spinner{

    width:25px;
    height:25px;

    border:3px solid #DCEBFA;

    border-top-color:#1976D2;

    border-radius:50%;

    animation:spin .8s linear infinite;

    margin:15px auto 0;
}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   MODAL
========================================================= */

.modal{

    position:fixed;

    inset:0;

    background:
        rgba(20,35,50,.45);

    backdrop-filter:blur(5px);

    z-index:500;

    display:none;

    align-items:flex-end;

    justify-content:center;
}


.modal.show{

    display:flex;
}


.modal-box{

    width:min(650px,100%);

    background:#fff;

    border-radius:
        25px
        25px
        0
        0;

    padding:21px;

    animation:
        slideUp .25s ease;
}


@keyframes slideUp{

    from{
        transform:translateY(100%);
    }

    to{
        transform:translateY(0);
    }

}


.modal-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;
}


.modal-head strong{

    font-size:18px;

    font-weight:900;
}


.close-modal{

    width:38px;
    height:38px;

    border-radius:11px;

    background:#F0F4F8;

    color:#596979;

    font-size:16px;
}


/* =========================================================
   SMALL SCREENS
========================================================= */

@media(max-width:400px){

    .app{

        padding-left:11px;
        padding-right:11px;
    }

    .top-medical{

        margin-left:-11px;
        margin-right:-11px;

        padding-left:11px;
        padding-right:11px;
    }

    .profile-card{

        padding:12px;
    }

    .profile-content{

        grid-template-columns:
            58px 1fr;

        gap:10px;
    }

    .profile-avatar-wrap{

        width:58px;
        height:58px;
    }

    .profile-name{

        font-size:17px;
    }

    .profile-detail{

        font-size:11px;
    }

    .health-grid{

        gap:6px;
    }

    .health-item{

        padding:11px 3px;
    }

    .health-icon{

        width:43px;
        height:43px;

        font-size:18px;
    }

    .health-name{

        font-size:11px;
    }

    .day-number{

        width:32px;
        height:32px;
    }

    .daily-card{

        padding:10px;

        gap:9px;
    }

    .daily-icon{

        width:44px;
        height:44px;

        font-size:18px;
    }

    .daily-name{

        font-size:14px;
    }

}


@media(max-width:350px){

    .profile-details{

        grid-template-columns:1fr;
    }

    .profile-card{

        padding-bottom:13px;
    }

    .profile-medical{

        grid-template-columns:1fr;
    }

    .day-number{

        width:29px;
        height:29px;

        font-size:12px;
    }

    .daily-percent{

        width:40px;

        font-size:12px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     LOADING
========================================================= -->

<div class="loading-screen" id="loadingScreen">

    <div class="loading-box">

        <div class="loading-logo">

            <i class="fa-solid fa-heart-pulse"></i>

        </div>

        <strong>Si7a+</strong>

        <p>
            صحتي+ — مساحتك الصحية الشخصية
        </p>

        <div class="spinner"></div>

    </div>

</div>



<main class="app">


<!-- =========================================================
     MEDICAL HEADER
========================================================= -->

<section class="top-medical">


    <!-- PROFILE -->

    <section class="profile-card">


        <div class="profile-content">


            <div class="profile-avatar-wrap">

                <img
                    id="profileAvatar"
                    class="profile-avatar"
                    alt="صورة المستخدم">

            </div>


            <div class="profile-info">


                <div
                    class="profile-name"
                    id="profileName">

                    مستخدم صحتي

                </div>


                <div class="profile-details">


                    <div class="profile-detail">

                        <i class="fa-solid fa-venus-mars"></i>

                        <span id="profileGender">
                            غير محدد
                        </span>

                    </div>


                    <div class="profile-detail">

                        <i class="fa-solid fa-ruler-vertical"></i>

                        <span id="profileHeight">
                            غير محدد

/* =========================================================
   DATE
========================================================= */

function formatDateKey(date){

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;

}


function arabicDate(date){

    return new Intl.DateTimeFormat(
        "ar-DZ",
        {
            weekday:"long",
            day:"numeric",
            month:"long"
        }
    ).format(date);

}


/* =========================================================
   WEEK
========================================================= */

function renderWeek(){

    const week =
        document.getElementById("week");

    week.innerHTML = "";

    const selectedKey =
        formatDateKey(selectedDate);

    const start =
        new Date(selectedDate);

    const day =
        start.getDay();

    const mondayOffset =
        day === 0
            ? -6
            : 1 - day;

    start.setDate(
        start.getDate() +
        mondayOffset
    );

    const names = [

        "الإثنين",
        "الثلاثاء",
        "الأربعاء",
        "الخميس",
        "الجمعة",
        "السبت",
        "الأحد"

    ];


    for(let i=0;i<7;i++){

        const d =
            new Date(start);

        d.setDate(
            start.getDate()+i
        );

        const key =
            formatDateKey(d);

        const item =
            document.createElement("div");

        item.className = "day";


        if(key === selectedKey){

            item.classList.add("active");

        }


        if(
            key ===
            formatDateKey(new Date())
        ){

            item.classList.add("today");

        }


        item.innerHTML = `

            <div class="day-name">

                ${names[i].slice(0,3)}

            </div>

            <div class="day-number">

                ${d.getDate()}

            </div>

        `;


        item.addEventListener(
            "click",
            async ()=>{

                selectedDate =
                    new Date(d);

                document.getElementById(
                    "selectedDateText"
                ).textContent =
                    arabicDate(
                        selectedDate
                    );

                renderWeek();

                await loadDailyData();

            }
        );


        week.appendChild(item);

    }


    document.getElementById(
        "selectedDateText"
    ).textContent =
        arabicDate(selectedDate);

}


/* =========================================================
   PROFILE
========================================================= */

function normalizeGender(value){

    if(!value){

        return "غير محدد";

    }


    const v =
        String(value).toLowerCase();


    if(
        v === "male" ||
        v === "ذكر" ||
        v === "homme" ||
        v === "m"
    ){

        return "ذكر";

    }


    if(
        v === "female" ||
        v === "أنثى" ||
        v === "femme" ||
        v === "f"
    ){

        return "أنثى";

    }


    return String(value);

}


function normalizeBlood(value){

    if(!value){

        return "غير محددة";

    }

    return String(value);

}


function calculateBMI(weight,height){

    const w = Number(weight);

    const h = Number(height);


    if(
        !Number.isFinite(w) ||
        !Number.isFinite(h) ||
        w <= 0 ||
        h <= 0
    ){

        return null;

    }


    const meters =
        h / 100;


    return w /
        (meters * meters);

}


function bmiStatus(bmi){

    if(bmi === null){

        return "";

    }


    if(bmi < 18.5){

        return "نحافة";

    }


    if(bmi < 25){

        return "طبيعي";

    }


    if(bmi < 30){

        return "زيادة في الوزن";

    }


    return "سمنة";

}


function getDiseases(data){

    const value =

        data.chronicDiseases ??
        data.chronicDisease ??
        data.diseases ??
        data.medicalConditions ??
        data.chronicConditions ??
        "";


    if(Array.isArray(value)){

        return value.length
            ? value.join("، ")
            : "لا توجد معلومات";

    }


    if(value === true){

        return "موجودة";

    }


    if(
        !value ||
        String(value).trim() === ""
    ){

        return "لا توجد معلومات";

    }


    return String(value);

}

async function loadUser(){

        return;

    }


    try{

        const ref =
            doc(

                currentUser.uid

        const snap =

        );


        userData = {};

    }

}


/* =========================================================
   LOAD CHALLENGES
========================================================= */

async function loadChallenges(){

    if(!currentUser){

        return;

    }


    let found = false;


    try{

        const paths = [

            [
                "challengeSettings",
                "main"
            ],

            [
                "challenges",
                "settings"
            ],

            [
                "healthSettings",
                "challenges"
            ]

        ];


        for(const path of paths){

            const ref =
                doc(
                    db,
                    "users",
                    currentUser.uid,
                    path[0],
                    path[1]
                );


            const snap =
                await getDoc(ref);


            if(snap.exists()){

                const data =
                    snap.data() || {};


                let selected =
                    data.selected ??
                    data.selectedChallenges ??
                    data.challenges;


                if(!Array.isArray(selected)){

                    selected =
                        CHALLENGES
                        .filter(
                            item =>
                                data[item.id] === true
                        )
                        .map(
                            item =>
                                item.id
                        );

                }


                challengeSettings = {

                    selected:
                        selected || [],

                    targets:
                        data.targets || {},

                    values:
                        data.values || {}

                };


                found = true;

                break;

            }

        }

    }catch(error){

        console.error(
            "Challenge settings error:",
            error
        );

    }


    if(!found){

        challengeSettings = {

            selected:[],

            targets:{},

            values:{}

        };

    }


    renderDaily();

}


/* =========================================================
   TARGET
========================================================= */

function getTarget(challenge){

    const custom =
        challengeSettings.targets?.[
            challenge.id
        ];


    if(
        custom !== undefined &&
        custom !== null &&
        custom !== ""
    ){

        if(
            challenge.type === "number"
        ){

            const value =
                Number(custom);


            if(
                Number.isFinite(value) &&
                value > 0
            ){

                return value;

            }

        }


        return custom;

    }


    return challenge.target;

}

function getSleepSchedule(){

/* =========================================================
   DAILY VALUE
========================================================= */

function getDailyValue(id){

    const d =
        dailyData || {};


    switch(id){

        /* =============================================
           WATER
        ============================================= */

        case "water":

            return Number(
                d.waterCups ??
                d.water ??
                d.waterIntake ??
                0
            );


        /* =============================================
           WALKING
           الجديد: بالمتر
        ============================================= */

        case "walking":

            return Number(
                d.walkingMeters ??
                d.distanceMeters ??
                d.meters ??
                d.walking ??
                d.distance ??
                0
            );


        /* =============================================
           SLEEP
           الجديد: بالساعات
        ============================================= */

        case "sleep":{

            let value =
                Number(
                    d.sleepHours ??
                    d.hoursSleep ??
                    d.sleep ??
                    0
                );


            /*
               توافق مع البيانات القديمة:
               إذا كانت القيمة كبيرة مثل 480
               نعتبرها دقائق ونحوّلها إلى ساعات.
            */

            if(value > 24){

                value =
                    value / 60;

            }


            return value;

        }


        /* =============================================
           SLEEP SCHEDULE
        ============================================= */

        case "sleepSchedule":{

            const sleepTime =
                d.sleepTime ??
                d.bedTime ??
                d.bedtime ??
                "";

            const wakeTime =
                d.wakeTime ??
                d.wakeUpTime ??
                d.wakeupTime ??
                "";


            return {

                sleepTime,
                wakeTime

            };

        }


        /* =============================================
           SUGAR
           أكلت / لم آكل
        ============================================= */

        case "sugar":{

            const value =
                d.sugar ??
                d.sugars ??
                d.ateSugar ??
                d.sugarEaten ??
                "";


            if(
                value === true ||
                value === "yes" ||
                value === "ate" ||
                value === "أكلت"
            ){

                return "أكلت";

            }


            if(
                value === false ||
                value === "no" ||
                value === "not_eaten" ||
                value === "لم آكل"
            ){

                return "لم آكل";

            }


            return "";

        }


        /* =============================================
           SMOKING
           نعم / لا
        ============================================= */

        case "smoking":{

            const value =
                d.smoking ??
                d.smoked ??
                d.smokingToday ??
                "";


            if(
                value === true ||
                value === "yes" ||
                value === "نعم"
            ){

                return "نعم";

            }


            if(
                value === false ||
                value === "no" ||
                value === "لا"
            ){

                return "لا";

            }


            return "";

        }


        default:

            return 0;

    }

}


/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatNumber(value){

    if(!Number.isFinite(Number(value))){

        return "0";

    }


    return Number(value)
        .toLocaleString("ar-DZ");

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(time){

    if(!time){

        return "لم يتم التسجيل";

    }


    const parts =
        String(time).split(":");


    if(parts.length < 2){

        return String(time);

    }


    let hour =
        Number(parts[0]);

    const minute =
        String(parts[1])
        .padStart(2,"0");


    if(!Number.isFinite(hour)){

        return String(time);

    }


    const period =
        hour >= 12
            ? "مساءً"
            : "صباحًا";


    hour =
        hour % 12 || 12;


    return `${hour}:${minute} ${period}`;

}


/* =========================================================
   FORMAT DAILY VALUE
========================================================= */

function formatDailyValue(
    challenge,
    value,
    target
){

    switch(challenge.id){

        /* =============================================
           WATER
        ============================================= */

        case "water":

            return `${formatNumber(value)} / ${formatNumber(target)} كوب`;


        /* =============================================
           WALKING
        ============================================= */

        case "walking":

            return `${formatNumber(value)} / ${formatNumber(target)} متر`;


        /* =============================================
           SLEEP
        ============================================= */

        case "sleep":{

            const hours =
                Number(value) || 0;

            const targetHours =
                Number(target) || 0;


            return `${hours.toFixed(1)} / ${targetHours.toFixed(1)} ساعة`;

        }


        /* =============================================
           SLEEP SCHEDULE
        ============================================= */

        case "sleepSchedule":{

            const schedule =
                getSleepSchedule();


            const actualSleep =
                value?.sleepTime || "";

            const actualWake =
                value?.wakeTime || "";


            if(
                actualSleep ||
                actualWake
            ){

                return `
                    نوم ${formatTime(actualSleep)}
                    • استيقاظ ${formatTime(actualWake)}
                `;

            }


            return `
                الهدف:
                ${formatTime(schedule.sleepTime)}
                →
                ${formatTime(schedule.wakeTime)}
            `;

        }


        /* =============================================
           SUGAR
        ============================================= */

        case "sugar":

            if(value === "أكلت"){

                return "أكلت السكريات اليوم";

            }


            if(value === "لم آكل"){

                return "لم آكل السكريات اليوم";

            }


            return "لم يتم التسجيل بعد";


        /* =============================================
           SMOKING
        ============================================= */

        case "smoking":

            if(value === "نعم"){

                return "تم تسجيل التدخين اليوم";

            }


            if(value === "لا"){

                return "لم أدخن اليوم";

            }


            return "لم يتم التسجيل بعد";


        default:

            return "";

    }

}


/* =========================================================
   PERCENT
========================================================= */

function getPercent(
    challenge,
    value,
    target
){

    /* =============================================
       WATER / WALKING / SLEEP
    ============================================= */

    if(
        challenge.type === "number"
    ){

        const numericTarget =
            Number(target);

        const numericValue =
            Number(value);


        if(
            !Number.isFinite(numericTarget) ||
            numericTarget <= 0
        ){

            return 0;

        }


        if(
            !Number.isFinite(numericValue)
        ){

            return 0;

        }


        return Math.min(
            100,
            Math.round(
                (numericValue / numericTarget) *
                100
            )
        );

    }


    /* =============================================
       SLEEP SCHEDULE
    ============================================= */

    if(
        challenge.id === "sleepSchedule"
    ){

        const schedule =
            getSleepSchedule();


        const actualSleep =
            value?.sleepTime || "";

        const actualWake =
            value?.wakeTime || "";


        let completed = 0;


        if(actualSleep){

            completed++;

        }


        if(actualWake){

            completed++;

        }


        return Math.round(
            (completed / 2) * 100
        );

    }


    /* =============================================
       SUGAR
       الهدف: لم آكل
    ============================================= */

    if(
        challenge.id === "sugar"
    ){

        if(value === "لم آكل"){

            return 100;

        }


        if(value === "أكلت"){

            return 0;

        }


        return 0;

    }


    /* =============================================
       SMOKING
       الهدف: إيقاف التدخين
    ============================================= */

    if(
        challenge.id === "smoking"
    ){

        if(value === "لا"){

            return 100;

        }


        if(value === "نعم"){

            return 0;

        }


        return 0;

    }


    return 0;

}


/* =========================================================
   RENDER DAILY
========================================================= */

function renderDaily(){

    const list =
        document.getElementById(
            "dailyList"
        );


    list.innerHTML = "";


    const selected =
        challengeSettings.selected;


    /* =============================================
       NO CHALLENGES
    ============================================= */

    if(
        !Array.isArray(selected) ||
        selected.length === 0
    ){

        list.innerHTML = `

            <div class="empty-challenges">

                <div class="empty-icon">

                    <i class="fa-solid fa-list-check"></i>

                </div>


                <strong>
                    لم تختر متابعاتك اليومية بعد
                </strong>


                <p>
                    اختر من صفحة «تحدياتي» العادات
                    التي تريد متابعتها، وستظهر هنا
                    تلقائيًا.
                </p>


                <a
                    href="challenges.html"
                    class="empty-button">

                    <i class="fa-solid fa-sliders"></i>

                    اختيار تحدياتي

                </a>

            </div>

        `;


        setProgress(0);

        return;

    }


    const selectedDefinitions =
        CHALLENGES.filter(
            challenge =>
                selected.includes(
                    challenge.id
                )
        );


    selectedDefinitions.forEach(
        challenge => {

            const target =
                getTarget(challenge);


            const value =
                getDailyValue(
                    challenge.id
                );


            const percent =
                getPercent(
                    challenge,
                    value,
                    target
                );


            const card =
                document.createElement("a");


            card.href =
                challenge.link;


            card.className =
                "daily-card";


            card.style.setProperty(
                "--card-color",
                challenge.color
            );


            card.style.setProperty(
                "--icon-bg",
                challenge.bg
            );


            card.innerHTML = `

                <div class="daily-icon">

                    <i class="fa-solid ${challenge.icon}">
                    </i>

                </div>


                <div class="daily-main">

                    <div class="daily-name">

                        ${challenge.name}

                    </div>


                    <div class="daily-value">

                        ${formatDailyValue(
                            challenge,
                            value,
                            target
                        )}

                    </div>


                    <div class="daily-progress">

                        <span
                            style="width:${percent}%">
                        </span>

                    </div>

                </div>


                <div class="daily-percent">

                    ${percent}%

                </div>

            `;


            list.appendChild(card);

        }
    );


    updateOverallProgress();

}


/* =========================================================
   OVERALL PROGRESS
========================================================= */

function updateOverallProgress(){

    const selected =
        challengeSettings.selected;


    if(
        !Array.isArray(selected) ||
        selected.length === 0
    ){

        setProgress(0);

        return;

    }


    const selectedDefinitions =
        CHALLENGES.filter(
            challenge =>
                selected.includes(
                    challenge.id
                )
        );


    if(
        !selectedDefinitions.length
    ){

        setProgress(0);

        return;

    }


    let total = 0;


    selectedDefinitions.forEach(
        challenge => {

            const target =
                getTarget(challenge);


            const value =
                getDailyValue(
                    challenge.id
                );


            total +=
                getPercent(
                    challenge,
                    value,
                    target
                );

        }
    );


    const average =
        Math.round(
            total /
            selectedDefinitions.length
        );


    setProgress(average);

}


/* =========================================================
   PROGRESS
========================================================= */

function setProgress(percent){

    const circle =
        document.getElementById(
            "progressCircle"
        );


    const number =
        document.getElementById(
            "progressNumber"
        );


    const subtitle =
        document.getElementById(
            "scoreSubtitle"
        );


    const circumference =
        2 * Math.PI * 40;


    const offset =
        circumference -
        (percent / 100) *
        circumference;


    circle.style.strokeDasharray =
        circumference;


    circle.style.strokeDashoffset =
        offset;


    number.textContent =
        `${percent}%`;


    if(percent === 0){

        subtitle.textContent =
            "اختر تحدياتك اليومية لتظهر هنا.";

    }

    else if(percent < 50){

        subtitle.textContent =
            "بداية جيدة، واصل تسجيل عاداتك.";

    }

    else if(percent < 100){

        subtitle.textContent =
            "أنت في الطريق الصحيح، استمر.";

    }

    else{

        subtitle.textContent =
            "رائع! أكملت جميع تحدياتك اليوم.";

    }

}


/* =========================================================
   LOAD DAILY DATA
========================================================= */

async function loadDailyData(){

    if(!currentUser){

        return;

    }


    const dateKey =
        formatDateKey(selectedDate);


    dailyData = {};


    const paths = [

        [
            "dailyTracking",
            dateKey
        ],

        [
            "daily",
            dateKey
        ]

    ];


    try{

        for(
            const path of paths
        ){

            const ref =
                doc(
                    db,
                    "users",
                    currentUser.uid,
                    path[0],
                    path[1]
                );


            const snap =
                await getDoc(ref);


            if(snap.exists()){

                dailyData =
                    snap.data() || {};

                break;

            }

        }


    }catch(error){

        console.error(
            "Daily data error:",
            error
        );

    }


    renderDaily();

}


/* =========================================================
   CALENDAR MODAL
========================================================= */

const calendarModal =
    document.getElementById(
        "calendarModal"
    );


const calendarInput =
    document.getElementById(
        "calendarInput"
    );


document.getElementById(
    "openCalendar"
).addEventListener(
    "click",
    ()=>{

        calendarInput.value =
            formatDateKey(
                selectedDate
            );


        calendarModal.classList.add(
            "show"
        );

    }
);


document.getElementById(
    "closeCalendar"
).addEventListener(
    "click",
    ()=>{

        calendarModal.classList.remove(
            "show"
        );

    }
);


calendarInput.addEventListener(
    "change",
    async ()=>{

        if(!calendarInput.value){

            return;

        }


        const parts =
            calendarInput.value
            .split("-")
            .map(Number);


        selectedDate =
            new Date(
                parts[0],
                parts[1]-1,
                parts[2]
            );


        calendarModal.classList.remove(
            "show"
        );


        renderWeek();

        await loadDailyData();

    }
);


calendarModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            calendarModal
        ){

            calendarModal.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            user;


        try{

            await loadUser();

            await loadChallenges();

            await loadDailyData();

            renderWeek();

        }catch(error){

            console.error(
                "Dashboard error:",
                error
            );

        }


        setTimeout(
            ()=>{

                document
                    .getElementById(
                        "loadingScreen"
                    )
                    .classList.add(
                        "hide"
                    );

            },
            300
        );

    }
);

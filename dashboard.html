<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<meta name="theme-color" content="#F7F7F8">

<title>صحتي+ | الرئيسية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{

    --black:#111111;
    --black-2:#1C1C1C;

    --pink:#FE2C55;
    --pink-light:#FFF0F3;

    --cyan:#25F4EE;

    --blue:#1976D2;
    --blue-light:#EDF5FF;

    --purple:#7357D8;
    --purple-light:#F1EEFF;

    --green:#159A7C;
    --green-light:#EAF8F4;

    --orange:#E58A00;
    --orange-light:#FFF4DF;

    --text:#171717;
    --text-2:#3F3F3F;
    --muted:#7B7B7B;

    --bg:#F5F5F6;
    --white:#FFFFFF;

    --border:#E5E5E7;

    --shadow:
        0 4px 18px rgba(0,0,0,.055);

    --shadow-soft:
        0 2px 10px rgba(0,0,0,.035);
}


/* =========================================================
   BASE
========================================================= */

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    background:var(--bg);

    color:var(--text);

    font-family:"Cairo",sans-serif;

    font-size:14px;

    font-weight:600;

    -webkit-font-smoothing:antialiased;
}

button,
input,
a{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}


/* =========================================================
   APP
========================================================= */

.app{

    width:100%;

    max-width:650px;

    margin:auto;

    padding:
        0
        15px
        105px;
}


/* =========================================================
   TOP HEADER
========================================================= */

.top-medical{

    margin-left:-15px;
    margin-right:-15px;

    padding:
        16px
        15px
        20px;

    background:
        linear-gradient(
            180deg,
            #FAFAFA 0%,
            #F5F5F6 100%
        );

    border-bottom:
        1px solid
        #E7E7E8;
}


/* =========================================================
   PROFILE CARD
========================================================= */

.profile-card{

    position:relative;

    overflow:hidden;

    background:var(--white);

    border:
        1px solid
        var(--border);

    border-radius:24px;

    padding:16px;

    box-shadow:var(--shadow);
}


/* elegant top line */

.profile-card::before{

    content:"";

    position:absolute;

    top:0;
    right:0;
    left:0;

    height:3px;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--pink)
        );
}


/* soft decorative circle */

.profile-card::after{

    content:"";

    position:absolute;

    width:120px;
    height:120px;

    border-radius:50%;

    background:
        rgba(254,44,85,.035);

    left:-55px;
    bottom:-65px;

    pointer-events:none;
}


/* =========================================================
   PROFILE MAIN
========================================================= */

.profile-content{

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;

    gap:13px;

    direction:ltr;

    padding-top:2px;
}


.profile-avatar-wrap{

    width:66px;
    height:66px;

    flex:none;

    padding:3px;

    border-radius:50%;

    background:#F3F3F3;

    border:
        1px solid
        #DCDCDC;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.07);

    overflow:hidden;
}


.profile-avatar{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:50%;
}


.profile-info{

    direction:rtl;

    min-width:0;

    flex:1;
}


.profile-name{

    color:#111;

    font-size:19px;

    line-height:1.4;

    font-weight:900;

    margin-bottom:8px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.profile-details{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:6px 12px;
}


.profile-detail{

    min-width:0;

    display:flex;

    align-items:center;

    gap:6px;

    color:#666;

    font-size:11px;

    font-weight:700;
}


.profile-detail i{

    width:22px;
    height:22px;

    flex:none;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:7px;

    background:#F4F4F4;

    color:#333;

    font-size:10px;
}


.profile-detail span{

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


/* =========================================================
   MEDICAL INFO
========================================================= */

.profile-medical{

    position:relative;

    z-index:2;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:9px;

    margin-top:14px;
}


.medical-item{

    min-width:0;

    padding:10px 11px;

    background:#FAFAFA;

    border:
        1px solid
        #E8E8E8;

    border-radius:14px;
}


.medical-label{

    display:flex;

    align-items:center;

    gap:5px;

    color:#808080;

    font-size:10px;

    font-weight:800;

    margin-bottom:4px;
}


.medical-label i{

    color:var(--pink);

    font-size:9px;
}


.medical-value{

    color:#222;

    font-size:12px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.medical-value.empty{

    color:#929292;

    font-weight:700;
}


/* =========================================================
   PROFILE EDIT
========================================================= */

.profile-edit{

    position:absolute;

    left:13px;
    top:16px;

    z-index:5;

    width:32px;
    height:32px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:#111;

    color:#FFF;

    font-size:11px;

    box-shadow:
        0 3px 9px
        rgba(0,0,0,.13);

    transition:.2s;
}


.profile-edit:active{
    transform:scale(.91);
}


/* =========================================================
   CALENDAR
========================================================= */

.integrated-calendar{

    margin-top:18px;
}


.date-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:10px;

    padding:0 2px;
}


.date-title{

    color:#181818;

    font-size:15px;

    font-weight:900;
}


.calendar-button{

    width:38px;
    height:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:
        1px solid
        #E0E0E0;

    border-radius:12px;

    background:#FFF;

    color:#222;

    font-size:14px;

    box-shadow:var(--shadow-soft);

    transition:.2s;
}


.calendar-button:active{
    transform:scale(.93);
}


/* =========================================================
   WEEK
========================================================= */

.week{

    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    gap:4px;
}


.day{

    text-align:center;

    padding:5px 2px;

    border-radius:14px;

    color:#858585;

    cursor:pointer;

    transition:.2s;
}


.day-name{

    color:#909090;

    font-size:9px;

    font-weight:800;

    margin-bottom:5px;
}


.day-number{

    width:35px;
    height:35px;

    margin:auto;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:#333;

    font-size:13px;

    font-weight:900;

    transition:.2s;
}


.day.active .day-number{

    background:#111;

    color:#FFF;

    box-shadow:
        0 4px 10px
        rgba(0,0,0,.15);
}


.day.today:not(.active) .day-number{

    border:
        2px solid
        var(--pink);

    color:#222;
}


/* =========================================================
   SCORE CARD
========================================================= */

.score-card{

    position:relative;

    overflow:hidden;

    margin-top:18px;

    margin-bottom:25px;

    padding:18px;

    border-radius:23px;

    background:#111;

    color:#FFF;

    box-shadow:
        0 7px 22px
        rgba(0,0,0,.13);
}


.score-card::before{

    content:"";

    position:absolute;

    width:150px;
    height:150px;

    border-radius:50%;

    left:-85px;
    top:-75px;

    background:
        rgba(37,244,238,.07);
}


.score-card::after{

    content:"";

    position:absolute;

    width:120px;
    height:120px;

    border-radius:50%;

    right:-65px;
    bottom:-70px;

    background:
        rgba(254,44,85,.08);
}


.score-inner{

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;

    gap:16px;
}


.score-text{

    flex:1;

    min-width:0;
}


.score-title{

    margin-bottom:5px;

    font-size:18px;

    font-weight:900;
}


.score-subtitle{

    color:
        rgba(255,255,255,.72);

    font-size:12px;

    line-height:1.9;

    font-weight:600;
}


.progress-ring{

    position:relative;

    width:88px;
    height:88px;

    flex:none;
}


.progress-ring svg{

    width:100%;
    height:100%;

    transform:rotate(-90deg);
}


.progress-ring circle{

    fill:none;

    stroke-width:8;
}


.progress-bg{

    stroke:
        rgba(255,255,255,.13);
}


.progress-value{

    stroke:var(--pink);

    stroke-linecap:round;

    transition:
        stroke-dashoffset .7s ease;
}


.progress-number{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#FFF;

    font-size:18px;

    font-weight:900;
}


/* =========================================================
   SECTION
========================================================= */

.section{

    margin-bottom:26px;
}


.section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:12px;
}


.section-title{

    display:flex;

    align-items:center;

    gap:9px;

    color:#181818;

    font-size:17px;

    font-weight:900;
}


.section-title i{

    width:31px;
    height:31px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:var(--pink-light);

    color:var(--pink);

    font-size:13px;
}


/* =========================================================
   HEALTH GRID
========================================================= */

.health-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;
}


.health-item{

    min-width:0;

    padding:13px 5px 12px;

    text-align:center;

    background:#FFF;

    border:
        1px solid
        #E5E5E7;

    border-radius:18px;

    box-shadow:var(--shadow-soft);

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}


.health-item:active{

    transform:scale(.95);

    box-shadow:
        0 2px 7px
        rgba(0,0,0,.05);
}


.health-icon{

    width:46px;
    height:46px;

    margin:
        0 auto 7px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:15px;

    font-size:18px;
}


.health-name{

    color:#333;

    font-size:11px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.blue-icon{
    background:var(--blue-light);
    color:var(--blue);
}


.pink-icon{
    background:var(--pink-light);
    color:var(--pink);
}


.purple-icon{
    background:var(--purple-light);
    color:var(--purple);
}


.green-icon{
    background:var(--green-light);
    color:var(--green);
}


/* =========================================================
   DAILY CHALLENGES
========================================================= */

.daily-list{

    display:grid;

    gap:9px;
}


.daily-card{

    position:relative;

    display:flex;

    align-items:center;

    gap:11px;

    min-height:78px;

    padding:11px 12px;

    overflow:hidden;

    background:#FFF;

    border:
        1px solid
        #E5E5E7;

    border-radius:18px;

    box-shadow:var(--shadow-soft);

    transition:
        transform .15s ease;
}


.daily-card::before{

    content:"";

    position:absolute;

    right:0;
    top:0;
    bottom:0;

    width:4px;

    background:var(--card-color);
}


.daily-card:active{

    transform:scale(.985);
}


.daily-icon{

    width:46px;
    height:46px;

    flex:none;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:var(--icon-bg);

    color:var(--card-color);

    font-size:18px;
}


.daily-main{

    flex:1;

    min-width:0;
}


.daily-name{

    color:#1B1B1B;

    font-size:14px;

    font-weight:900;

    margin-bottom:2px;
}


.daily-value{

    color:#777;

    font-size:10px;

    font-weight:700;

    margin-bottom:6px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.daily-progress{

    width:100%;

    height:5px;

    overflow:hidden;

    background:#EEEEEE;

    border-radius:10px;
}


.daily-progress span{

    display:block;

    height:100%;

    border-radius:10px;

    background:var(--card-color);

    transition:
        width .5s ease;
}


.daily-percent{

    width:43px;

    flex:none;

    text-align:center;

    color:var(--card-color);

    font-size:12px;

    font-weight:900;
}


/* =========================================================
   EMPTY CHALLENGES
========================================================= */

.empty-challenges{

    padding:27px 18px;

    text-align:center;

    background:#FFF;

    border:
        1px dashed
        #D7D7D9;

    border-radius:20px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.025);
}


.empty-icon{

    width:55px;
    height:55px;

    margin:
        0 auto 12px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:16px;

    background:var(--pink-light);

    color:var(--pink);

    font-size:21px;
}


.empty-challenges strong{

    display:block;

    color:#222;

    font-size:15px;

    font-weight:900;

    margin-bottom:5px;
}


.empty-challenges p{

    color:#777;

    font-size:12px;

    line-height:1.9;

    font-weight:600;

    margin-bottom:15px;
}


.empty-button{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    padding:10px 17px;

    border-radius:12px;

    background:#111;

    color:#FFF;

    font-size:12px;

    font-weight:900;

    box-shadow:
        0 5px 13px
        rgba(0,0,0,.12);
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{

    position:fixed;

    z-index:100;

    bottom:0;
    left:50%;

    width:min(650px,100%);

    transform:translateX(-50%);

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    padding:
        7px
        8px
        max(8px,env(safe-area-inset-bottom));

    background:
        rgba(255,255,255,.97);

    backdrop-filter:blur(18px);

    border-top:
        1px solid
        #E2E2E4;
}


.nav-item{

    position:relative;

    padding:5px;

    text-align:center;

    color:#999;

    font-size:11px;

    font-weight:700;

    transition:.2s;
}


.nav-item i{

    display:block;

    margin-bottom:4px;

    font-size:19px;
}


.nav-item.active{

    color:#111;

    font-weight:900;
}


.nav-item.active i{

    color:var(--pink);
}


.nav-item.active::after{

    content:"";

    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:var(--pink);

    bottom:0;

    left:50%;

    transform:translateX(-50%);
}


/* =========================================================
   LOADING
========================================================= */

.loading-screen{

    position:fixed;

    z-index:9999;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#FFF;

    transition:.3s;
}


.loading-screen.hide{

    opacity:0;

    pointer-events:none;
}


.loading-box{

    text-align:center;
}


.loading-logo{

    width:70px;
    height:70px;

    margin:
        0 auto 12px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:21px;

    background:#111;

    color:#FFF;

    font-size:28px;

    box-shadow:
        4px 4px 0 var(--cyan),
        -4px -4px 0 var(--pink);
}


.loading-box strong{

    display:block;

    color:#111;

    font-size:21px;

    font-weight:900;
}


.loading-box p{

    margin-top:3px;

    color:#7C7C7C;

    font-size:12px;

    font-weight:600;
}


.spinner{

    width:24px;
    height:24px;

    margin:15px auto 0;

    border:
        3px solid
        #E8E8E8;

    border-top-color:var(--pink);

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   MODAL
========================================================= */

.modal{

    position:fixed;

    z-index:500;

    inset:0;

    display:none;

    align-items:flex-end;
    justify-content:center;

    background:
        rgba(0,0,0,.42);

    backdrop-filter:blur(5px);
}


.modal.show{

    display:flex;
}


.modal-box{

    width:min(650px,100%);

    padding:21px;

    background:#FFF;

    border-radius:
        24px
        24px
        0
        0;

    animation:
        slideUp .25s ease;
}


@keyframes slideUp{

    from{
        transform:translateY(100%);
    }

    to{
        transform:translateY(0);
    }

}


.modal-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;
}


.modal-head strong{

    color:#181818;

    font-size:17px;

    font-weight:900;
}


.close-modal{

    width:37px;
    height:37px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:#F0F0F0;

    color:#333;

    font-size:15px;
}


/* =========================================================
   SMALL SCREENS
========================================================= */

@media(max-width:400px){

    .app{

        padding-left:11px;
        padding-right:11px;
    }


    .top-medical{

        margin-left:-11px;
        margin-right:-11px;

        padding-left:11px;
        padding-right:11px;
    }


    .profile-card{

        padding:13px;
    }


    .profile-avatar-wrap{

        width:59px;
        height:59px;
    }


    .profile-name{

        font-size:17px;
    }


    .profile-details{

        gap:5px 8px;
    }


    .profile-detail{

        font-size:10px;
    }


    .profile-medical{

        gap:7px;
    }


    .medical-item{

        padding:9px;
    }


    .health-grid{

        gap:6px;
    }


    .health-item{

        padding:
            11px
            3px
            10px;
    }


    .health-icon{

        width:43px;
        height:43px;

        font-size:17px;
    }


    .health-name{

        font-size:10px;
    }


    .day-number{

        width:32px;
        height:32px;
    }


    .score-card{

        padding:16px;
    }


    .progress-ring{

        width:80px;
        height:80px;
    }


    .score-title{

        font-size:17px;
    }


    .score-subtitle{

        font-size:11px;
    }


    .daily-card{

        gap:9px;

        padding:10px;
    }


    .daily-icon{

        width:43px;
        height:43px;

        font-size:17px;
    }


    .daily-name{

        font-size:13px;
    }

}


@media(max-width:350px){

    .profile-details{

        grid-template-columns:1fr;
    }


    .profile-medical{

        grid-template-columns:1fr;
    }


    .day-number{

        width:29px;
        height:29px;

        font-size:12px;
    }


    .daily-percent{

        width:38px;

        font-size:11px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     LOADING
========================================================= -->

<div class="loading-screen" id="loadingScreen">

    <div class="loading-box">

        <div class="loading-logo">

            <i class="fa-solid fa-heart-pulse"></i>

        </div>

        <strong>Si7a+</strong>

        <p>
            صحتي+ — مساحتك الصحية الشخصية
        </p>

        <div class="spinner"></div>

    </div>

</div>


<main class="app">


<!-- =========================================================
     TOP
========================================================= -->

<section class="top-medical">


    <!-- PROFILE -->

    <section class="profile-card">


        <div class="profile-content">


            <div class="profile-avatar-wrap">

                <img
                    id="profileAvatar"
                    class="profile-avatar"
                    alt="صورة المستخدم">

            </div>


            <div class="profile-info">


                <div
                    class="profile-name"
                    id="profileName">

                    مستخدم صحتي

/* =========================================================
   DATE
========================================================= */

function formatDateKey(date){

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;

}


function arabicDate(date){

    return new Intl.DateTimeFormat(
        "ar-DZ",
        {
            weekday:"long",
            day:"numeric",
            month:"long"
        }
    ).format(date);

}


/* =========================================================
   WEEK
========================================================= */

function renderWeek(){

    const week =
        document.getElementById("week");

    week.innerHTML = "";

    const selectedKey =
        formatDateKey(selectedDate);

    const start =
        new Date(selectedDate);

    const day =
        start.getDay();

    const mondayOffset =
        day === 0
            ? -6
            : 1 - day;

    start.setDate(
        start.getDate() +
        mondayOffset
    );

    const names = [

        "الإثنين",
        "الثلاثاء",
        "الأربعاء",
        "الخميس",
        "الجمعة",
        "السبت",
        "الأحد"

    ];


    for(let i=0;i<7;i++){

        const d =
            new Date(start);

        d.setDate(
            start.getDate()+i
        );

        const key =
            formatDateKey(d);

        const item =
            document.createElement("div");

        item.className = "day";


        if(key === selectedKey){

            item.classList.add("active");

        }


        if(
            key ===
            formatDateKey(new Date())
        ){

            item.classList.add("today");

        }


        item.innerHTML = `

            <div class="day-name">
                ${names[i].slice(0,3)}
            </div>

            <div class="day-number">
                ${d.getDate()}
            </div>

        `;


        item.addEventListener(
            "click",
            async ()=>{

                selectedDate =
                    new Date(d);

                document.getElementById(
                    "selectedDateText"
                ).textContent =
                    arabicDate(
                        selectedDate
                    );

                renderWeek();

                await loadDailyData();

            }
        );


        week.appendChild(item);

    }


    document.getElementById(
        "selectedDateText"
    ).textContent =
        arabicDate(selectedDate);

}


/* =========================================================
   PROFILE
========================================================= */

function normalizeGender(value){

    if(!value){

        return "غير محدد";

    }


    const v =
        String(value).toLowerCase();


    if(
        v === "male" ||
        v === "ذكر" ||
        v === "homme" ||
        v === "m"
    ){

        return "ذكر";

    }


    if(
        v === "female" ||
        v === "أنثى" ||
        v === "femme" ||
        v === "f"
    ){

        return "أنثى";

    }


    return String(value);

}


function normalizeBlood(value){

    if(!value){

        return "غير محددة";

    }

    return String(value);

}


function calculateBMI(weight,height){

    const w = Number(weight);

    const h = Number(height);


    if(
        !Number.isFinite(w) ||
        !Number.isFinite(h) ||
        w <= 0 ||
        h <= 0
    ){

        return null;

    }


    const meters =
        h / 100;


    return w /
        (meters * meters);

}


function bmiStatus(bmi){

    if(bmi === null){

        return "";

    }


    if(bmi < 18.5){

        return "نحافة";

    }


    if(bmi < 25){

        return "طبيعي";

    }


    if(bmi < 30){

        return "زيادة في الوزن";

    }


    return "سمنة";

}


function getDiseases(data){

    const value =

        data.chronicDiseases ??
        data.chronicDisease ??
        data.diseases ??
        data.medicalConditions ??
        data.chronicConditions ??
        "";


    if(Array.isArray(value)){

        return value.length
            ? value.join("، ")
            : "لا توجد معلومات";

    }


    if(value === true){

        return "موجودة";

    }


    if(
        !value ||
        String(value).trim() === ""
    ){

        return "لا توجد معلومات";

    }


    return String(value);

}

/* =========================================================

========================================================= */

async function loadUser(){

    if(!currentUser){

        return;

    }


    try{

        const ref =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const snap =
            await getDoc(ref);


        if(snap.exists()){

            userData =
                snap.data() || {};

        }else{

            userData = {};

        }


        renderProfile();

    }catch(error){

        console.error(
            "User loading error:",
            error
        );


        userData = {};

        renderProfile();

    }

}


/* =========================================================
   LOAD CHALLENGES
========================================================= */

async function loadChallenges(){

    if(!currentUser){

        return;

    }


    let found = false;


    try{

        const paths = [

            [
                "challengeSettings",
                "main"
            ],

            [
                "challenges",
                "settings"
            ],

            [
                "healthSettings",
                "challenges"
            ]

        ];


        for(const path of paths){

            const ref =
                doc(
                    db,
                    "users",
                    currentUser.uid,
                    path[0],
                    path[1]
                );


            const snap =
                await getDoc(ref);


            if(snap.exists()){

                const data =
                    snap.data() || {};


                let selected =
                    data.selected ??
                    data.selectedChallenges ??
                    data.challenges;


                if(!Array.isArray(selected)){

                    selected =
                        CHALLENGES
                        .filter(
                            item =>
                                data[item.id] === true
                        )
                        .map(
                            item =>
                                item.id
                        );

                }


                challengeSettings = {

                    selected:
                        selected || [],

                    targets:
                        data.targets || {},

                    values:
                        data.values || {}

                };


                found = true;

                break;

            }

        }

    }catch(error){

        console.error(
            "Challenge settings error:",
            error
        );

    }


    if(!found){

        challengeSettings = {

            selected:[],

            targets:{},

            values:{}

        };

    }


    renderDaily();

}


/* =========================================================
   TARGET
========================================================= */

function getTarget(challenge){

    const custom =
        challengeSettings.targets?.[
            challenge.id
        ];


    if(
        custom !== undefined &&
        custom !== null &&
        custom !== ""
    ){

        if(
            challenge.type === "number"
        ){

            const value =
                Number(custom);


            if(
                Number.isFinite(value) &&
                value > 0
            ){

                return value;

            }

        }


        return custom;

    }


    return challenge.target;

}


/* =========================================================

function getSleepSchedule(){

/* =========================================================
   DAILY VALUE
========================================================= */

function getDailyValue(id){

    const d =
        dailyData || {};


    switch(id){

        case "water":

            return Number(
                d.waterCups ??
                d.water ??
                d.waterIntake ??
                0
            );


        case "walking":

            return Number(
                d.walkingMeters ??
                d.distanceMeters ??
                d.meters ??
                d.walking ??
                d.distance ??
                0
            );


        case "sleep":{

            let value =
                Number(
                    d.sleepHours ??
                    d.hoursSleep ??
                    d.sleep ??
                    0
                );


            if(value > 24){

                value =
                    value / 60;

            }


            return value;

        }


        case "sleepSchedule":{

            const sleepTime =
                d.sleepTime ??
                d.bedTime ??
                d.bedtime ??
                "";

            const wakeTime =
                d.wakeTime ??
                d.wakeUpTime ??
                d.wakeupTime ??
                "";


            return {

                sleepTime,
                wakeTime

            };

        }


        case "sugar":{

            const value =
                d.sugar ??
                d.sugars ??
                d.ateSugar ??
                d.sugarEaten ??
                "";


            if(
                value === true ||
                value === "yes" ||
                value === "ate" ||
                value === "أكلت"
            ){

                return "أكلت";

            }


            if(
                value === false ||
                value === "no" ||
                value === "not_eaten" ||
                value === "لم آكل"
            ){

                return "لم آكل";

            }


            return "";

        }


        case "smoking":{

            const value =
                d.smoking ??
                d.smoked ??
                d.smokingToday ??
                "";


            if(
                value === true ||
                value === "yes" ||
                value === "نعم"
            ){

                return "نعم";

            }


            if(
                value === false ||
                value === "no" ||
                value === "لا"
            ){

                return "لا";

            }


            return "";

        }


        default:

            return 0;

    }

}


/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatNumber(value){

    if(!Number.isFinite(Number(value))){

        return "0";

    }


    return Number(value)
        .toLocaleString("ar-DZ");

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(time){

    if(!time){

        return "لم يتم التسجيل";

    }


    const parts =
        String(time).split(":");


    if(parts.length < 2){

        return String(time);

    }


    let hour =
        Number(parts[0]);

    const minute =
        String(parts[1])
        .padStart(2,"0");


    if(!Number.isFinite(hour)){

        return String(time);

    }


    const period =
        hour >= 12
            ? "مساءً"
            : "صباحًا";


    hour =
        hour % 12 || 12;


    return `${hour}:${minute} ${period}`;

}


/* =========================================================
   FORMAT DAILY
========================================================= */

function formatDailyValue(
    challenge,
    value,
    target
){

    switch(challenge.id){

        case "water":

            return `${formatNumber(value)} / ${formatNumber(target)} كوب`;


        case "walking":

            return `${formatNumber(value)} / ${formatNumber(target)} متر`;


        case "sleep":{

            const hours =
                Number(value) || 0;

            const targetHours =
                Number(target) || 0;


            return `${hours.toFixed(1)} / ${targetHours.toFixed(1)} ساعة`;

        }


        case "sleepSchedule":{

            const schedule =
                getSleepSchedule();


            const actualSleep =
                value?.sleepTime || "";

            const actualWake =
                value?.wakeTime || "";


            if(
                actualSleep ||
                actualWake
            ){

                return `
                    نوم ${formatTime(actualSleep)}
                    • استيقاظ ${formatTime(actualWake)}
                `;

            }


            return `
                الهدف:
                ${formatTime(schedule.sleepTime)}
                →
                ${formatTime(schedule.wakeTime)}
            `;

        }


        case "sugar":

            if(value === "أكلت"){

                return "أكلت السكريات اليوم";

            }


            if(value === "لم آكل"){

                return "لم آكل السكريات اليوم";

            }


            return "لم يتم التسجيل بعد";


        case "smoking":

            if(value === "نعم"){

                return "تم تسجيل التدخين اليوم";

            }


            if(value === "لا"){

                return "لم أدخن اليوم";

            }


            return "لم يتم التسجيل بعد";


        default:

            return "";

    }

}


/* =========================================================
   PERCENT
========================================================= */

function getPercent(
    challenge,
    value,
    target
){

    if(
        challenge.type === "number"
    ){

        const numericTarget =
            Number(target);

        const numericValue =
            Number(value);


        if(
            !Number.isFinite(numericTarget) ||
            numericTarget <= 0
        ){

            return 0;

        }


        if(
            !Number.isFinite(numericValue)
        ){

            return 0;

        }


        return Math.min(
            100,
            Math.round(
                (numericValue / numericTarget) *
                100
            )
        );

    }


    if(
        challenge.id === "sleepSchedule"
    ){

        const actualSleep =
            value?.sleepTime || "";

        const actualWake =
            value?.wakeTime || "";


        let completed = 0;


        if(actualSleep){

            completed++;

        }


        if(actualWake){

            completed++;

        }


        return Math.round(
            (completed / 2) * 100
        );

    }


    if(
        challenge.id === "sugar"
    ){

        if(value === "لم آكل"){

            return 100;

        }


        if(value === "أكلت"){

            return 0;

        }


        return 0;

    }


    if(
        challenge.id === "smoking"
    ){

        if(value === "لا"){

            return 100;

        }


        if(value === "نعم"){

            return 0;

        }


        return 0;

    }


    return 0;

}


/* =========================================================
   RENDER DAILY
========================================================= */

function renderDaily(){

    const list =
        document.getElementById(
            "dailyList"
        );


    list.innerHTML = "";


    const selected =
        challengeSettings.selected;


    if(
        !Array.isArray(selected) ||
        selected.length === 0
    ){

        list.innerHTML = `

            <div class="empty-challenges">

                <div class="empty-icon">

                    <i class="fa-solid fa-list-check"></i>

                </div>


                <strong>
                    لم تختر متابعاتك اليومية بعد
                </strong>


                <p>
                    اختر من صفحة «تحدياتي» العادات
                    التي تريد متابعتها، وستظهر هنا
                    تلقائيًا.
                </p>


                <a
                    href="challenges.html"
                    class="empty-button">

                    <i class="fa-solid fa-sliders"></i>

                    اختيار تحدياتي

                </a>

            </div>

        `;


        setProgress(0);

        return;

    }


    const selectedDefinitions =
        CHALLENGES.filter(
            challenge =>
                selected.includes(
                    challenge.id
                )
        );


    selectedDefinitions.forEach(
        challenge => {

            const target =
                getTarget(challenge);


            const value =
                getDailyValue(
                    challenge.id
                );


            const percent =
                getPercent(
                    challenge,
                    value,
                    target
                );


            const card =
                document.createElement("a");


            card.href =
                challenge.link;


            card.className =
                "daily-card";


            card.style.setProperty(
                "--card-color",
                challenge.color
            );


            card.style.setProperty(
                "--icon-bg",
                challenge.bg
            );


            card.innerHTML = `

                <div class="daily-icon">

                    <i class="fa-solid ${challenge.icon}"></i>

                </div>


                <div class="daily-main">

                    <div class="daily-name">
                        ${challenge.name}
                    </div>


                    <div class="daily-value">

                        ${formatDailyValue(
                            challenge,
                            value,
                            target
                        )}

                    </div>


                    <div class="daily-progress">

                        <span
                            style="width:${percent}%">
                        </span>

                    </div>

                </div>


                <div class="daily-percent">

                    ${percent}%

                </div>

            `;


            list.appendChild(card);

        }
    );


    updateOverallProgress();

}


/* =========================================================
   OVERALL PROGRESS
========================================================= */

function updateOverallProgress(){

    const selected =
        challengeSettings.selected;


    if(
        !Array.isArray(selected) ||
        selected.length === 0
    ){

        setProgress(0);

        return;

    }


    const selectedDefinitions =
        CHALLENGES.filter(
            challenge =>
                selected.includes(
                    challenge.id
                )
        );


    if(
        !selectedDefinitions.length
    ){

        setProgress(0);

        return;

    }


    let total = 0;


    selectedDefinitions.forEach(
        challenge => {

            const target =
                getTarget(challenge);


            const value =
                getDailyValue(
                    challenge.id
                );


            total +=
                getPercent(
                    challenge,
                    value,
                    target
                );

        }
    );


    const average =
        Math.round(
            total /
            selectedDefinitions.length
        );


    setProgress(average);

}


/* =========================================================
   PROGRESS
========================================================= */

function setProgress(percent){

    const circle =
        document.getElementById(
            "progressCircle"
        );


    const number =
        document.getElementById(
            "progressNumber"
        );


    const subtitle =
        document.getElementById(
            "scoreSubtitle"
        );


    const circumference =
        2 * Math.PI * 40;


    const offset =
        circumference -
        (percent / 100) *
        circumference;


    circle.style.strokeDasharray =
        circumference;


    circle.style.strokeDashoffset =
        offset;


    number.textContent =
        `${percent}%`;


    if(percent === 0){

        subtitle.textContent =
            "اختر تحدياتك اليومية لتظهر هنا.";

    }

    else if(percent < 50){

        subtitle.textContent =
            "بداية جيدة، واصل تسجيل عاداتك.";

    }

    else if(percent < 100){

        subtitle.textContent =
            "أنت في الطريق الصحيح، استمر.";

    }

    else{

        subtitle.textContent =
            "رائع! أكملت جميع تحدياتك اليوم.";

    }

}


/* =========================================================
   LOAD DAILY DATA
========================================================= */

async function loadDailyData(){

    if(!currentUser){

        return;

    }


    const dateKey =
        formatDateKey(selectedDate);


    dailyData = {};


    const paths = [

        [
            "dailyTracking",
            dateKey
        ],

        [
            "daily",
            dateKey
        ]

    ];


    try{

        for(
            const path of paths
        ){

            const ref =
                doc(
                    db,
                    "users",
                    currentUser.uid,
                    path[0],
                    path[1]
                );


            const snap =
                await getDoc(ref);


            if(snap.exists()){

                dailyData =
                    snap.data() || {};

                break;

            }

        }


    }catch(error){

        console.error(
            "Daily data error:",
            error
        );

    }


    renderDaily();

}


/* =========================================================
   CALENDAR MODAL
========================================================= */

const calendarModal =
    document.getElementById(
        "calendarModal"
    );


const calendarInput =
    document.getElementById(
        "calendarInput"
    );


document.getElementById(
    "openCalendar"
).addEventListener(
    "click",
    ()=>{

        calendarInput.value =
            formatDateKey(
                selectedDate
            );


        calendarModal.classList.add(
            "show"
        );

    }
);


document.getElementById(
    "closeCalendar"
).addEventListener(
    "click",
    ()=>{

        calendarModal.classList.remove(
            "show"
        );

    }
);


calendarInput.addEventListener(
    "change",
    async ()=>{

        if(!calendarInput.value){

            return;

        }


        const parts =
            calendarInput.value
            .split("-")
            .map(Number);


        selectedDate =
            new Date(
                parts[0],
                parts[1]-1,
                parts[2]
            );


        calendarModal.classList.remove(
            "show"
        );


        renderWeek();

        await loadDailyData();

    }
);


calendarModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            calendarModal
        ){

            calendarModal.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            user;


        try{

            await loadUser();

            await loadChallenges();

            await loadDailyData();

            renderWeek();

        }catch(error){

            console.error(
                "Dashboard error:",
                error
            );

        }


        setTimeout(
            ()=>{

                document
                    .getElementById(
                        "loadingScreen"
                    )
                    .classList.add(
                        "hide"
                    );

            },
            300
        );

    }
);

<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563EB">
    <title>Si7a | Dashboard</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(165deg, #3B82F6 0%, #2563EB 40%, #1E3A8A 100%);
            color: #fff;
        }

        .full-screen-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 15px 15px 90px 15px; /* مسافة سفلية للتنقل السفلي */
        }

        /* Background Shapes */
        .wave-bg-1 {
            position: fixed;
            top: -80px;
            left: -80px;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 45%;
            transform: rotate(-15deg);
            pointer-events: none;
        }

        .wave-bg-2 {
            position: fixed;
            bottom: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 40%;
            transform: rotate(25deg);
            pointer-events: none;
        }

        /* Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 5;
            margin-bottom: 20px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
        }

        .avatar-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            object-fit: cover;
        }

        .welcome-text {
            font-size: 14px;
            font-weight: bold;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            font-size: 18px;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Content Container */
        .page-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 2;
        }

        /* Metallic White Card */
        .metallic-white-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(230, 240, 255, 0.88) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 22px;
            padding: 18px;
            color: #1E293B;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card-header-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            color: #1E3A8A;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(30, 58, 138, 0.12);
        }

        /* Active Challenges Grid */
        .challenges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .dash-item-card {
            background: #ffffff;
            border: 1px solid rgba(30, 58, 138, 0.1);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s;
        }

        .dash-item-card:active {
            transform: scale(0.97);
        }

        .dash-item-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .dash-item-title {
            font-size: 12px;
            color: #64748B;
            font-weight: bold;
        }

        .dash-item-value {
            font-size: 15px;
            color: #1E3A8A;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: #64748B;
            font-size: 13px;
        }

        .empty-state i {
            font-size: 32px;
            margin-bottom: 8px;
            color: #94A3B8;
        }

        /* Sidebar & Bottom Nav */
        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 100;
            display: none;
        }

        .sidebar {
            position: fixed;
            top: 0; width: 270px; height: 100%;
            background: rgba(30, 58, 138, 0.95);
            backdrop-filter: blur(20px);
            z-index: 101;
            transition: all 0.3s ease;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
        }

        html[dir="ltr"] .sidebar { left: -280px; }
        html[dir="ltr"] .sidebar.active { left: 0; }
        html[dir="rtl"] .sidebar { right: -280px; }
        html[dir="rtl"] .sidebar.active { right: 0; }

        .language-selector-top { margin-bottom: 15px; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.2); }
        .lang-select { width: 100%; padding: 8px; border-radius: 10px; background: rgba(255, 255, 255, 0.25); color: #fff; border: 1px solid rgba(255, 255, 255, 0.4); font-weight: bold; outline: none; }
        .lang-select option { background: #1E3A8A; color: #fff; }

        .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .sidebar-menu a { color: #fff; text-decoration: none; padding: 10px; font-size: 13px; border-radius: 10px; display: flex; align-items: center; gap: 10px; }
        .sidebar-menu a.active { background: rgba(255, 255, 255, 0.2); }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .nav-item { color: rgba(255, 255, 255, 0.7); text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: #ffffff; font-weight: bold; }
    </style>
</head>

<body>

    <div class="full-screen-container">
        <div class="wave-bg-1"></div>
        <div class="wave-bg-2"></div>

        <!-- Header -->
        <header class="app-header">
            <a href="settings.html" class="user-profile">
                <img src="https://via.placeholder.com/100" id="userAvatar" class="avatar-img" alt="User Avatar">
                <span class="welcome-text"><span data-i18n="welcome">Welcome</span>, <span id="userName">Sarah</span></span>
            </a>
            <button class="menu-btn" id="openSidebar"><i class="fa-solid fa-bars"></i></button>
        </header>

        <!-- Main Dashboard Body -->
        <main class="page-content">
            <div class="metallic-white-card">
                <div class="card-header-title">
                    <span><i class="fa-solid fa-gauge-high" style="color: #2563EB;"></i> <span data-i18n="active_challenges">Active Challenges</span></span>
                    <a href="daily-challenge.html" style="font-size: 12px; color: #2563EB; text-decoration: none;"><i class="fa-solid fa-pen-to-square"></i> <span data-i18n="edit">Edit</span></a>
                </div>

                <!-- Active Cards Container -->
                <div class="challenges-grid" id="challengesDisplay">
                    <!-- سيتم ملء الكروت هنا تلقائياً عبر JS -->
                </div>
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item active"><i class="fa-solid fa-house"></i><span data-i18n="home">Home</span></a>
            <a href="daily-challenge.html" class="nav-item"><i class="fa-solid fa-person-running"></i><span data-i18n="challenge">Challenge</span></a>
            <a href="#" class="nav-item"><i class="fa-solid fa-notes-medical"></i><span data-i18n="health_file">Health File</span></a>
            <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i><span data-i18n="settings">Settings</span></a>
        </nav>
    </div>

    <!-- Sidebar Drawer -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="language-selector-top">
            <label style="font-size:11px; margin-bottom:5px; display:block; color: #fff;"><i class="fa-solid fa-globe"></i> <span data-i18n="select_language">Language</span></label>
            <select id="languageSelect" class="lang-select">
                <option value="en">English</option>
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
            </select>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html" class="active"><i class="fa-solid fa-house"></i> <span data-i18n="home">Home</span></a></li>
            <li><a href="daily-challenge.html"><i class="fa-solid fa-trophy"></i> <span data-i18n="daily_challenge">Daily Challenge</span></a></li>
            <li><a href="settings.html"><i class="fa-solid fa-gear"></i> <span data-i18n="settings">Settings</span></a></li>
        </ul>
    </aside>

    <script type="module">
        import { auth } from "./js/firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.displayName) document.getElementById("userName").textContent = user.displayName;
                if (user.photoURL) document.getElementById("userAvatar").src = user.photoURL;
            }
        });

        // Dictionary
        const translations = {
            en: {
                welcome: "Welcome", home: "Home", challenge: "Challenge", health_file: "Health File", settings: "Settings", select_language: "Language", daily_challenge: "Daily Challenge", active_challenges: "Active Challenges", edit: "Edit",
                water_intake: "Water Intake", sleep_time: "Sleep Time", wake_time: "Wake Time", sleep_hours: "Sleep Duration", walking_time: "Walking", phone_usage: "Phone Usage", sugar_intake: "Sugar Intake", smoking: "Smoking", mental_state: "Mental State",
                cups: "cups", hours: "hrs", mins: "mins", yes: "Yes", no: "No", no_challenges: "No challenges pinned to home yet. Click Edit to add some!",
                mood_calm: "Relaxed / Calm", mood_happy: "Happy", mood_sad: "Sad", mood_angry: "Angry", mood_stressed: "Stressed"
            },
            ar: {
                welcome: "أهلاً بك", home: "الرئيسية", challenge: "التحدي", health_file: "ملفي الصحي", settings: "الإعدادات", select_language: "اللغة", daily_challenge: "التحدي اليومي", active_challenges: "التحديات المفعلة", edit: "تعديل",
                water_intake: "شرب الماء", sleep_time: "وقت النوم", wake_time: "وقت الاستيقاظ", sleep_hours: "مدة النوم", walking_time: "المشي", phone_usage: "استعمال الهاتف", sugar_intake: "تناول السكريات", smoking: "التدخين", mental_state: "الحالة النفسية",
                cups: "أكواب", hours: "ساعة", mins: "دقيقة", yes: "نعم", no: "لا", no_challenges: "لا توجد تحديات معروضة حالياً. اضغط على تعديل لإضافتها!",
                mood_calm: "راحة / هدوء", mood_happy: "سعادة", mood_sad: "حزن", mood_angry: "غضب", mood_stressed: "توتر"
            },
            fr: {
                welcome: "Bienvenue", home: "Accueil", challenge: "Défi", health_file: "Dossier Santé", settings: "Paramètres", select_language: "Langue", daily_challenge: "Défi quotidien", active_challenges: "Défis actifs", edit: "Modifier",
                water_intake: "Consommation d'eau", sleep_time: "Heure de coucher", wake_time: "Heure de réveil", sleep_hours: "Durée du sommeil", walking_time: "Marche", phone_usage: "Usage téléphone", sugar_intake: "Sucre", smoking: "Tabagisme", mental_state: "État mental",
                cups: "verres", hours: "h", mins: "m", yes: "Oui", no: "Non", no_challenges: "Aucun défi affiché. Cliquez sur Modifier pour en ajouter!",
                mood_calm: "Calme", mood_happy: "Heureux", mood_sad: "Triste", mood_angry: "En colère", mood_stressed: "Stressé"
            },
            es: {
                welcome: "Bienvenido", home: "Inicio", challenge: "Desafío", health_file: "Perfil de salud", settings: "Ajustes", select_language: "Idioma", daily_challenge: "Desafío diario", active_challenges: "Desafíos activos", edit: "Editar",
                water_intake: "Consumo de agua", sleep_time: "Hora de dormir", wake_time: "Hora de despertar", sleep_hours: "Duración del sueño", walking_time: "Caminata", phone_usage: "Uso del teléfono", sugar_intake: "Azúcar", smoking: "Fumar", mental_state: "Estado de ánimo",
                cups: "vasos", hours: "h", mins: "m", yes: "Sí", no: "No", no_challenges: "¡No hay desafíos fijados aún. Haz clic en Editar para agregar!",
                mood_calm: "Relajado", mood_happy: "Feliz", mood_sad: "Triste", mood_angry: "Enojado", mood_stressed: "Estresado"
            }
        };

        // --- 1. إعدادات اللغة المزامن مع الصفحة الأخرى ---
        let currentLang = localStorage.getItem('appLanguage') || 'en';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('appLanguage', lang);
            document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.documentElement.setAttribute('lang', lang);

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });

            const langSelect = document.getElementById("languageSelect");
            if (langSelect) langSelect.value = lang;

            // إعادة رسم العناصر لترجمة القيم الداخلية
            renderActiveChallenges();
        }

        // --- 2. قراءة وعرض العناصر المختارة فقط ---
        function renderActiveChallenges() {
            const display = document.getElementById("challengesDisplay");
            display.innerHTML = "";

            const savedData = JSON.parse(localStorage.getItem('userChallenges')) || {};
            const t = translations[currentLang] || translations['en'];
            let count = 0;

            const createCard = (icon, iconColor, titleKey, value) => {
                count++;
                return `
                    <div class="dash-item-card">
                        <div class="dash-item-icon" style="color: ${iconColor};"><i class="${icon}"></i></div>
                        <div class="dash-item-title">${t[titleKey] || titleKey}</div>
                        <div class="dash-item-value">${value}</div>
                    </div>
                `;
            };

            if (savedData.water?.show) {
                display.innerHTML += createCard("fa-solid fa-glass-water", "#2563EB", "water_intake", `${savedData.water.value} ${t.cups}`);
            }
            if (savedData.sleepTime?.show) {
                display.innerHTML += createCard("fa-solid fa-bed", "#1E3A8A", "sleep_time", savedData.sleepTime.value);
            }
            if (savedData.wakeTime?.show) {
                display.innerHTML += createCard("fa-solid fa-sun", "#D97706", "wake_time", savedData.wakeTime.value);
            }
            if (savedData.sleepHours?.show) {
                display.innerHTML += createCard("fa-solid fa-moon", "#4F46E5", "sleep_hours", `${savedData.sleepHours.value} ${t.hours}`);
            }
            if (savedData.walking?.show) {
                display.innerHTML += createCard("fa-solid fa-person-walking", "#059669", "walking_time", `${savedData.walking.hours}${t.hours} ${savedData.walking.minutes}${t.mins}`);
            }
            if (savedData.phone?.show) {
                display.innerHTML += createCard("fa-solid fa-mobile-screen-button", "#DC2626", "phone_usage", `${savedData.phone.value} ${t.hours}`);
            }
            if (savedData.sugar?.show) {
                const sugarVal = savedData.sugar.value === 'yes' ? t.yes : t.no;
                display.innerHTML += createCard("fa-solid fa-candy-cane", "#EC4899", "sugar_intake", sugarVal);
            }
            if (savedData.smoking?.show) {
                const smokeVal = savedData.smoking.value === 'yes' ? t.yes : t.no;
                display.innerHTML += createCard("fa-solid fa-smoking", "#4B5563", "smoking", smokeVal);
            }
            if (savedData.mental?.show) {
                const moodKey = `mood_${savedData.mental.value}`;
                display.innerHTML += createCard("fa-solid fa-face-smile", "#8B5CF6", "mental_state", t[moodKey] || savedData.mental.value);
            }

            if (count === 0) {
                display.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i class="fa-solid fa-list-check"></i>
                        <p>${t.no_challenges}</p>
                    </div>
                `;
            }
        }

        // Initialize App State
        setLanguage(currentLang);

        document.getElementById("languageSelect").addEventListener("change", (e) => {
            setLanguage(e.target.value);
        });

        // Sidebar Events
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("sidebarOverlay");

        document.getElementById("openSidebar").addEventListener("click", () => {
            sidebar.classList.add("active");
            overlay.style.display = "block";
        });

        overlay.addEventListener("click", () => {
            sidebar.classList.remove("active");
            overlay.style.display = "none";
        });
    </script>
</body>

</html>

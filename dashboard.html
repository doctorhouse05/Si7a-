<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<meta name="theme-color" content="#000000">

<title>صحتي+ | الرئيسية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{

    --black:#000000;
    --dark:#080808;
    --dark-2:#111111;
    --dark-3:#181818;
    --dark-4:#222222;

    --white:#FFFFFF;
    --white-soft:#F2F2F2;
    --muted:#A7A7A7;

    --cyan:#25F4EE;
    --pink:#FE2C55;

    --blue:#2979FF;
    --green:#20C997;
    --purple:#9B6CFF;
    --orange:#FF9F43;
    --red:#FF4D67;

    --border:rgba(255,255,255,.09);

    --shadow:
        0 8px 30px rgba(0,0,0,.35);
}


/* =========================================================
   BASE
========================================================= */

html{
    scroll-behavior:smooth;
}

body{

    font-family:"Cairo",sans-serif;

    background:
        radial-gradient(
            circle at 0% 0%,
            rgba(37,244,238,.07),
            transparent 30%
        ),
        radial-gradient(
            circle at 100% 20%,
            rgba(254,44,85,.07),
            transparent 30%
        ),
        #000;

    color:var(--white);

    min-height:100vh;

    font-size:15px;

    font-weight:700;

    -webkit-font-smoothing:antialiased;
}

button,
a,
input{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}


/* =========================================================
   APP
========================================================= */

.app{

    width:100%;

    max-width:650px;

    margin:auto;

    padding:
        0
        12px
        110px;
}


/* =========================================================
   TOP AREA
========================================================= */

.top-medical{

    position:relative;

    margin-left:-12px;
    margin-right:-12px;

    padding:
        12px
        12px
        20px;

    background:

        radial-gradient(
            circle at 5% 0%,
            rgba(37,244,238,.15),
            transparent 28%
        ),

        radial-gradient(
            circle at 95% 5%,
            rgba(254,44,85,.14),
            transparent 28%
        ),

        linear-gradient(
            180deg,
            #080808,
            #101010
        );

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

    overflow:hidden;

    margin-bottom:18px;
}


/* =========================================================
   TOP GLOW
========================================================= */

.top-medical::before{

    content:"";

    position:absolute;

    width:170px;
    height:170px;

    border-radius:50%;

    background:
        rgba(37,244,238,.055);

    top:-100px;
    right:-65px;

    filter:blur(3px);
}


.top-medical::after{

    content:"";

    position:absolute;

    width:140px;
    height:140px;

    border-radius:50%;

    background:
        rgba(254,44,85,.045);

    bottom:-100px;
    left:-50px;
}


/* =========================================================
   PROFILE CARD
========================================================= */

.profile-card{

    position:relative;

    z-index:3;

    overflow:hidden;

    background:

        linear-gradient(
            135deg,
            #151515,
            #0D0D0D
        );

    border:
        1px solid
        rgba(255,255,255,.11);

    border-radius:24px;

    padding:15px;

    margin-bottom:15px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.35);
}


/* TikTok-like gradient line */

.profile-card::before{

    content:"";

    position:absolute;

    top:0;
    right:0;
    left:0;

    height:3px;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            #FFFFFF,
            var(--pink)
        );
}


/* decorative glow */

.profile-card::after{

    content:"";

    position:absolute;

    width:120px;
    height:120px;

    border-radius:50%;

    background:
        rgba(37,244,238,.055);

    top:-70px;
    left:-45px;
}


/* =========================================================
   PROFILE CONTENT
========================================================= */

.profile-content{

    position:relative;

    z-index:2;

    display:grid;

    grid-template-columns:
        68px 1fr;

    gap:13px;

    direction:ltr;

    align-items:center;
}


.profile-avatar-wrap{

    width:68px;
    height:68px;

    border-radius:50%;

    background:#111;

    padding:3px;

    border:
        2px solid
        transparent;

    background:
        linear-gradient(#111,#111) padding-box,
        linear-gradient(
            135deg,
            var(--cyan),
            var(--pink)
        ) border-box;

    overflow:hidden;

    box-shadow:
        0 0 18px
        rgba(37,244,238,.12);
}


.profile-avatar{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:50%;
}


.profile-info{

    direction:rtl;

    min-width:0;
}


.profile-name{

    font-size:20px;

    font-weight:900;

    color:#fff;

    margin-bottom:8px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.profile-details{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:7px 10px;
}


.profile-detail{

    display:flex;

    align-items:center;

    gap:6px;

    color:#D0D0D0;

    font-size:11px;

    font-weight:800;

    min-width:0;
}


.profile-detail i{

    width:24px;
    height:24px;

    border-radius:8px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex:none;

    background:#222;

    color:var(--cyan);

    font-size:10px;
}


.profile-detail span{

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   MEDICAL INFORMATION
========================================================= */

.profile-medical{

    position:relative;

    z-index:2;

    margin-top:13px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;
}


.medical-item{

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.045);

    border-radius:15px;

    padding:10px;

    min-width:0;
}


.medical-label{

    display:flex;

    align-items:center;

    gap:6px;

    color:#969696;

    font-size:10px;

    font-weight:800;

    margin-bottom:3px;
}


.medical-label i{

    color:var(--pink);

    font-size:10px;
}


.medical-value{

    font-size:12px;

    font-weight:900;

    color:#fff;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.medical-value.empty{

    color:#777;

    font-weight:700;
}


.profile-edit{

    position:absolute;

    left:13px;
    bottom:13px;

    z-index:5;

    width:31px;
    height:31px;

    border-radius:50%;

    background:
        rgba(255,255,255,.08);

    color:#fff;

    border:
        1px solid
        rgba(255,255,255,.12);

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:11px;
}


/* =========================================================
   CALENDAR
========================================================= */

.integrated-calendar{

    position:relative;

    z-index:4;
}


.date-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:9px;

    padding:0 3px;
}


.date-title{

    font-size:15px;

    font-weight:900;

    color:#fff;
}


.calendar-button{

    width:39px;
    height:39px;

    border-radius:50%;

    background:
        rgba(255,255,255,.08);

    color:#fff;

    border:
        1px solid
        rgba(255,255,255,.10);

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:15px;
}


/* =========================================================
   WEEK
========================================================= */

.week{

    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    gap:4px;
}


.day{

    text-align:center;

    padding:5px 2px;

    border-radius:14px;

    cursor:pointer;

    color:#999;

    transition:.2s;
}


.day-name{

    font-size:9px;

    font-weight:800;

    margin-bottom:5px;

    color:#777;
}


.day-number{

    width:34px;
    height:34px;

    margin:auto;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:13px;

    font-weight:900;

    color:#ddd;
}


.day.active{

    background:
        rgba(255,255,255,.07);
}


.day.active .day-number{

    background:#fff;

    color:#000;

    box-shadow:
        0 0 16px
        rgba(255,255,255,.15);
}


.day.today .day-number{

    border:
        2px solid
        var(--pink);
}


.day.active.today .day-number{

    border:0;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            #fff
        );

    color:#000;
}


/* =========================================================
   SCORE CARD
========================================================= */

.score-card{

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #161616,
            #0C0C0C
        );

    color:#fff;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius:23px;

    padding:17px;

    margin-bottom:25px;

    box-shadow:var(--shadow);
}


.score-card::before{

    content:"";

    position:absolute;

    width:170px;
    height:170px;

    border-radius:50%;

    background:
        rgba(254,44,85,.06);

    left:-70px;
    top:-80px;
}


.score-inner{

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}


.score-text{

    flex:1;
}


.score-title{

    font-size:19px;

    font-weight:900;

    margin-bottom:5px;
}


.score-subtitle{

    font-size:12px;

    line-height:1.9;

    color:#AFAFAF;

    font-weight:700;
}


.progress-ring{

    width:88px;
    height:88px;

    position:relative;

    flex:none;
}


.progress-ring svg{

    width:100%;
    height:100%;

    transform:rotate(-90deg);
}


.progress-ring circle{

    fill:none;

    stroke-width:8;
}


.progress-bg{

    stroke:#292929;
}


.progress-value{

    stroke:
        url(#progressGradient);

    stroke:#fff;

    stroke-linecap:round;

    stroke-dasharray:251;

    stroke-dashoffset:251;

    transition:1s ease;
}


.progress-number{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:19px;

    font-weight:900;
}


/* =========================================================
   SECTIONS
========================================================= */

.section{

    margin-bottom:25px;
}


.section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:12px;
}


.section-title{

    display:flex;

    align-items:center;

    gap:9px;

    font-size:18px;

    font-weight:900;

    color:#fff;
}


.section-title i{

    color:var(--cyan);

    font-size:17px;
}


/* =========================================================
   HEALTH GRID
========================================================= */

.health-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;
}


.health-item{

    background:
        #111;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:18px;

    padding:13px 5px;

    text-align:center;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.25);

    transition:.2s;
}


.health-item:active{

    transform:scale(.94);
}


.health-icon{

    width:46px;
    height:46px;

    margin:auto auto 7px;

    border-radius:15px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:18px;
}


.health-name{

    font-size:11px;

    font-weight:900;

    color:#E5E5E5;
}


.blue-icon{

    background:
        rgba(41,121,255,.15);

    color:#5EA0FF;
}


.pink-icon{

    background:
        rgba(254,44,85,.14);

    color:#FF5576;
}


.purple-icon{

    background:
        rgba(155,108,255,.14);

    color:#B28CFF;
}


.green-icon{

    background:
        rgba(32,201,151,.14);

    color:#45E0B3;
}


/* =========================================================
   DAILY CHALLENGES
========================================================= */

.daily-list{

    display:grid;

    gap:10px;
}


.daily-card{

    position:relative;

    display:flex;

    align-items:center;

    gap:11px;

    min-height:78px;

    background:
        #111;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:18px;

    padding:11px 12px;

    box-shadow:
        0 6px 22px
        rgba(0,0,0,.25);

    overflow:hidden;

    transition:
        transform .15s ease,
        background .15s ease;
}


.daily-card::before{

    content:"";

    position:absolute;

    right:0;
    top:0;
    bottom:0;

    width:3px;

    background:
        var(--card-color);
}


.daily-card:active{

    transform:scale(.985);

    background:#181818;
}


.daily-icon{

    width:48px;
    height:48px;

    border-radius:15px;

    flex:none;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        var(--icon-bg);

    color:
        var(--card-color);

    font-size:19px;
}


.daily-main{

    flex:1;

    min-width:0;
}


.daily-name{

    color:#fff;

    font-size:14px;

    font-weight:900;

    margin-bottom:2px;
}


.daily-value{

    color:#858585;

    font-size:10px;

    font-weight:800;

    margin-bottom:6px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.daily-progress{

    height:5px;

    width:100%;

    background:#282828;

    border-radius:10px;

    overflow:hidden;
}


.daily-progress span{

    display:block;

    height:100%;

    border-radius:10px;

    background:
        var(--card-color);

    transition:
        width .5s ease;
}


.daily-percent{

    width:42px;

    text-align:center;

    color:
        var(--card-color);

    font-size:12px;

    font-weight:900;

    flex:none;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-challenges{

    background:
        #111;

    border:
        1px dashed
        #333;

    border-radius:20px;

    padding:28px 18px;

    text-align:center;
}


.empty-icon{

    width:56px;
    height:56px;

    border-radius:17px;

    margin:0 auto 12px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(37,244,238,.10);

    color:var(--cyan);

    font-size:21px;
}


.empty-challenges strong{

    display:block;

    font-size:16px;

    font-weight:900;

    margin-bottom:6px;

    color:#fff;
}


.empty-challenges p{

    font-size:12px;

    color:#858585;

    line-height:1.9;

    font-weight:700;

    margin-bottom:15px;
}


.empty-button{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--pink)
        );

    color:#000;

    padding:11px 18px;

    border-radius:13px;

    font-size:12px;

    font-weight:900;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{

    position:fixed;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:min(650px,100%);

    background:
        rgba(8,8,8,.96);

    backdrop-filter:blur(18px);

    border-top:
        1px solid
        rgba(255,255,255,.09);

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    padding:
        7px
        8px
        max(8px,env(safe-area-inset-bottom));

    z-index:100;
}


.nav-item{

    text-align:center;

    color:#777;

    font-size:10px;

    font-weight:800;

    padding:5px;

    transition:.2s;
}


.nav-item i{

    display:block;

    font-size:19px;

    margin-bottom:4px;
}


.nav-item.active{

    color:#fff;

}


.nav-item.active i{

    color:var(--cyan);

    text-shadow:
        0 0 10px
        rgba(37,244,238,.35);
}


/* =========================================================
   LOADING
========================================================= */

.loading-screen{

    position:fixed;

    inset:0;

    background:#000;

    z-index:9999;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:.3s;
}


.loading-screen.hide{

    opacity:0;

    pointer-events:none;
}


.loading-box{

    text-align:center;
}


.loading-logo{

    width:72px;
    height:72px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            rgba(37,244,238,.15),
            rgba(254,44,85,.15)
        );

    color:#fff;

    display:flex;

    align-items:center;
    justify-content:center;

    margin:auto auto 12px;

    font-size:29px;

    box-shadow:
        0 0 30px
        rgba(37,244,238,.08);
}


.loading-box strong{

    display:block;

    font-size:22px;

    font-weight:900;

    color:#fff;
}


.loading-box p{

    font-size:12px;

    color:#777;

    font-weight:700;

    margin-top:3px;
}


.spinner{

    width:25px;
    height:25px;

    border:3px solid #222;

    border-top-color:var(--cyan);

    border-right-color:var(--pink);

    border-radius:50%;

    animation:spin .8s linear infinite;

    margin:15px auto 0;
}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   MODAL
========================================================= */

.modal{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.75);

    backdrop-filter:blur(7px);

    z-index:500;

    display:none;

    align-items:flex-end;

    justify-content:center;
}


.modal.show{

    display:flex;
}


.modal-box{

    width:min(650px,100%);

    background:#111;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        25px
        25px
        0
        0;

    padding:21px;

    animation:
        slideUp .25s ease;
}


@keyframes slideUp{

    from{
        transform:translateY(100%);
    }

    to{
        transform:translateY(0);
    }

}


.modal-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:15px;
}


.modal-head strong{

    font-size:18px;

    font-weight:900;

    color:#fff;
}


.close-modal{

    width:38px;
    height:38px;

    border-radius:50%;

    background:#222;

    color:#fff;

    font-size:15px;
}


/* =========================================================
   DATE INPUT
========================================================= */

#calendarInput{

    color:#fff !important;

    background:#1A1A1A !important;

    border:
        1px solid
        #333 !important;
}


/* =========================================================
   SMALL SCREENS
========================================================= */

@media(max-width:400px){

    .app{

        padding-left:9px;
        padding-right:9px;
    }

    .top-medical{

        margin-left:-9px;
        margin-right:-9px;

        padding-left:9px;
        padding-right:9px;
    }

    .profile-content{

        grid-template-columns:
            61px 1fr;

        gap:10px;
    }

    .profile-avatar-wrap{

        width:61px;
        height:61px;
    }

    .profile-name{

        font-size:18px;
    }

    .profile-detail{

        font-size:10px;
    }

    .health-grid{

        gap:5px;
    }

    .health-item{

        padding:11px 3px;
    }

    .health-icon{

        width:42px;
        height:42px;

        font-size:17px;
    }

    .health-name{

        font-size:10px;
    }

    .day-number{

        width:31px;
        height:31px;
    }

    .daily-card{

        padding:10px;

        gap:9px;
    }

    .daily-icon{

        width:44px;
        height:44px;
    }

}


@media(max-width:350px){

    .profile-details{

        grid-template-columns:1fr;
    }

    .profile-medical{

        grid-template-columns:1fr;
    }

    .day-number{

        width:28px;
        height:28px;

        font-size:12px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     LOADING
========================================================= -->

<div class="loading-screen" id="loadingScreen">

    <div class="loading-box">

        <div class="loading-logo">

            <i class="fa-solid fa-heart-pulse"></i>

        </div>

        <strong>Si7a+</strong>

        <p>
            صحتي+ — مساحتك الصحية الشخصية
        </p>

        <div class="spinner"></div>

    </div>

</div>



<main class="app">


<!-- =========================================================
     HEADER
========================================================= -->

<section class="top-medical">


    <!-- PROFILE -->

/* =========================================================
   DATE
========================================================= */

function formatDateKey(date){

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;

}


function arabicDate(date){

    return new Intl.DateTimeFormat(
        "ar-DZ",
        {
            weekday:"long",
            day:"numeric",
            month:"long"
        }
    ).format(date);

}


/* =========================================================
   WEEK
========================================================= */

function renderWeek(){

    const week =
        document.getElementById("week");

    week.innerHTML = "";

    const selectedKey =
        formatDateKey(selectedDate);

    const start =
        new Date(selectedDate);

    const day =
        start.getDay();

    const mondayOffset =
        day === 0
            ? -6
            : 1 - day;

    start.setDate(
        start.getDate() +
        mondayOffset
    );

    const names = [

        "الإثنين",
        "الثلاثاء",
        "الأربعاء",
        "الخميس",
        "الجمعة",
        "السبت",
        "الأحد"

    ];


    for(let i=0;i<7;i++){

        const d =
            new Date(start);

        d.setDate(
            start.getDate()+i
        );

        const key =
            formatDateKey(d);

        const item =
            document.createElement("div");

        item.className = "day";


        if(key === selectedKey){

            item.classList.add("active");

        }


        if(
            key ===
            formatDateKey(new Date())
        ){

            item.classList.add("today");

        }


        item.innerHTML = `

            <div class="day-name">
                ${names[i].slice(0,3)}
            </div>

            <div class="day-number">
                ${d.getDate()}
            </div>

        `;


        item.addEventListener(
            "click",
            async ()=>{

                selectedDate =
                    new Date(d);

                document.getElementById(
                    "selectedDateText"
                ).textContent =
                    arabicDate(
                        selectedDate
                    );

                renderWeek();

                await loadDailyData();

            }
        );


        week.appendChild(item);

    }


    document.getElementById(
        "selectedDateText"
    ).textContent =
        arabicDate(selectedDate);

}


/* =========================================================
   PROFILE
========================================================= */

function normalizeGender(value){

    if(!value){

        return "غير محدد";

    }

    const v =
        String(value).toLowerCase();


    if(
        v === "male" ||
        v === "ذكر" ||
        v === "homme" ||
        v === "m"
    ){

        return "ذكر";

    }


    if(
        v === "female" ||
        v === "أنثى" ||
        v === "femme" ||
        v === "f"
    ){

        return "أنثى";

    }


    return String(value);

}


function normalizeBlood(value){

    if(!value){

        return "غير محددة";

    }

    return String(value);

}


function calculateBMI(weight,height){

    const w = Number(weight);

    const h = Number(height);


    if(
        !Number.isFinite(w) ||
        !Number.isFinite(h) ||
        w <= 0 ||
        h <= 0
    ){

        return null;

    }


    const meters =
        h / 100;


    return w /
        (meters * meters);

}


function bmiStatus(bmi){

    if(bmi === null){

        return "";

    }


    if(bmi < 18.5){

        return "نحافة";

    }


    if(bmi < 25){

        return "طبيعي";

    }


    if(bmi < 30){

        return "زيادة في الوزن";

    }


    return "سمنة";

}


function getDiseases(data){

    const value =

        data.chronicDiseases ??
        data.chronicDisease ??
        data.diseases ??
        data.medicalConditions ??
        data.chronicConditions ??
        "";


    if(Array.isArray(value)){

        return value.length
            ? value.join("، ")
            : "لا توجد معلومات";

    }


    if(value === true){

        return "موجودة";

    }


    if(
        !value ||
        String(value).trim() === ""
    ){

        return "لا توجد معلومات";

    }


    return String(value);

}

/* =========================================================
   LOAD USER
========================================================= */

async function loadUser(){

    if(!currentUser){

        return;

    }


    try{

        const ref =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const snap =
            await getDoc(ref);


        if(snap.exists()){

            userData =
                snap.data() || {};

        }else{

            userData = {};

        }


        renderProfile();

    }catch(error){

        console.error(
            "User loading error:",
            error
        );


        userData = {};

        renderProfile();

    }

}


/* =========================================================
   LOAD CHALLENGES
========================================================= */

async function loadChallenges(){

    if(!currentUser){

        return;

    }


    let found = false;


    try{

        const paths = [

            [
                "challengeSettings",
                "main"
            ],

            [
                "challenges",
                "settings"
            ],

            [
                "healthSettings",
                "challenges"
            ]

        ];


        for(const path of paths){

            const ref =
                doc(
                    db,
                    "users",
                    currentUser.uid,
                    path[0],
                    path[1]
                );


            const snap =
                await getDoc(ref);


            if(snap.exists()){

                const data =
                    snap.data() || {};


                let selected =
                    data.selected ??
                    data.selectedChallenges ??
                    data.challenges;


                if(!Array.isArray(selected)){

                    selected =
                        CHALLENGES
                        .filter(
                            item =>
                                data[item.id] === true
                        )
                        .map(
                            item =>
                                item.id
                        );

                }


                challengeSettings = {

                    selected:
                        selected || [],

                    targets:
                        data.targets || {},

                    values:
                        data.values || {}

                };


                found = true;

                break;

            }

        }

    }catch(error){

        console.error(
            "Challenge settings error:",
            error
        );

    }


    if(!found){

        challengeSettings = {

            selected:[],

            targets:{},

            values:{}

        };

    }


    renderDaily();

}


/* =========================================================
   TARGET
========================================================= */

function getTarget(challenge){

    const custom =
        challengeSettings.targets?.[
            challenge.id
        ];


    if(
        custom !== undefined &&
        custom !== null &&
        custom !== ""
    ){

        if(
            challenge.type === "number"
        ){

            const value =
                Number(custom);


            if(
                Number.isFinite(value) &&
                value > 0
            ){

                return value;

            }

        }


        return custom;

    }


    return challenge.target;

}


/* =========================================================
   SLEEP SCHEDULE
========================================================= */

function getSleepSchedule(){

    return {

        sleepTime:
            challengeSettings.targets?.sleepTime ||
            "23:00",

        wakeTime:
            challengeSettings.targets?.wakeTime ||
            "07:00"

    };

}


/* =========================================================
   DAILY VALUE
========================================================= */

function getDailyValue(id){

    const d =
        dailyData || {};


    switch(id){

        case "water":

            return Number(
                d.waterCups ??
                d.water ??
                d.waterIntake ??
                0
            );


        case "walking":

            return Number(
                d.walkingMeters ??
                d.distanceMeters ??
                d.meters ??
                d.walking ??
                d.distance ??
                0
            );


        case "sleep":{

            let value =
                Number(
                    d.sleepHours ??
                    d.hoursSleep ??
                    d.sleep ??
                    0
                );


            if(value > 24){

                value =
                    value / 60;

            }


            return value;

        }


        case "sleepSchedule":{

            const sleepTime =
                d.sleepTime ??
                d.bedTime ??
                d.bedtime ??
                "";

            const wakeTime =
                d.wakeTime ??
                d.wakeUpTime ??
                d.wakeupTime ??
                "";


            return {

                sleepTime,
                wakeTime

            };

        }


        case "sugar":{

            const value =
                d.sugar ??
                d.sugars ??
                d.ateSugar ??
                d.sugarEaten ??
                "";


            if(
                value === true ||
                value === "yes" ||
                value === "ate" ||
                value === "أكلت"
            ){

                return "أكلت";

            }


            if(
                value === false ||
                value === "no" ||
                value === "not_eaten" ||
                value === "لم آكل"
            ){

                return "لم آكل";

            }


            return "";

        }


        case "smoking":{

            const value =
                d.smoking ??
                d.smoked ??
                d.smokingToday ??
                "";


            if(
                value === true ||
                value === "yes" ||
                value === "نعم"
            ){

                return "نعم";

            }


            if(
                value === false ||
                value === "no" ||
                value === "لا"
            ){

                return "لا";

            }


            return "";

        }


        default:

            return 0;

    }

}


/* =========================================================
   FORMAT
========================================================= */

function formatNumber(value){

    if(!Number.isFinite(Number(value))){

        return "0";

    }


    return Number(value)
        .toLocaleString("ar-DZ");

}


function formatTime(time){

    if(!time){

        return "لم يتم التسجيل";

    }


    const parts =
        String(time).split(":");


    if(parts.length < 2){

        return String(time);

    }


    let hour =
        Number(parts[0]);

    const minute =
        String(parts[1])
        .padStart(2,"0");


    if(!Number.isFinite(hour)){

        return String(time);

    }


    const period =
        hour >= 12
            ? "مساءً"
            : "صباحًا";


    hour =
        hour % 12 || 12;


    return `${hour}:${minute} ${period}`;

}


/* =========================================================
   FORMAT DAILY
========================================================= */

function formatDailyValue(
    challenge,
    value,
    target
){

    switch(challenge.id){

        case "water":

            return `${formatNumber(value)} / ${formatNumber(target)} كوب`;


        case "walking":

            return `${formatNumber(value)} / ${formatNumber(target)} متر`;


        case "sleep":{

            const hours =
                Number(value) || 0;

            const targetHours =
                Number(target) || 0;


            return `${hours.toFixed(1)} / ${targetHours.toFixed(1)} ساعة`;

        }


        case "sleepSchedule":{

            const schedule =
                getSleepSchedule();


            const actualSleep =
                value?.sleepTime || "";

            const actualWake =
                value?.wakeTime || "";


            if(
                actualSleep ||
                actualWake
            ){

                return `
                    نوم ${formatTime(actualSleep)}
                    • استيقاظ ${formatTime(actualWake)}
                `;

            }


            return `
                الهدف:
                ${formatTime(schedule.sleepTime)}
                →
                ${formatTime(schedule.wakeTime)}
            `;

        }


        case "sugar":

            if(value === "أكلت"){

                return "أكلت السكريات اليوم";

            }


            if(value === "لم آكل"){

                return "لم آكل السكريات اليوم";

            }


            return "لم يتم التسجيل بعد";


        case "smoking":

            if(value === "نعم"){

                return "تم تسجيل التدخين اليوم";

            }


            if(value === "لا"){

                return "لم أدخن اليوم";

            }


            return "لم يتم التسجيل بعد";


        default:

            return "";

    }

}


/* =========================================================
   PERCENT
========================================================= */

function getPercent(
    challenge,
    value,
    target
){

    if(
        challenge.type === "number"
    ){

        const numericTarget =
            Number(target);

        const numericValue =
            Number(value);


        if(
            !Number.isFinite(numericTarget) ||
            numericTarget <= 0
        ){

            return 0;

        }


        if(
            !Number.isFinite(numericValue)
        ){

            return 0;

        }


        return Math.min(
            100,
            Math.round(
                (numericValue / numericTarget) *
                100
            )
        );

    }


    if(
        challenge.id === "sleepSchedule"
    ){

        const actualSleep =
            value?.sleepTime || "";

        const actualWake =
            value?.wakeTime || "";


        let completed = 0;


        if(actualSleep){

            completed++;

        }


        if(actualWake){

            completed++;

        }


        return Math.round(
            (completed / 2) * 100
        );

    }


    if(
        challenge.id === "sugar"
    ){

        if(value === "لم آكل"){

            return 100;

        }


        if(value === "أكلت"){

            return 0;

        }


        return 0;

    }


    if(
        challenge.id === "smoking"
    ){

        if(value === "لا"){

            return 100;

        }


        if(value === "نعم"){

            return 0;

        }


        return 0;

    }


    return 0;

}


/* =========================================================
   RENDER DAILY
========================================================= */

function renderDaily(){

    const list =
        document.getElementById(
            "dailyList"
        );


    list.innerHTML = "";


    const selected =
        challengeSettings.selected;


    if(
        !Array.isArray(selected) ||
        selected.length === 0
    ){

        list.innerHTML = `

            <div class="empty-challenges">

                <div class="empty-icon">

                    <i class="fa-solid fa-list-check"></i>

                </div>

                <strong>
                    لم تختر متابعاتك اليومية بعد
                </strong>

                <p>
                    اختر من صفحة «تحدياتي» العادات
                    التي تريد متابعتها، وستظهر هنا
                    تلقائيًا.
                </p>

                <a
                    href="challenges.html"
                    class="empty-button">

                    <i class="fa-solid fa-sliders"></i>

                    اختيار تحدياتي

                </a>

            </div>

        `;


        setProgress(0);

        return;

    }


    const selectedDefinitions =
        CHALLENGES.filter(
            challenge =>
                selected.includes(
                    challenge.id
                )
        );


    selectedDefinitions.forEach(
        challenge => {

            const target =
                getTarget(challenge);


            const value =
                getDailyValue(
                    challenge.id
                );


            const percent =
                getPercent(
                    challenge,
                    value,
                    target
                );


            const card =
                document.createElement("a");


            card.href =
                challenge.link;


            card.className =
                "daily-card";


            card.style.setProperty(
                "--card-color",
                challenge.color
            );


            card.style.setProperty(
                "--icon-bg",
                challenge.bg
            );


            card.innerHTML = `

                <div class="daily-icon">

                    <i class="fa-solid ${challenge.icon}"></i>

                </div>


                <div class="daily-main">

                    <div class="daily-name">
                        ${challenge.name}
                    </div>

                    <div class="daily-value">
                        ${formatDailyValue(
                            challenge,
                            value,
                            target
                        )}
                    </div>

                    <div class="daily-progress">

                        <span
                            style="width:${percent}%">
                        </span>

                    </div>

                </div>


                <div class="daily-percent">
                    ${percent}%
                </div>

            `;


            list.appendChild(card);

        }
    );


    updateOverallProgress();

}


/* =========================================================
   OVERALL PROGRESS
========================================================= */

function updateOverallProgress(){

    const selected =
        challengeSettings.selected;


    if(
        !Array.isArray(selected) ||
        selected.length === 0
    ){

        setProgress(0);

        return;

    }


    const selectedDefinitions =
        CHALLENGES.filter(
            challenge =>
                selected.includes(
                    challenge.id
                )
        );


    if(
        !selectedDefinitions.length
    ){

        setProgress(0);

        return;

    }


    let total = 0;


    selectedDefinitions.forEach(
        challenge => {

            const target =
                getTarget(challenge);


            const value =
                getDailyValue(
                    challenge.id
                );


            total +=
                getPercent(
                    challenge,
                    value,
                    target
                );

        }
    );


    const average =
        Math.round(
            total /
            selectedDefinitions.length
        );


    setProgress(average);

}


/* =========================================================
   PROGRESS
========================================================= */

function setProgress(percent){

    const circle =
        document.getElementById(
            "progressCircle"
        );


    const number =
        document.getElementById(
            "progressNumber"
        );


    const subtitle =
        document.getElementById(
            "scoreSubtitle"
        );


    const circumference =
        2 * Math.PI * 40;


    const offset =
        circumference -
        (percent / 100) *
        circumference;


    circle.style.strokeDasharray =
        circumference;


    circle.style.strokeDashoffset =
        offset;


    number.textContent =
        `${percent}%`;


    if(percent === 0){

        subtitle.textContent =
            "اختر تحدياتك اليومية لتظهر هنا.";

    }

    else if(percent < 50){

        subtitle.textContent =
            "بداية جيدة، واصل تسجيل عاداتك.";

    }

    else if(percent < 100){

        subtitle.textContent =
            "أنت في الطريق الصحيح، استمر.";

    }

    else{

        subtitle.textContent =
            "رائع! أكملت جميع تحدياتك اليوم.";

    }

}


/* =========================================================
   LOAD DAILY
========================================================= */

async function loadDailyData(){

    if(!currentUser){

        return;

    }


    const dateKey =
        formatDateKey(selectedDate);


    dailyData = {};


    const paths = [

        [
            "dailyTracking",
            dateKey
        ],

        [
            "daily",
            dateKey
        ]

    ];


    try{

        for(
            const path of paths
        ){

            const ref =
                doc(
                    db,
                    "users",
                    currentUser.uid,
                    path[0],
                    path[1]
                );


            const snap =
                await getDoc(ref);


            if(snap.exists()){

                dailyData =
                    snap.data() || {};

                break;

            }

        }


    }catch(error){

        console.error(
            "Daily data error:",
            error
        );

    }


    renderDaily();

}


/* =========================================================
   CALENDAR MODAL
========================================================= */

const calendarModal =
    document.getElementById(
        "calendarModal"
    );


const calendarInput =
    document.getElementById(
        "calendarInput"
    );


document.getElementById(
    "openCalendar"
).addEventListener(
    "click",
    ()=>{

        calendarInput.value =
            formatDateKey(
                selectedDate
            );


        calendarModal.classList.add(
            "show"
        );

    }
);


document.getElementById(
    "closeCalendar"
).addEventListener(
    "click",
    ()=>{

        calendarModal.classList.remove(
            "show"
        );

    }
);


calendarInput.addEventListener(
    "change",
    async ()=>{

        if(!calendarInput.value){

            return;

        }


        const parts =
            calendarInput.value
            .split("-")
            .map(Number);


        selectedDate =
            new Date(
                parts[0],
                parts[1]-1,
                parts[2]
            );


        calendarModal.classList.remove(
            "show"
        );


        renderWeek();

        await loadDailyData();

    }
);


calendarModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            calendarModal
        ){

            calendarModal.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            user;


        try{

            await loadUser();

            await loadChallenges();

            await loadDailyData();

            renderWeek();

        }catch(error){

            console.error(
                "Dashboard error:",
                error
            );

        }


        setTimeout(
            ()=>{

                document
                    .getElementById(
                        "loadingScreen"
                    )
                    .classList.add(
                        "hide"
                    );

            },
            300
        );

    }
);

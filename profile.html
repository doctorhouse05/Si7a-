<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<meta name="theme-color" content="#1976D2">

<title>صحتي+ | حسابي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --blue:#1976D2;
    --blue-dark:#125EA8;
    --blue-light:#EAF5FF;

    --green:#16A085;
    --green-light:#E9F9F5;

    --red:#E74C3C;
    --red-light:#FFF0EE;

    --text:#172433;
    --muted:#7D8996;

    --bg:#F5F8FC;
    --card:#FFFFFF;
    --border:#E5EBF1;

    --shadow:0 8px 25px rgba(28,73,112,.07);
}

body{
    font-family:"Cairo",sans-serif;
    background:
        radial-gradient(
            circle at 100% 0,
            rgba(25,118,210,.08),
            transparent 30%
        ),
        var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

.app{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:18px 14px 100px;
}


/* =================================
   HEADER
================================= */

.page-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:17px;
}

.header-title{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-icon{
    width:42px;
    height:42px;
    border-radius:14px;
    background:var(--blue-light);
    color:var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
}

.header-title strong{
    font-size:18px;
    font-weight:800;
}

.header-title span{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-top:1px;
}

.back-button{
    width:40px;
    height:40px;
    border-radius:13px;
    background:#fff;
    border:1px solid var(--border);
    color:#667483;
    display:flex;
    align-items:center;
    justify-content:center;
}


/* =================================
   PROFILE HERO
================================= */

.profile-hero{
    position:relative;
    overflow:hidden;
    background:#fff;
    border:1px solid var(--border);
    border-radius:28px;
    padding:24px 20px;
    margin-bottom:17px;
    box-shadow:var(--shadow);
    text-align:center;
}

.profile-hero::before{
    content:"";
    position:absolute;
    width:230px;
    height:150px;
    top:-75px;
    right:-60px;
    background:#EAF5FF;
    transform:rotate(-12deg);
    border-radius:35px;
}

.profile-hero::after{
    content:"";
    position:absolute;
    width:160px;
    height:110px;
    bottom:-75px;
    left:-50px;
    background:#F1F8FF;
    transform:rotate(15deg);
    border-radius:40px;
}

.profile-photo-wrap{
    position:relative;
    z-index:2;
    width:104px;
    height:104px;
    margin:0 auto 12px;
    padding:4px;
    background:#fff;
    border:1px solid #DDE7F0;
    border-radius:50%;
    box-shadow:0 8px 25px rgba(25,118,210,.13);
}

.profile-photo{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    display:block;
}

.photo-button{
    position:absolute;
    bottom:0;
    left:0;
    width:33px;
    height:33px;
    border-radius:11px;
    background:var(--blue);
    color:#fff;
    border:3px solid #fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
}

.profile-name{
    position:relative;
    z-index:2;
    font-size:20px;
    font-weight:800;
}

.profile-email{
    position:relative;
    z-index:2;
    color:var(--muted);
    font-size:10px;
    margin-top:2px;
    direction:ltr;
}


/* =================================
   SECTIONS
================================= */

.section{
    margin-bottom:16px;
}

.section-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:22px;
    padding:17px;
    box-shadow:var(--shadow);
}

.section-title{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:14px;
    font-weight:800;
    margin-bottom:15px;
}

.section-title i{
    width:32px;
    height:32px;
    border-radius:10px;
    background:var(--blue-light);
    color:var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
}


/* =================================
   FORM
================================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{
    margin-bottom:12px;
}

.form-group.full{
    grid-column:1 / -1;
}

label{
    display:block;
    font-size:10px;
    color:#697685;
    font-weight:700;
    margin-bottom:6px;
}

.input-wrap{
    position:relative;
}

.input-icon{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    color:#91A0AE;
    font-size:12px;
    pointer-events:none;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #E1E7ED;
    background:#FAFCFE;
    border-radius:13px;
    padding:11px 37px 11px 11px;
    outline:none;
    color:#273443;
    font-size:11px;
    transition:.2s;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#8EC5F4;
    background:#fff;
    box-shadow:0 0 0 3px rgba(25,118,210,.07);
}

textarea{
    min-height:80px;
    resize:vertical;
    line-height:1.8;
}


/* =================================
   BMI
================================= */

.bmi-card{
    display:flex;
    align-items:center;
    gap:13px;
    background:linear-gradient(
        135deg,
        #F1F8FF,
        #fff
    );
    border:1px solid #DCECFB;
    border-radius:18px;
    padding:13px;
}

.bmi-icon{
    width:42px;
    height:42px;
    border-radius:13px;
    background:#DCEFFF;
    color:var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
}

.bmi-label{
    font-size:9px;
    color:#8995A1;
}

.bmi-value{
    font-size:15px;
    font-weight:800;
    margin-top:1px;
}

.bmi-status{
    margin-right:auto;
    font-size:10px;
    font-weight:800;
    padding:6px 9px;
    border-radius:9px;
    background:#E9F9F5;
    color:var(--green);
}


/* =================================
   SAVE
================================= */

.save-button{
    width:100%;
    background:linear-gradient(
        135deg,
        #1976D2,
        #2388E5
    );
    color:#fff;
    border-radius:15px;
    padding:13px;
    font-size:12px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow:0 8px 18px rgba(25,118,210,.20);
}

.save-button:disabled{
    opacity:.65;
    cursor:not-allowed;
}


/* =================================
   ACCOUNT ACTIONS
================================= */

.action-list{
    display:grid;
    gap:9px;
}

.action{
    display:flex;
    align-items:center;
    gap:11px;
    background:#FAFCFE;
    border:1px solid #EDF1F5;
    border-radius:15px;
    padding:12px;
}

.action-icon{
    width:38px;
    height:38px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#F0F5F9;
    color:#617384;
    flex:none;
}

.action-content{
    flex:1;
}

.action-title{
    font-size:11px;
    font-weight:800;
}

.action-sub{
    color:#98A3AE;
    font-size:9px;
    margin-top:2px;
}

.action-arrow{
    color:#A3ADB7;
    font-size:10px;
}


/* =================================
   LOGOUT
================================= */

.logout{
    width:100%;
    background:#FFF3F1;
    color:#D94D3E;
    border:1px solid #F8DCD8;
    border-radius:15px;
    padding:12px;
    font-size:11px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}


/* =================================
   BOTTOM NAV
================================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:min(650px,100%);
    background:rgba(255,255,255,.97);
    backdrop-filter:blur(15px);
    border-top:1px solid #E7ECF1;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding:8px 8px max(8px,env(safe-area-inset-bottom));
    z-index:100;
}

.nav-item{
    text-align:center;
    color:#9AA5B0;
    font-size:9px;
    font-weight:600;
    padding:4px;
}

.nav-item i{
    display:block;
    font-size:16px;
    margin-bottom:3px;
}

.nav-item.active{
    color:var(--blue);
}


/* =================================
   MESSAGE
================================= */

.message{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translateX(-50%) translateY(20px);
    width:calc(100% - 30px);
    max-width:600px;
    padding:12px 15px;
    border-radius:14px;
    color:#fff;
    background:#263746;
    font-size:10px;
    font-weight:700;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:1000;
}

.message.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.message.success{
    background:#16866F;
}

.message.error{
    background:#D94D3E;
}


/* =================================
   LOADING
================================= */

.loading{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.3s;
}

.loading.hide{
    opacity:0;
    pointer-events:none;
}

.loading-content{
    text-align:center;
}

.loading-icon{
    width:62px;
    height:62px;
    margin:auto auto 12px;
    border-radius:20px;
    background:var(--blue-light);
    color:var(--blue);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.loading-content strong{
    font-size:17px;
}

.loading-content p{
    color:#9AA5B0;
    font-size:10px;
    margin-top:2px;
}

.spinner{
    width:22px;
    height:22px;
    border:3px solid #DDECF9;
    border-top-color:var(--blue);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:15px auto 0;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


@media(max-width:400px){

    .app{
        padding-left:11px;
        padding-right:11px;
    }

    .form-grid{
        grid-template-columns:1fr;
        gap:0;
    }

    .form-group.full{
        grid-column:auto;
    }

}

</style>
</head>


<body>


<!-- =================================
     LOADING
================================= -->

<div
    class="loading"
    id="loading">

    <div class="loading-content">

        <div class="loading-icon">
            <i class="fa-solid fa-heart-pulse"></i>
        </div>

        <strong>صحتي+</strong>

        <p>
            تحميل حسابك...
        </p>

        <div class="spinner"></div>

    </div>

</div>



<main class="app">


    <!-- =================================
         HEADER
    ================================= -->

    <header class="page-header">

        <div class="header-title">

            <div class="header-icon">
                <i class="fa-solid fa-user"></i>
            </div>

            <div>

                <strong>
                    حسابي
                </strong>

                <span>
                    معلوماتك الصحية والشخصية
                </span>

            </div>

        </div>


        <a
            href="dashboard.html"
            class="back-button">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

    </header>



    <!-- =================================
         PROFILE
    ================================= -->

    <section class="profile-hero">

        <div class="profile-photo-wrap">

            <img
                id="profilePhoto"
                class="profile-photo"
                alt="صورة المستخدم">

            <label
                class="photo-button"
                for="photoInput">

                <i class="fa-solid fa-camera"></i>

            </label>

        </div>


        <div
            class="profile-name"
            id="heroName">

            مستخدم صحتي

        </div>


        <div
            class="profile-email"
            id="heroEmail">

            —

        </div>


        <input
            type="file"
            id="photoInput"
            accept="image/*"
            hidden>

    </section>



    <!-- =================================
         PERSONAL INFORMATION
    ================================= -->

    <section class="section">

        <div class="section-card">

            <div class="section-title">

                <i class="fa-solid fa-id-card"></i>

                المعلومات الشخصية

            </div>


            <div class="form-grid">


                <!-- NAME -->

                <div class="form-group full">

                    <label>
                        الاسم
                    </label>

                    <div class="input-wrap">

                        <i class="input-icon fa-solid fa-user"></i>

                        <input
                            id="name"
                            type="text"
                            placeholder="أدخل اسمك">

                    </div>

                </div>


                <!-- GENDER -->

                <div class="form-group">

                    <label>
                        الجنس
                    </label>

                    <div class="input-wrap">

                        <i class="input-icon fa-solid fa-venus-mars"></i>

                        <select id="gender">

                            <option value="">
                                غير محدد
                            </option>

                            <option value="ذكر">
                                ذكر
                            </option>

                            <option value="أنثى">
                                أنثى
                            </option>

                        </select>

                    </div>

                </div>


                <!-- BLOOD -->

                <div class="form-group">

                    <label>
                        الزمرة الدموية
                    </label>

                    <div class="input-wrap">

                        <i class="input-icon fa-solid fa-droplet"></i>

                        <select id="bloodType">

                            <option value="">
                                غير محددة
                            </option>

                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>

                        </select>

                    </div>

                </div>


                <!-- HEIGHT -->

                <div class="form-group">

                    <label>
                        الطول (سم)
                    </label>

                    <div class="input-wrap">

                        <i class="input-icon fa-solid fa-ruler-vertical"></i>

                        <input
                            id="height"
                            type="number"
                            min="50"
                            max="250"
                            placeholder="160">

                    </div>

                </div>


                <!-- WEIGHT -->

                <div class="form-group">

                    <label>
                        الوزن (كغ)
                    </label>

                    <div class="input-wrap">

                        <i class="input-icon fa-solid fa-weight-scale"></i>

                        <input
                            id="weight"
                            type="number"
                            min="2"
                            max="500"
                            step="0.1"
                            placeholder="50">

                    </div>

                </div>


                <!-- DISEASES -->

                <div class="form-group full">

                    <label>
                        الأمراض المزمنة
                    </label>

                    <div class="input-wrap">

                        <i class="input-icon fa-solid fa-notes-medical"></i>

                        <textarea
                            id="chronicDiseases"
                            placeholder="مثال: السكري، ارتفاع ضغط الدم... أو اتركه فارغاً إذا لم توجد"></textarea>

                    </div>

                </div>

            </div>

        </div>

    </section>



    <!-- =================================
         BMI
    ================================= -->

    <section class="section">

        <div class="section-card">

            <div class="section-title">

                <i class="fa-solid fa-chart-simple"></i>

                مؤشر كتلة الجسم

            </div>


            <div class="bmi-card">

                <div class="bmi-icon">

                    <i class="fa-solid fa-weight-scale"></i>

                </div>


                <div>

                    <div class="bmi-label">
                        BMI
                    </div>

                    <div
                        class="bmi-value"
                        id="bmiValue">

                        —

                    </div>

                </div>


                <div
                    class="bmi-status"
                    id="bmiStatus">

                    —

                </div>

            </div>

        </div>

    </section>



    <!-- =================================
         SAVE
    ================================= -->

    <section class="section">

        <button
            class="save-button"
            id="saveButton">

            <i class="fa-solid fa-floppy-disk"></i>

            حفظ التغييرات

        </button>

    </section>



    <!-- =================================
         ACCOUNT ACTIONS
    ================================= -->

    <section class="section">

        <div class="section-card">

            <div class="section-title">

                <i class="fa-solid fa-shield-heart"></i>

                حسابي

            </div>


            <div class="action-list">


                <a
                    href="challenges.html"
                    class="action">

                    <div class="action-icon">

                        <i class="fa-solid fa-list-check"></i>

                    </div>

                    <div class="action-content">

                        <div class="action-title">
                            تحدياتي
                        </div>

                        <div class="action-sub">
                            اختر العادات الصحية التي تريد متابعتها
                        </div>

                    </div>

                    <div class="action-arrow">

                        <i class="fa-solid fa-chevron-left"></i>

                    </div>

                </a>


                <a
                    href="health.html"
                    class="action">

                    <div class="action-icon">

                        <i class="fa-solid fa-heart-pulse"></i>

                    </div>

                    <div class="action-content">

                        <div class="action-title">
                            بياناتي الصحية
                        </div>

                        <div class="action-sub">
                            الوزن، السكر، ضغط الدم والقياسات
                        </div>

                    </div>

                    <div class="action-arrow">

                        <i class="fa-solid fa-chevron-left"></i>

                    </div>

                </a>


                <a
                    href="dashboard.html"
                    class="action">

                    <div class="action-icon">

                        <i class="fa-solid fa-house"></i>

                    </div>

                    <div class="action-content">

                        <div class="action-title">
                            الرئيسية
                        </div>

                        <div class="action-sub">
                            العودة إلى لوحة المتابعة
                        </div>

                    </div>

                    <div class="action-arrow">

                        <i class="fa-solid fa-chevron-left"></i>

                    </div>

                </a>

            </div>

        </div>

    </section>



    <!-- =================================
         LOGOUT
    ================================= -->

    <section class="section">

        <button
            class="logout"
            id="logoutButton">

            <i class="fa-solid fa-right-from-bracket"></i>

            تسجيل الخروج

        </button>

    </section>

</main>



<!-- =================================
     BOTTOM NAV
================================= -->

<nav class="bottom-nav">

    <a
        href="dashboard.html"
        class="nav-item">

        <i class="fa-solid fa-house"></i>

        الرئيسية

    </a>


    <a
        href="challenges.html"
        class="nav-item">

        <i class="fa-solid fa-list-check"></i>

        تحدياتي

    </a>


    <a
        href="health.html"
        class="nav-item">

        <i class="fa-solid fa-heart-pulse"></i>

    </a>


    <a
        href="profile.html"
        class="nav-item active">

        <i class="fa-solid fa-user"></i>

    </a>

</nav>

/* =================================

const loading =
    document.getElementById("loading");

const profilePhoto =
    document.getElementById("profilePhoto");

const heroName =

    document.getElementById("heroEmail");

const nameInput =
    document.getElementById("name");

const genderInput =
    document.getElementById("gender");

const bloodInput =
    document.getElementById("bloodType");

const heightInput =
    document.getElementById("height");

const weightInput =
    document.getElementById("weight");

const diseasesInput =
    document.getElementById("chronicDiseases");

const bmiValue =
    document.getElementById("bmiValue");

const bmiStatus =
    document.getElementById("bmiStatus");

const saveButton =
    document.getElementById("saveButton");

const photoInput =
    document.getElementById("photoInput");

const message =
    document.getElementById("message");


/* =================================
   MESSAGE
================================= */

function showMessage(
    text,
    type="success"
){

    message.textContent = text;

    message.className =
        "message show " + type;


    setTimeout(
        ()=>{
            message.classList.remove(
                "show"
            );
        },
        2800
    );

}


/* =================================
   BMI
================================= */

function calculateBMI(){

    const weight =
        Number(weightInput.value);

    const height =
        Number(heightInput.value);


    if(
        !weight ||
        !height ||
        weight <= 0 ||
        height <= 0
    ){

        bmiValue.textContent = "—";

        bmiStatus.textContent = "—";

        return;

    }


    const bmi =
        weight /
        Math.pow(height / 100,2);


    bmiValue.textContent =
        bmi.toFixed(1);


    if(bmi < 18.5){

        bmiStatus.textContent =
            "نحافة";

        bmiStatus.style.background =
            "#FFF5E5";

        bmiStatus.style.color =
            "#D88A00";

    }

    else if(bmi < 25){

        bmiStatus.textContent =
            "طبيعي";

        bmiStatus.style.background =
            "#E9F9F5";

        bmiStatus.style.color =
            "#16866F";

    }

    else if(bmi < 30){

        bmiStatus.textContent =
            "زيادة في الوزن";

        bmiStatus.style.background =
            "#FFF5E5";

        bmiStatus.style.color =
            "#D88A00";

    }

    else{

        bmiStatus.textContent =
            "سمنة";

        bmiStatus.style.background =
            "#FFF0EE";

        bmiStatus.style.color =
            "#D94D3E";

    }

}


/* =================================
   LOAD PROFILE
================================= */

async function loadProfile(){

    try{

        const ref =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const snapshot =
            await getDoc(ref);


        if(snapshot.exists()){

            currentData =
                snapshot.data() || {};

        }else{

            currentData = {};

        }


        fillForm();

    }catch(error){

        console.error(error);

        showMessage(
            "تعذر تحميل بيانات الحساب.",
            "error"
        );

    }

}


/* =================================
   FILL FORM
================================= */

function fillForm(){

    const data =
        currentData || {};


    const name =
        data.name ||
        data.displayName ||
        currentUser.displayName ||
        "";


    nameInput.value =
        name;


    genderInput.value =
        data.gender ||
        data.sex ||
        "";


    bloodInput.value =
        data.bloodType ||
        data.bloodGroup ||
        data.blood ||
        "";


    heightInput.value =
        data.heightCm ??
        data.height ??
        "";


    weightInput.value =
        data.weightKg ??
        data.weight ??
        "";


    let diseases =
        data.chronicDiseases ??
        data.chronicDisease ??
        data.diseases ??
        data.medicalConditions ??
        "";


    if(Array.isArray(diseases)){

        diseases =
            diseases.join("، ");

    }


    diseasesInput.value =
        diseases || "";


    const photo =
        data.photoURL ||
        data.photoUrl ||
        data.avatar ||
        currentUser.photoURL ||
        createDefaultAvatar();


    profilePhoto.src =
        photo;


    heroName.textContent =
        name ||
        "مستخدم صحتي";


    heroEmail.textContent =
        currentUser.email ||
        "—";


    calculateBMI();

}


/* =================================
   PHOTO PREVIEW
================================= */

photoInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files?.[0];


        if(!file){
            return;
        }


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            showMessage(
                "الرجاء اختيار صورة صحيحة.",
                "error"
            );

            return;

        }


        if(
            file.size > 5 * 1024 * 1024
        ){

            showMessage(
                "حجم الصورة يجب أن يكون أقل من 5 ميغابايت.",
                "error"
            );

            return;

        }


        selectedPhoto = file;


        const reader =
            new FileReader();


        reader.onload =
            e => {

                profilePhoto.src =
                    e.target.result;

            };


        reader.readAsDataURL(file);

    }
);


/* =================================
   INPUT EVENTS
================================= */

heightInput.addEventListener(
    "input",
    calculateBMI
);

weightInput.addEventListener(
    "input",
    calculateBMI
);


/* =================================
   CONVERT IMAGE TO DATA URL
================================= */

function imageToDataURL(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();


            reader.onload =
                ()=>resolve(
                    reader.result
                );


            reader.onerror =
                reject;


            reader.readAsDataURL(file);

        }
    );

}


/* =================================
   SAVE
================================= */

saveButton.addEventListener(
    "click",
    async ()=>{

        if(!currentUser){
            return;
        }


        const name =
            nameInput.value.trim();


        if(!name){

            showMessage(
                "الرجاء إدخال اسم المستخدم.",
                "error"
            );

            nameInput.focus();

            return;

        }


        const height =
            Number(
                heightInput.value
            );


        const weight =
            Number(
                weightInput.value
            );


        if(
            height &&
            (
                height < 50 ||
                height > 250
            )
        ){

            showMessage(
                "الرجاء إدخال طول صحيح.",
                "error"
            );

            return;

        }


        if(
            weight &&
            (
                weight < 2 ||
                weight > 500
            )
        ){

            showMessage(
                "الرجاء إدخال وزن صحيح.",
                "error"
            );

            return;

        }


        saveButton.disabled = true;

        saveButton.innerHTML = `

            <i class="fa-solid fa-spinner fa-spin"></i>

            جاري الحفظ...

        `;


        try{

            let photoURL =
                currentData.photoURL ||
                currentData.photoUrl ||
                currentData.avatar ||
                currentUser.photoURL ||
                "";


            /*
              ملاحظة:
              الصورة الجديدة يتم تحويلها إلى Data URL
              حتى يعمل الملف بدون Cloudinary.
            */

            if(selectedPhoto){

                photoURL =
                    await imageToDataURL(
                        selectedPhoto
                    );

            }


            const dataToSave = {

                name:name,

                displayName:name,

                gender:
                    genderInput.value || "",

                bloodType:
                    bloodInput.value || "",

                heightCm:
                    height || null,

                weightKg:
                    weight || null,

                chronicDiseases:
                    diseasesInput.value.trim(),

                photoURL:
                    photoURL || "",

                updatedAt:
                    serverTimestamp()

            };


            await setDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                ),
                dataToSave,
                {
                    merge:true
                }
            );


            /*
              تحديث اسم Firebase Authentication
              أيضاً حتى يبقى الاسم متوافقاً.
            */

            try{

                await updateProfile(
                    currentUser,
                    {
                        displayName:name
                    }
                );

            }catch(authError){

                console.warn(
                    "Auth profile update:",
                    authError
                );

            }


            currentData = {
                ...currentData,
                ...dataToSave
            };


            selectedPhoto = null;


            fillForm();


            showMessage(
                "تم حفظ معلومات حسابك بنجاح."
            );


        }catch(error){

            console.error(
                "Save profile error:",
                error
            );


            showMessage(
                "حدث خطأ أثناء حفظ البيانات.",
                "error"
            );

        }


        saveButton.disabled = false;

        saveButton.innerHTML = `

            <i class="fa-solid fa-floppy-disk"></i>

            حفظ التغييرات

        `;

    }
);


/* =================================
   LOGOUT
================================= */

document.getElementById(
    "logoutButton"
).addEventListener(
    "click",
    async ()=>{

        const confirmed =
            confirm(
                "هل تريد تسجيل الخروج من حسابك؟"
            );


        if(!confirmed){
            return;
        }


        try{

            await signOut(auth);

            window.location.href =
                "login.html";

        }catch(error){

            console.error(error);

            showMessage(
                "تعذر تسجيل الخروج.",
                "error"
            );

        }

    }
);


/* =================================
   AUTH
================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        currentUser = user;


        await loadProfile();


        setTimeout(
            ()=>{
                loading.classList.add(
                    "hide"
                );
            },
            250
        );

    }
);

</script>

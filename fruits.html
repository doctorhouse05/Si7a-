        .full-screen-container {

        .wave-bg-1 {

            border-radius: 45%;
            transform: rotate(-15deg);

        .wave-bg-2 {
            position: fixed;
            bottom: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.08);

        .app-header {
            display: flex;

            z-index: 5;
            margin-bottom: 15px;
        }

        .back-btn, .menu-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            font-size: 18px;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .page-title-top {
            font-size: 16px;
            font-weight: bold;
        }

        /* Main Content */

            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 2;
        }

        /* Search Box */
        .search-box {
            width: 100%;
            padding: 12px 15px;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 14px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);

        .search-box::placeholder {

        .fruits-list {

            gap: 10px;
        }

        .fruit-item {

            -webkit-backdrop-filter: blur(15px);

            text-decoration: none;
            color: #fff;
        }

        .fruit-item:active {
            transform: scale(0.98);
        }

        .fruit-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .fruit-icon {
            font-size: 20px;
            color: #34D399;
            width: 36px;
            height: 36px;
            background: rgba(52, 211, 153, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fruit-name {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }

        .fruit-arrow {
            color: #94A3B8;
            font-size: 14px;
        }

        /* Solid Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 62px;
            background: #1E3A8A;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.25);

        .nav-item {
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;

        .nav-item i { font-size: 18px; }
        .nav-item.active { color: #ffffff; font-weight: bold; }

        /* Sidebar Drawer */
        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1100;

        html[dir="ltr"] .sidebar.active { left: 0; }
        html[dir="rtl"] .sidebar { right: -280px; border-left: 1px solid rgba(255, 255, 255, 0.2); }

</head>

            { id: "pomegranate", ar: "الرمان", en: "Pomegranate", fr: "Grenade", es: "Granada" },

            { id: "watermelon", ar: "البطيخ", en: "Watermelon", fr: "Pastèque", es: "Sandía" },

            { id: "lychee", ar: "الليتشي", en: "Lychee", fr: "Litchi", es: "Lichi" },
            { id: "dragon_fruit", ar: "فاكهة التنين", en: "Dragon Fruit", fr: "Fruit du dragon", es: "Pitahaya" },
            { id: "passion_fruit", ar: "فاكهة العاطفة (الباشن فروت)", en: "Passion Fruit", fr: "Fruit de la passion", es: "Maracuyá" },
            { id: "custard_apple", ar: "القشطة", en: "Custard Apple", fr: "Pomme cannelle", es: "Chirimoya" },
            { id: "tamarind", ar: "التمر الهندي", en: "Tamarind", fr: "Tamarin", es: "Tamarindo" },
            { id: "jujube", ar: "العناب", en: "Jujube", fr: "Jujube", es: "Azufaifa" },
            { id: "loquat", ar: "الأسكدنيا (البشملة)", en: "Loquat", fr: "Nèfle du Japon", es: "Níspero" },
            { id: "sour_cherry", ar: "الكرز الحامض", en: "Sour Cherry", fr: "Griotte", es: "Guinda" },

            { id: "cranberry", ar: "التوت البري", en: "Cranberry", fr: "Canneberge", es: "Arándano rojo" },
            { id: "durian", ar: "الدوريان", en: "Durian", fr: "Durian", es: "Durián" },
            { id: "rambutan", ar: "الرامبوتان", en: "Rambutan", fr: "Ramboutan", es: "Rambután" },
            { id: "feijoa", ar: "الفيجوا", en: "Feijoa", fr: "Feijoa", es: "Feijoa" }
        ];

        const translations = {
            ar: {
                page_title: "الفواكه", home: "الرئيسية", challenge: "التحدي", health_file: "ملفي الصحي", settings: "الإعدادات", select_language: "اللغة", health_metrics: "قياساتي الصحية", daily_challenge: "التحدي اليومي", diet_plan: "نظامي الغذائي", nutrition_facts: "القيمة الغذائية للأطعمة", period_tracker: "دورتي الشهرية", pregnancy_calc: "حاسبة الحمل",
                search_placeholder: "ابحث عن فاكهة..."
            },
            en: {
                page_title: "Fruits", home: "Home", challenge: "Challenge", health_file: "Health File", settings: "Settings", select_language: "Language", health_metrics: "Health Metrics", daily_challenge: "Daily Challenge", diet_plan: "Diet Plan", nutrition_facts: "Nutrition Facts", period_tracker: "Period Tracker", pregnancy_calc: "Pregnancy Calculator",
                search_placeholder: "Search for a fruit..."
            },
            fr: {
                page_title: "Fruits", home: "Accueil", challenge: "Défi", health_file: "Dossier Santé", settings: "Paramètres", select_language: "Langue", health_metrics: "Mesures", daily_challenge: "Défi quotidien", diet_plan: "Régime", nutrition_facts: "Valeur nutritionnelle", period_tracker: "Suivi des règles", pregnancy_calc: "Calculateur de grossesse",
                search_placeholder: "Rechercher un fruit..."
            },
            es: {
                page_title: "Frutas", home: "Inicio", challenge: "Desafío", health_file: "Perfil de salud", settings: "Ajustes", select_language: "Idioma", health_metrics: "Métricas", daily_challenge: "Desafío diario", diet_plan: "Dieta", nutrition_facts: "Valor nutricional", period_tracker: "Control del periodo", pregnancy_calc: "Calculadora de embarazo",
                search_placeholder: "Buscar una fruta..."
            }
        };

        function renderFruits(filterText = '') {
            const container = document.getElementById('fruitsContainer');
            container.innerHTML = '';

            // ترتيب أبجدي حسب اللغة الحالية
            const sortedFruits = [...fruitsData].sort((a, b) => {
                const nameA = a[currentLang] || a['ar'];
                const nameB = b[currentLang] || b['ar'];
                return nameA.localeCompare(nameB, currentLang === 'ar' ? 'ar' : 'en', { sensitivity: 'base' });
            });

            const filtered = sortedFruits.filter(fruit => {
                const name = (fruit[currentLang] || fruit['ar']).toLowerCase();
                return name.includes(filterText.toLowerCase());
            });

            filtered.forEach(fruit => {
                const name = fruit[currentLang] || fruit['ar'];
                const item = document.createElement('a');
                item.href = `fruit-detail.html?id=${fruit.id}`;
                item.className = 'fruit-item';
                item.innerHTML = `
                    <div class="fruit-info">
                        <div class="fruit-icon"><i class="fa-solid fa-apple-whole"></i></div>
                        <div class="fruit-name">${name}</div>
                    </div>
                    <div class="fruit-arrow"><i class="fa-solid fa-chevron-left" style="${currentLang === 'ar' ? '' : 'transform: rotate(180deg);'}"></i></div>
                `;
                container.appendChild(item);
            });
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('appLanguage', lang);
            const html = document.documentElement;
            
            if (lang === 'ar') {
                html.setAttribute('dir', 'rtl');
                html.setAttribute('lang', 'ar');
                document.getElementById('backIcon').className = "fa-solid fa-arrow-right";
            } else {
                html.setAttribute('dir', 'ltr');
                html.setAttribute('lang', lang);
                document.getElementById('backIcon').className = "fa-solid fa-arrow-left";
            }

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });

            const searchInput = document.getElementById("searchInput");
            if (searchInput && translations[lang]) {
                searchInput.placeholder = translations[lang].search_placeholder;
            }

            const langSelect = document.getElementById("languageSelect");
            if (langSelect) langSelect.value = lang;

            renderFruits(searchInput.value);
        }

        document.getElementById("languageSelect").addEventListener("change", (e) => {
            setLanguage(e.target.value);
        });

        document.getElementById("searchInput").addEventListener("input", (e) => {
            renderFruits(e.target.value);
        });

        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("sidebarOverlay");

        document.getElementById("openSidebar").addEventListener("click", () => {
            sidebar.classList.add("active");
            overlay.style.display = "block";
        });

        overlay.addEventListener("click", () => {
            sidebar.classList.remove("active");
            overlay.style.display = "none";
        });

        setLanguage(currentLang);
    </script>

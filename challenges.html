<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<meta name="theme-color" content="#F5F5F5">

<title>صحتي+ | تحدياتي</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{

    --black:#111111;
    --black-soft:#202020;

    --pink:#FE2C55;
    --pink-soft:#FFF0F3;

    --cyan:#25F4EE;

    --text:#171717;
    --text-soft:#444;
    --muted:#7A7A7A;

    --bg:#F5F5F5;
    --card:#FFFFFF;

    --border:#E5E5E5;

    --green:#16A085;
    --green-soft:#EAF8F4;

    --purple:#7357D8;
    --purple-soft:#F1EEFF;

    --orange:#E58A00;
    --orange-soft:#FFF4DF;

    --blue:#1976D2;
    --blue-soft:#EDF5FF;

    --gray-soft:#F4F4F4;

    --shadow:
        0 4px 16px rgba(0,0,0,.055);
}


/* =========================================================
   BASE
========================================================= */

html{
    scroll-behavior:smooth;
}

body{

    font-family:"Cairo",sans-serif;

    background:#F5F5F5;

    color:var(--text);

    min-height:100vh;

    font-size:15px;

    font-weight:700;

    line-height:1.8;

    -webkit-font-smoothing:antialiased;

    padding-bottom:105px;
}

button,
input,
select{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}


/* =========================================================
   APP
========================================================= */

.app{

    width:100%;

    max-width:650px;

    margin:auto;

    padding:
        0
        15px
        30px;
}


/* =========================================================
   TOP AREA
========================================================= */

.top-area{

    position:relative;

    margin-left:-15px;
    margin-right:-15px;

    padding:
        14px
        15px
        18px;

    background:#F5F5F5;

    border-bottom:
        1px solid
        #E8E8E8;

    margin-bottom:18px;
}


/* =========================================================
   TOP HEADER
========================================================= */

.page-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:13px;
}

.page-heading{

    display:flex;

    align-items:center;

    gap:10px;
}

.page-heading-icon{

    width:43px;
    height:43px;

    border-radius:14px;

    background:#111;

    color:#fff;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:18px;

    box-shadow:
        3px 3px 0 #25F4EE,
        -3px -3px 0 #FE2C55;
}

.page-heading-text{

    line-height:1.3;
}

.page-heading-title{

    font-size:20px;

    font-weight:900;

    color:#111;
}

.page-heading-subtitle{

    font-size:11px;

    color:#777;

    font-weight:800;
}

.selected-count{

    background:#111;

    color:#fff;

    padding:
        8px
        11px;

    border-radius:12px;

    font-size:11px;

    font-weight:900;

    white-space:nowrap;
}


/* =========================================================
   INTRO CARD
========================================================= */

.intro-card{

    position:relative;

    overflow:hidden;

    background:#fff;

    border:
        1px solid
        #E4E4E4;

    border-radius:20px;

    padding:15px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.05);

    margin-bottom:18px;
}

.intro-card::before{

    content:"";

    position:absolute;

    top:0;
    right:0;

    width:100%;
    height:4px;

    background:
        linear-gradient(
            90deg,
            #25F4EE 0%,
            #25F4EE 42%,
            #FE2C55 58%,
            #FE2C55 100%
        );
}

.intro-content{

    display:flex;

    align-items:center;

    gap:12px;

    padding-top:3px;
}

.intro-icon{

    width:45px;
    height:45px;

    flex:none;

    border-radius:14px;

    background:#FFF0F3;

    color:#FE2C55;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:19px;
}

.intro-title{

    font-size:15px;

    font-weight:900;

    color:#171717;

    margin-bottom:2px;
}

.intro-text{

    font-size:12px;

    color:#777;

    font-weight:700;

    line-height:1.8;
}


/* =========================================================
   SECTION HEADER
========================================================= */

.section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:12px;
}

.section-title{

    display:flex;

    align-items:center;

    gap:9px;

    font-size:18px;

    font-weight:900;

    color:#171717;
}

.section-title i{

    color:#FE2C55;

    font-size:17px;
}


/* =========================================================
   CHALLENGE LIST
========================================================= */

.challenge-list{

    display:grid;

    gap:10px;
}


/* =========================================================
   CHALLENGE CARD
========================================================= */

.challenge-card{

    position:relative;

    overflow:hidden;

    background:#fff;

    border:
        1px solid
        #E5E5E5;

    border-radius:18px;

    padding:13px;

    box-shadow:
        var(--shadow);

    cursor:pointer;

    transition:
        transform .15s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

.challenge-card:active{

    transform:scale(.985);
}

.challenge-card::before{

    content:"";

    position:absolute;

    right:0;
    top:0;
    bottom:0;

    width:4px;

    background:
        var(--card-color);

    opacity:0;
}

.challenge-card.selected{

    border-color:
        var(--card-color);

    box-shadow:
        0 6px 18px
        rgba(0,0,0,.07);
}

.challenge-card.selected::before{

    opacity:1;
}


/* =========================================================
   CARD TOP
========================================================= */

.challenge-top{

    display:flex;

    align-items:center;

    gap:11px;
}

.challenge-icon{

    width:49px;
    height:49px;

    min-width:49px;

    border-radius:15px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        var(--icon-bg);

    color:
        var(--card-color);

    font-size:20px;
}

.challenge-content{

    flex:1;

    min-width:0;
}

.challenge-name{

    color:#1B1B1B;

    font-size:15px;

    font-weight:900;

    line-height:1.5;

    margin-bottom:1px;
}

.challenge-description{

    color:#777;

    font-size:11px;

    font-weight:700;

    line-height:1.7;
}


/* =========================================================
   CHECK
========================================================= */

.check-box{

    width:31px;
    height:31px;

    min-width:31px;

    border-radius:10px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:
        2px solid
        #D8D8D8;

    color:transparent;

    background:#fff;

    transition:.2s;
}

.challenge-card.selected
.check-box{

    border-color:
        var(--card-color);

    background:
        var(--card-color);

    color:#fff;
}

.check-box i{

    font-size:13px;
}


/* =========================================================
   TARGET INFO
========================================================= */

.target-info{

    margin-top:10px;

    padding:9px 10px;

    border-radius:13px;

    background:#FAFAFA;

    border:
        1px solid
        #E8E8E8;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;
}

.target-label{

    display:flex;

    align-items:center;

    gap:6px;

    color:#777;

    font-size:11px;

    font-weight:800;
}

.target-label i{

    color:
        var(--card-color);
}

.target-default{

    color:
        var(--card-color);

    font-size:11px;

    font-weight:900;

    text-align:left;
}


/* =========================================================
   TARGET PANEL
========================================================= */

.target-panel{

    display:none;

    margin-top:9px;

    padding:12px;

    border-radius:14px;

    background:#F8F8F8;

    border:
        1px solid
        #E5E5E5;
}

.challenge-card.selected
.target-panel{

    display:block;
}

.target-label-large{

    display:block;

    color:#555;

    font-size:11px;

    font-weight:900;

    margin-bottom:7px;
}


/* =========================================================
   INPUTS
========================================================= */

.target-input,
.time-input{

    width:100%;

    min-height:45px;

    border:
        1px solid
        #D9D9D9;

    background:#fff;

    border-radius:12px;

    padding:9px 10px;

    outline:none;

    color:#171717;

    font-size:14px;

    font-weight:800;

    text-align:center;
}

.target-input:focus,
.time-input:focus{

    border-color:#111;

    box-shadow:
        0 0 0 3px
        rgba(0,0,0,.06);
}


/* =========================================================
   TIME
========================================================= */

.time-row{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:9px;
}

.time-box{

    background:#fff;

    border:
        1px solid
        #E3E3E3;

    border-radius:13px;

    padding:8px;
}

.time-box-label{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    margin-bottom:5px;

    color:#666;

    font-size:10px;

    font-weight:900;
}

.time-box-label i{

    color:#7357D8;
}

.time-input{

    direction:ltr;

    font-size:16px;

    letter-spacing:1px;
}


/* =========================================================
   OPTIONS
========================================================= */

.option-row{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;
}

.option{

    position:relative;

    min-height:47px;

    border:
        1px solid
        #DFDFDF;

    background:#fff;

    border-radius:12px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:6px;

    color:#666;

    font-size:12px;

    font-weight:900;

    transition:.2s;
}

.option input{

    position:absolute;

    opacity:0;

    pointer-events:none;
}

.option.selected{

    border-color:
        var(--card-color);

    background:
        var(--icon-bg);

    color:
        var(--card-color);
}

.option i{

    font-size:15px;
}


/* =========================================================
   SAVE AREA
========================================================= */

.save-area{

    margin-top:18px;

    position:sticky;

    bottom:10px;

    z-index:20;
}

.save-button{

    width:100%;

    min-height:55px;

    border-radius:16px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:8px;

    color:#fff;

    background:#111;

    box-shadow:
        0 7px 18px
        rgba(0,0,0,.16);

    font-size:14px;

    font-weight:900;

    transition:.2s;
}

.save-button::before{

    content:"";

    position:absolute;
}

.save-button:active{

    transform:scale(.98);
}

.save-button:disabled{

    opacity:.6;

    cursor:not-allowed;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    position:fixed;

    left:50%;

    bottom:90px;

    transform:
        translateX(-50%)
        translateY(20px);

    width:min(90%,430px);

    background:#111;

    color:#fff;

    padding:12px 15px;

    border-radius:14px;

    text-align:center;

    font-size:12px;

    font-weight:800;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:300;
}

.message.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

.message.success{

    background:#111;
}

.message.error{

    background:#B42318;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{

    position:fixed;

    bottom:0;

    left:50%;

    transform:
        translateX(-50%);

    width:min(650px,100%);

    background:
        rgba(255,255,255,.98);

    backdrop-filter:blur(15px);

    border-top:
        1px solid
        #E1E1E1;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    padding:
        7px
        8px
        max(
            8px,
            env(safe-area-inset-bottom)
        );

    z-index:100;
}

.nav-item{

    text-align:center;

    color:#999;

    font-size:12px;

    font-weight:800;

    padding:5px;

    border-radius:13px;

    transition:.2s;
}

.nav-item i{

    display:block;

    font-size:20px;

    margin-bottom:4px;
}

.nav-item.active{

    color:#111;

    font-weight:900;

    background:#F4F4F4;
}

.nav-item.active i{

    color:#FE2C55;
}


/* =========================================================
   LOADING
========================================================= */

.loading-screen{

    position:fixed;

    inset:0;

    background:#fff;

    z-index:9999;

    display:flex;

    align-items:center;
    justify-content:center;

    transition:.3s;
}

.loading-screen.hide{

    opacity:0;

    pointer-events:none;
}

.loading-box{

    text-align:center;
}

.loading-logo{

    width:72px;
    height:72px;

    border-radius:22px;

    background:#111;

    color:#fff;

    display:flex;

    align-items:center;
    justify-content:center;

    margin:auto auto 12px;

    font-size:30px;

    box-shadow:
        4px 4px 0 #25F4EE,
        -4px -4px 0 #FE2C55;
}

.loading-box strong{

    display:block;

    font-size:22px;

    font-weight:900;
}

.loading-box p{

    font-size:13px;

    color:#777;

    font-weight:700;

    margin-top:3px;
}

.spinner{

    width:25px;
    height:25px;

    border:3px solid #E8E8E8;

    border-top-color:#FE2C55;

    border-radius:50%;

    animation:
        spin .8s linear infinite;

    margin:15px auto 0;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   SMALL SCREENS
========================================================= */

@media(max-width:400px){

    .app{

        padding-left:11px;
        padding-right:11px;
    }

    .top-area{

        margin-left:-11px;
        margin-right:-11px;

        padding-left:11px;
        padding-right:11px;
    }

    .page-heading-title{

        font-size:18px;
    }

    .page-heading-icon{

        width:40px;
        height:40px;

        font-size:17px;
    }

    .selected-count{

        font-size:10px;

        padding:
            7px 9px;
    }

    .intro-card{

        padding:13px;
    }

    .challenge-card{

        padding:11px;
    }

    .challenge-icon{

        width:45px;
        height:45px;

        min-width:45px;

        font-size:18px;
    }

    .challenge-name{

        font-size:14px;
    }

    .challenge-description{

        font-size:10px;
    }

}

</style>

</head>

function showMessage(
    text,
    type="success"
){

    message.textContent =
        text;

    message.className =
        "message show " +
        type;

    setTimeout(
        () => {

            message.className =
                "message";

        },
        2600
    );

}



/* =========================================================
   NORMALIZE SELECTED
========================================================= */

function normalizeSelected(data){

    let selected =
        data.selected ??
        data.selectedChallenges ??
        data.challenges;


    if(Array.isArray(selected)){

        return selected.filter(
            id =>
                CHALLENGES.some(
                    item =>
                        item.id === id
                )
        );

    }


    const result = [];


    CHALLENGES.forEach(
        challenge => {

            if(
                data[challenge.id] === true
            ){

                result.push(
                    challenge.id
                );

            }

        }
    );


    return result;

}



/* =========================================================
   LOAD SETTINGS
========================================================= */

async function loadSettings(){

    if(!currentUser){

        return;

    }


    try{

        const ref =
            doc(
                db,
                "users",
                currentUser.uid,
                "challengeSettings",
                "main"
            );


        const snap =
            await getDoc(ref);


        if(snap.exists()){

            const data =
                snap.data() || {};


            selectedChallenges =
                normalizeSelected(
                    data
                );


            targets =
                data.targets || {};


            challengeValues =
                data.values || {};

        }else{

            selectedChallenges = [];

            targets = {};

            challengeValues = {};

        }


        renderChallenges();

        updateCount();


    }catch(error){

        console.error(
            "Load settings error:",
            error
        );


        selectedChallenges = [];

        targets = {};

        challengeValues = {};

        renderChallenges();

        updateCount();


        showMessage(
            "تعذر تحميل إعداداتك",
            "error"
        );

    }

}



/* =========================================================
   GET TARGET
========================================================= */

function getTarget(challenge){

    if(
        challenge.type === "boolean" ||
        challenge.type === "time"
    ){

        return challenge.target;

    }


    const custom =
        targets?.[challenge.id];


    if(
        custom !== undefined &&
        custom !== null &&
        custom !== ""
    ){

        const number =
            Number(custom);


        if(
            Number.isFinite(number) &&
            number > 0
        ){

            return number;

        }

    }


    return challenge.target;

}



/* =========================================================
   TARGET DISPLAY
========================================================= */

function getTargetDisplay(challenge){

    const target =
        getTarget(challenge);


    if(
        challenge.id === "sugar"
    ){

        return "لم آكل";

    }


    if(
        challenge.id === "smoking"
    ){

        return "إيقاف التدخين";

    }


    if(
        challenge.id === "sleepSchedule"
    ){

        return "موعد شخصي";

    }


    if(
        challenge.id === "sleep"
    ){

        return `${target} ساعات`;

    }


    return `${Number(target).toLocaleString("ar-DZ")} ${challenge.unit}`;

}



/* =========================================================
   RENDER
========================================================= */

function renderChallenges(){

    challengeList.innerHTML = "";


    CHALLENGES.forEach(
        challenge => {

            const isSelected =
                selectedChallenges.includes(
                    challenge.id
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "challenge-card" +
                (
                    isSelected
                        ? " selected"
                        : ""
                );


            card.dataset.id =
                challenge.id;


            card.style.setProperty(
                "--card-color",
                challenge.color
            );


            card.style.setProperty(
                "--icon-bg",
                challenge.bg
            );


            let extraHTML = "";


            /* NUMBER */

            if(
                challenge.type === "number"
            ){

                const value =
                    getTarget(challenge);


                extraHTML = `

                    <div class="target-info">

                        <div class="target-label">

                            <i class="fa-solid fa-bullseye"></i>

                            الهدف اليومي

                        </div>

                        <div class="target-default">

                            ${getTargetDisplay(challenge)}

                        </div>

                    </div>


                    <div class="target-panel">

                        <label
                            class="target-label-large">

                            عدّل هدفك اليومي

                        </label>

                        <input
                            class="target-input"
                            type="number"
                            min="1"
                            step="1"
                            value="${value}"
                            data-target="${challenge.id}">

                    </div>

                `;

            }


            /* TIME */

            if(
                challenge.type === "time"
            ){

                const savedSleep =
                    targets?.sleepTime ||
                    challenge.sleepTime;


                const savedWake =
                    targets?.wakeTime ||
                    challenge.wakeTime;


                extraHTML = `

                    <div class="target-info">

                        <div class="target-label">

                            <i class="fa-solid fa-clock"></i>

                            أوقاتك المطلوبة

                        </div>

                        <div class="target-default">

                            ${savedSleep}
                            -
                            ${savedWake}

                        </div>

                    </div>


                    <div class="target-panel">

                        <div class="time-row">

                            <div class="time-box">

                                <div class="time-box-label">

                                    <i class="fa-solid fa-moon"></i>

                                    وقت النوم

                                </div>

                                <input
                                    class="time-input"
                                    type="time"
                                    value="${savedSleep}"
                                    data-time="sleepTime">

                            </div>


                            <div class="time-box">

                                <div class="time-box-label">

                                    <i class="fa-solid fa-sun"></i>

                                    وقت الاستيقاظ

                                </div>

                                <input
                                    class="time-input"
                                    type="time"
                                    value="${savedWake}"
                                    data-time="wakeTime">

                            </div>

                        </div>

                    </div>

                `;

            }


            /* BOOLEAN */

            if(
                challenge.type === "boolean"
            ){

                let defaultValue =
                    challenge.defaultValue;


                const savedValue =
                    challengeValues?.[
                        challenge.id
                    ];


                if(savedValue){

                    defaultValue =
                        savedValue;

                }


                if(
                    challenge.id === "sugar"
                ){

                    extraHTML = `

                        <div class="target-info">

                            <div class="target-label">

                                <i class="fa-solid fa-bullseye"></i>

                                الهدف

                            </div>

                            <div class="target-default">

                                لم آكل

                            </div>

                        </div>


                        <div class="target-panel">

                            <div class="option-row">

                                <label
                                    class="option ${
                                        defaultValue === "yes"
                                            ? "selected"
                                            : ""
                                    }">

                                    <input
                                        type="radio"
                                        name="sugar"
                                        value="yes"
                                        ${
                                            defaultValue === "yes"
                                                ? "checked"
                                                : ""
                                        }>

                                    <i class="fa-solid fa-circle-check"></i>

                                    أكلت

                                </label>


                                <label
                                    class="option ${
                                        defaultValue === "no"
                                            ? "selected"
                                            : ""
                                    }">

                                    <input
                                        type="radio"
                                        name="sugar"
                                        value="no"
                                        ${
                                            defaultValue === "no"
                                                ? "checked"
                                                : ""
                                        }>

                                    <i class="fa-solid fa-circle-xmark"></i>

                                    لم آكل

                                </label>

                            </div>

                        </div>

                    `;

                }


                if(
                    challenge.id === "smoking"
                ){

                    extraHTML = `

                        <div class="target-info">

                            <div class="target-label">

                                <i class="fa-solid fa-bullseye"></i>

                                الهدف

                            </div>

                            <div class="target-default">

                                إيقاف التدخين

                            </div>

                        </div>


                        <div class="target-panel">

                            <div class="option-row">

                                <label
                                    class="option ${
                                        defaultValue === "yes"
                                            ? "selected"
                                            : ""
                                    }">

                                    <input
                                        type="radio"
                                        name="smoking"
                                        value="yes"
                                        ${
                                            defaultValue === "yes"
                                                ? "checked"
                                                : ""
                                        }>

                                    <i class="fa-solid fa-smoking"></i>

                                    نعم

                                </label>


                                <label
                                    class="option ${
                                        defaultValue === "no"
                                            ? "selected"
                                            : ""
                                    }">

                                    <input
                                        type="radio"
                                        name="smoking"
                                        value="no"
                                        ${
                                            defaultValue === "no"
                                                ? "checked"
                                                : ""
                                        }>

                                    <i class="fa-solid fa-ban"></i>

                                    لا

                                </label>

                            </div>

                        </div>

                    `;

                }

            }


            card.innerHTML = `

                <div class="challenge-top">

                    <div class="challenge-icon">

                        <i class="fa-solid ${challenge.icon}">
                        </i>

                    </div>


                    <div class="challenge-content">

                        <div class="challenge-name">

                            ${challenge.name}

                        </div>


                        <div class="challenge-description">

                            ${challenge.description}

                        </div>

                    </div>


                    <div class="check-box">

                        <i class="fa-solid fa-check"></i>

                    </div>

                </div>


                ${extraHTML}

            `;


            /* CARD CLICK */

            card.addEventListener(
                "click",
                event => {

                    if(
                        event.target.closest(
                            "input"
                        )
                    ){

                        return;

                    }


                    toggleChallenge(
                        challenge.id
                    );

                }
            );


            /* NUMBER */

            const numberInput =
                card.querySelector(
                    ".target-input"
                );


            if(numberInput){

                numberInput.addEventListener(
                    "input",
                    event => {

                        const value =
                            Number(
                                event.target.value
                            );


                        if(
                            Number.isFinite(value) &&
                            value > 0
                        ){

                            targets[
                                challenge.id
                            ] =
                                value;

                        }

                    }
                );


                numberInput.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                    }
                );

            }


            /* TIME */

            const timeInputs =
                card.querySelectorAll(
                    ".time-input"
                );


            timeInputs.forEach(
                input => {

                    input.addEventListener(
                        "click",
                        event => {

                            event.stopPropagation();

                        }
                    );


                    input.addEventListener(
                        "change",
                        event => {

                            targets[
                                event.target.dataset.time
                            ] =
                                event.target.value;

                        }
                    );

                }
            );


            /* RADIO */

            const radioInputs =
                card.querySelectorAll(
                    'input[type="radio"]'
                );


            radioInputs.forEach(
                input => {

                    input.addEventListener(
                        "click",
                        event => {

                            event.stopPropagation();

                        }
                    );


                    input.addEventListener(
                        "change",
                        event => {

                            const name =
                                event.target.name;


                            challengeValues[
                                name
                            ] =
                                event.target.value;


                            const options =
                                card.querySelectorAll(
                                    ".option"
                                );


                            options.forEach(
                                option => {

                                    const radio =
                                        option.querySelector(
                                            "input"
                                        );


                                    option.classList.toggle(
                                        "selected",
                                        radio.checked
                                    );

                                }
                            );

                        }
                    );

                }
            );


            challengeList.appendChild(
                card
            );

        }
    );

}



/* =========================================================
   TOGGLE
========================================================= */

function toggleChallenge(id){

    const index =
        selectedChallenges.indexOf(id);


    if(index === -1){

        selectedChallenges.push(id);

    }else{

        selectedChallenges.splice(
            index,
            1
        );

    }


    renderChallenges();

    updateCount();

}



/* =========================================================
   COUNT
========================================================= */

function updateCount(){

    selectedCount.textContent =
        `${selectedChallenges.length.toLocaleString("ar-DZ")} محددة`;

}



/* =========================================================
   SAVE
========================================================= */

async function saveSettings(){

    if(!currentUser){

        showMessage(
            "يجب تسجيل الدخول أولاً",
            "error"
        );

        return;

    }


    saveButton.disabled =
        true;


    const originalHTML =
        saveButton.innerHTML;


    saveButton.innerHTML = `

        <i class="fa-solid fa-spinner fa-spin"></i>

        جاري الحفظ...

    `;


    try{

        const cleanTargets = {};


        CHALLENGES.forEach(
            challenge => {

                if(
                    !selectedChallenges.includes(
                        challenge.id
                    )
                ){

                    return;

                }


                if(
                    challenge.type === "number"
                ){

                    let value =
                        Number(
                            targets?.[
                                challenge.id
                            ]
                        );


                    if(
                        !Number.isFinite(value) ||
                        value <= 0
                    ){

                        value =
                            challenge.target;

                    }


                    cleanTargets[
                        challenge.id
                    ] =
                        value;

                }


                if(
                    challenge.id === "sleepSchedule"
                ){

                    cleanTargets.sleepTime =
                        targets.sleepTime ||
                        "23:00";

                    cleanTargets.wakeTime =
                        targets.wakeTime ||
                        "07:00";

                }

            }
        );


        const cleanValues = {};


        if(
            selectedChallenges.includes(
                "sugar"
            )
        ){

            cleanValues.sugar =
                challengeValues.sugar ||
                "no";

        }


        if(
            selectedChallenges.includes(
                "smoking"
            )
        ){

            cleanValues.smoking =
                challengeValues.smoking ||
                "no";

        }


        await setDoc(

            doc(
                db,
                "users",
                currentUser.uid,
                "challengeSettings",
                "main"
            ),

            {

                selected:
                    selectedChallenges,

                targets:
                    cleanTargets,

                values:
                    cleanValues,

                updatedAt:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );


        targets =
            cleanTargets;


        challengeValues =
            cleanValues;


        showMessage(

            selectedChallenges.length > 0

                ? "تم حفظ تحدياتك بنجاح"

                : "تم الحفظ، وستبقى متابعتك اليومية فارغة",

            "success"

        );


        setTimeout(
            () => {

                window.location.href =
                    "dashboard.html";

            },
            900
        );


    }catch(error){

        console.error(
            "Save error:",
            error
        );


        showMessage(
            "حدث خطأ أثناء حفظ الإعدادات",
            "error"
        );


        saveButton.disabled =
            false;


        saveButton.innerHTML =
            originalHTML;

    }

}


saveButton.addEventListener(
    "click",
    saveSettings
);


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            user;


        await loadSettings();


        setTimeout(
            () => {

                loadingScreen.classList.add(
                    "hide"
                );

            },
            500
        );

    }
);

</script>

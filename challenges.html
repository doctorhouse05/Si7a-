<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<meta name="theme-color" content="#1976D2">

<title>Si7a+ | تحدياتي</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{

    --blue:#1976D2;
    --blue-dark:#125EA8;
    --blue-light:#EAF5FF;

    --green:#16A085;
    --green-light:#E9F9F5;

    --orange:#F39C12;
    --orange-light:#FFF5E5;

    --purple:#7C4DFF;
    --purple-light:#F1EDFF;

    --pink:#E95D9B;
    --pink-light:#FFF0F6;

    --red:#E74C3C;
    --red-light:#FFF0EE;

    --text:#172333;
    --muted:#687789;

    --bg:#F4F8FC;
    --card:#FFFFFF;
    --border:#DFE8F1;

    --shadow:
        0 8px 25px rgba(22,73,115,.08);
}


/* =====================================================
   BODY
===================================================== */

html{
    scroll-behavior:smooth;
}

body{

    font-family:"Cairo",sans-serif;

    background:
        radial-gradient(
            circle at 100% 0%,
            rgba(25,118,210,.08),
            transparent 30%
        ),
        var(--bg);

    color:var(--text);

    min-height:100vh;

    padding-bottom:105px;

    font-size:15px;

    line-height:1.8;
}

button,
input,
select{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}


/* =====================================================
   LOADING SCREEN
===================================================== */

.loading-screen{

    position:fixed;

    inset:0;

    z-index:9999;

    background:
        linear-gradient(
            145deg,
            #0D5BAE,
            #1976D2 52%,
            #42A5F5
        );

    display:flex;

    align-items:center;
    justify-content:center;

    opacity:1;

    transition:
        opacity .45s ease,
        visibility .45s ease;
}

.loading-screen.hide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}

.loading-content{

    width:100%;

    max-width:330px;

    text-align:center;

    color:#fff;

    padding:20px;
}

.loading-logo{

    width:92px;
    height:92px;

    margin:0 auto 17px;

    border-radius:29px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(255,255,255,.16);

    border:
        1px solid
        rgba(255,255,255,.28);

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.14);

    backdrop-filter:blur(12px);
}

.loading-logo i{

    font-size:43px;

    color:#fff;
}

.loading-title{

    font-family:"Cairo",sans-serif;

    font-size:31px;

    font-weight:800;

    line-height:1.3;

    letter-spacing:.3px;
}

.loading-subtitle{

    margin-top:4px;

    font-size:14px;

    font-weight:600;

    color:
        rgba(255,255,255,.88);
}

.loading-spinner{

    width:27px;
    height:27px;

    margin:21px auto 0;

    border:
        3px solid
        rgba(255,255,255,.30);

    border-top-color:#fff;

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =====================================================
   APP
===================================================== */

.app{

    width:100%;

    max-width:650px;

    margin:auto;

    padding:0 15px 30px;
}


/* =====================================================
   TOP APP BAR
===================================================== */

.app-bar{

    position:relative;

    margin:
        0 -15px 18px;

    min-height:74px;

    padding:
        13px 17px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #0D5BAE,
            #1976D2 55%,
            #42A5F5
        );

    border-radius:
        0
        0
        24px
        24px;

    box-shadow:
        0 9px 25px
        rgba(25,118,210,.18);

    overflow:hidden;
}

.app-bar::before{

    content:"";

    position:absolute;

    width:150px;
    height:150px;

    border-radius:50%;

    background:
        rgba(255,255,255,.07);

    left:-60px;
    top:-85px;
}

.app-brand{

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;

    gap:11px;
}

.app-brand-icon{

    width:47px;
    height:47px;

    border-radius:15px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(255,255,255,.16);

    border:
        1px solid
        rgba(255,255,255,.24);

    font-size:21px;

    flex:none;
}

.app-brand-text{

    line-height:1.35;
}

.app-brand-name{

    font-family:Arial,sans-serif;

    direction:ltr;

    font-size:22px;

    font-weight:800;

    letter-spacing:.4px;
}

.app-brand-title{

    font-size:11px;

    font-weight:600;

    color:
        rgba(255,255,255,.84);
}

.app-bar-page{

    position:relative;

    z-index:2;

    font-size:13px;

    font-weight:800;

    color:
        rgba(255,255,255,.94);

    background:
        rgba(255,255,255,.13);

    padding:
        7px 11px;

    border-radius:11px;
}


/* =====================================================
   INTRO
===================================================== */

.intro{

    background:#fff;

    border:
        1px solid
        var(--border);

    border-radius:21px;

    padding:17px;

    margin-bottom:19px;

    box-shadow:var(--shadow);
}

.intro-row{

    display:flex;

    align-items:flex-start;

    gap:12px;
}

.intro-icon{

    width:44px;
    height:44px;

    min-width:44px;

    border-radius:14px;

    background:var(--blue-light);

    color:var(--blue);

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:18px;
}

.intro-title{

    font-size:16px;

    font-weight:800;

    margin-bottom:5px;

    color:#172333;
}

.intro-text{

    color:#667587;

    font-size:13px;

    font-weight:600;

    line-height:1.9;
}


/* =====================================================
   SECTION HEADER
===================================================== */

.section-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin:
        0 2px 12px;
}

.section-title{

    display:flex;

    align-items:center;

    gap:9px;

    font-size:18px;

    font-weight:800;
}

.section-title i{

    color:var(--blue);

    font-size:18px;
}

.selected-count{

    background:var(--blue-light);

    color:var(--blue);

    border-radius:12px;

    padding:7px 11px;

    font-size:12px;

    font-weight:800;
}


/* =====================================================
   CHALLENGE LIST
===================================================== */

.challenge-list{

    display:grid;

    gap:12px;
}


/* =====================================================
   CHALLENGE CARD
===================================================== */

.challenge-card{

    position:relative;

    background:#fff;

    border:
        2px solid
        var(--border);

    border-radius:21px;

    padding:15px;

    cursor:pointer;

    transition:
        transform .18s,
        border-color .18s,
        box-shadow .18s;

    box-shadow:
        0 5px 16px
        rgba(25,70,110,.035);

    overflow:hidden;
}

.challenge-card:active{

    transform:scale(.987);
}

.challenge-card.selected{

    border-color:
        var(--card-color);

    box-shadow:
        0 8px 24px
        rgba(25,118,210,.10);
}

.challenge-card::before{

    content:"";

    position:absolute;

    right:0;

    top:15px;
    bottom:15px;

    width:4px;

    border-radius:
        8px 0 0 8px;

    background:
        var(--card-color);

    opacity:0;
}

.challenge-card.selected::before{

    opacity:1;
}


/* =====================================================
   CARD TOP
===================================================== */

.challenge-top{

    display:flex;

    align-items:center;

    gap:13px;
}

.challenge-icon{

    width:53px;
    height:53px;

    min-width:53px;

    border-radius:16px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        var(--icon-bg);

    color:
        var(--card-color);

    font-size:22px;
}

.challenge-content{

    flex:1;

    min-width:0;
}

.challenge-name{

    font-size:16px;

    font-weight:800;

    line-height:1.5;

    color:#172333;
}

.challenge-description{

    color:#748294;

    font-size:12px;

    font-weight:600;

    line-height:1.8;
}

.check-box{

    width:32px;
    height:32px;

    min-width:32px;

    border-radius:10px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:
        2px solid
        #D4DEE8;

    color:transparent;

    background:#fff;

    transition:.2s;
}

.challenge-card.selected
.check-box{

    border-color:
        var(--card-color);

    background:
        var(--card-color);

    color:#fff;
}

.check-box i{

    font-size:14px;
}


/* =====================================================
   TARGET ROW
===================================================== */

.target-info{

    margin-top:12px;

    padding:10px 11px;

    border-radius:13px;

    background:#F8FBFE;

    border:
        1px solid
        #E5EDF4;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;
}

.target-label{

    display:flex;

    align-items:center;

    gap:6px;

    font-size:12px;

    font-weight:700;

    color:#667789;
}

.target-label i{

    color:
        var(--card-color);
}

.target-default{

    font-size:12px;

    font-weight:800;

    color:
        var(--card-color);

    text-align:left;
}


/* =====================================================
   TARGET PANEL
===================================================== */

.target-panel{

    display:none;

    margin-top:10px;

    background:#F8FBFE;

    border:
        1px solid
        #E1EAF2;

    border-radius:16px;

    padding:13px;
}

.challenge-card.selected
.target-panel{

    display:block;
}

.target-label-large{

    display:block;

    font-size:12px;

    font-weight:800;

    margin-bottom:7px;

    color:#4D5D6D;
}


/* =====================================================
   INPUTS
===================================================== */

.target-input,
.time-input{

    width:100%;

    min-height:46px;

    border:
        1px solid
        #D8E3ED;

    background:#fff;

    border-radius:12px;

    padding:10px;

    outline:none;

    font-size:15px;

    font-weight:700;

    color:var(--text);

    text-align:center;
}

.target-input:focus,
.time-input:focus{

    border-color:
        var(--blue);

    box-shadow:
        0 0 0 3px
        rgba(25,118,210,.08);
}


/* =====================================================
   SLEEP TIMES
===================================================== */

.time-row{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;
}

.time-box{

    background:#fff;

    border:
        1px solid
        #DDE6EF;

    border-radius:14px;

    padding:9px;
}

.time-box-label{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    margin-bottom:5px;

    color:#596A7C;

    font-size:11px;

    font-weight:800;
}

.time-box-label i{

    color:var(--purple);
}

.time-input{

    direction:ltr;

    font-size:17px;

    letter-spacing:1px;
}


/* =====================================================
   YES / NO OPTIONS
===================================================== */

.option-row{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:9px;
}

.option{

    position:relative;

    min-height:50px;

    border:
        1px solid
        #DCE5ED;

    background:#fff;

    border-radius:13px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    font-size:13px;

    font-weight:800;

    color:#5F7082;

    transition:.2s;
}

.option input{

    position:absolute;

    opacity:0;

    pointer-events:none;
}

.option.selected{

    border-color:
        var(--card-color);

    background:
        var(--icon-bg);

    color:
        var(--card-color);
}

.option i{

    font-size:16px;
}


/* =====================================================
   SUGAR
===================================================== */

.sugar-card{

    --card-color:#E95D9B;
    --icon-bg:#FFF0F6;
}


/* =====================================================
   SMOKING
===================================================== */

.smoking-card{

    --card-color:#607D8B;
    --icon-bg:#EEF2F4;
}


/* =====================================================
   SAVE AREA
===================================================== */

.save-area{

    margin-top:21px;

    position:sticky;

    bottom:10px;

    z-index:20;
}

.save-button{

    width:100%;

    min-height:56px;

    border-radius:17px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #125EA8,
            #1976D2,
            #2388E5
        );

    box-shadow:
        0 10px 25px
        rgba(25,118,210,.25);

    font-size:15px;

    font-weight:800;

    transition:.2s;
}

.save-button:active{

    transform:scale(.98);
}

.save-button:disabled{

    opacity:.65;

    cursor:not-allowed;
}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    position:fixed;

    left:50%;

    bottom:90px;

    transform:
        translateX(-50%)
        translateY(20px);

    width:
        min(90%,430px);

    background:#172333;

    color:#fff;

    padding:13px 16px;

    border-radius:14px;

    text-align:center;

    font-size:12px;

    font-weight:700;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:200;
}

.message.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

.message.success{
    background:#13795B;
}

.message.error{
    background:#C0392B;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{

    position:fixed;

    bottom:0;

    left:50%;

    transform:
        translateX(-50%);

    width:
        min(650px,100%);

    background:
        rgba(255,255,255,.97);

    backdrop-filter:blur(15px);

    border-top:
        1px solid
        #E3EAF1;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    padding:
        8px
        8px
        max(
            8px,
            env(safe-area-inset-bottom)
        );

    z-index:100;
}

.nav-item{

    color:#8995A3;

    text-align:center;

    padding:5px;

    font-size:11px;

    font-weight:700;

    border-radius:15px;
}

.nav-item i{

    display:block;

    font-size:19px;

    margin-bottom:4px;
}

.nav-item.active{

    color:var(--blue);

    background:#EDF6FF;

    font-weight:800;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:390px){

    .app{
        padding-left:11px;
        padding-right:11px;
    }

    .app-bar{
        margin-left:-11px;
        margin-right:-11px;
    }

    .app-brand-name{
        font-size:20px;
    }

    .app-bar-page{
        font-size:11px;
    }

    .challenge-card{
        padding:13px;
    }

    .challenge-icon{
        width:48px;
        height:48px;
        min-width:48px;
        font-size:20px;
    }

    .challenge-name{
        font-size:15px;
    }

    .challenge-description{
        font-size:11px;
    }

}

</style>

</head>

    {

            "تابع اختيارك اليومي لتجنب تناول السكريات.",

        target:"لم آكل",

        unit:"",

        icon:"fa-candy-cane",

        color:"#E95D9B",

        bg:"#FFF0F6",

        type:"boolean",

        defaultValue:"no",

        link:"nutrition.html"
    },


    {
        id:"smoking",

        name:"التدخين",

        description:
            "تابع الأيام التي لا تدخن فيها.",

        target:"إيقاف التدخين",

        unit:"",

        icon:"fa-smoking-ban",

        color:"#607D8B",

        bg:"#EEF2F4",

        type:"boolean",

        defaultValue:"no",

        link:"smoking.html"
    }

];



/* =====================================================
   ELEMENTS
===================================================== */

const challengeList =
    document.getElementById(
        "challengeList"
    );


const selectedCount =
    document.getElementById(
        "selectedCount"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );


const message =
    document.getElementById(
        "message"
    );


const loadingScreen =
    document.getElementById(
        "loadingScreen"
    );



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type="success"
){

    message.textContent =
        text;

    message.className =
        "message show " +
        type;

    setTimeout(
        () => {

            message.className =
                "message";

        },
        2600
    );

}



/* =====================================================
   NORMALIZE SELECTED
===================================================== */

function normalizeSelected(data){

    let selected =
        data.selected ??
        data.selectedChallenges ??
        data.challenges;


    if(Array.isArray(selected)){

        return selected.filter(
            id =>
                CHALLENGES.some(
                    item =>
                        item.id === id
                )
        );

    }


    const result = [];


    CHALLENGES.forEach(
        challenge => {

            if(
                data[challenge.id] === true
            ){

                result.push(
                    challenge.id
                );

            }

        }
    );


    return result;

}



/* =====================================================
   LOAD SETTINGS
===================================================== */

async function loadSettings(){

    if(!currentUser)
        return;


    try{

        const ref =
            doc(
                db,
                "users",
                currentUser.uid,
                "challengeSettings",
                "main"
            );


        const snap =
            await getDoc(ref);


        if(snap.exists()){

            const data =
                snap.data() || {};


            selectedChallenges =
                normalizeSelected(
                    data
                );


            targets =
                data.targets || {};


            challengeValues =
                data.values || {};

        }else{

            /*
             * لا توجد تحديات مختارة افتراضيًا
             */

            selectedChallenges = [];

            targets = {};

            challengeValues = {};

        }


        renderChallenges();

        updateCount();


    }catch(error){

        console.error(
            "Load settings error:",
            error
        );


        selectedChallenges = [];

        targets = {};

        challengeValues = {};

        renderChallenges();

        updateCount();


        showMessage(
            "تعذر تحميل إعداداتك",
            "error"
        );

    }

}



/* =====================================================
   GET TARGET
===================================================== */

function getTarget(challenge){

    if(
        challenge.type === "boolean" ||
        challenge.type === "time"
    ){

        return challenge.target;

    }


    const custom =
        targets?.[challenge.id];


    if(
        custom !== undefined &&
        custom !== null &&
        custom !== ""
    ){

        const number =
            Number(custom);


        if(
            Number.isFinite(number) &&
            number > 0
        ){

            return number;

        }

    }


    return challenge.target;

}



/* =====================================================
   TARGET DISPLAY
===================================================== */

function getTargetDisplay(challenge){

    const target =
        getTarget(challenge);


    if(
        challenge.id === "sugar"
    ){

        return "لم آكل";

    }


    if(
        challenge.id === "smoking"
    ){

        return "إيقاف التدخين";

    }


    if(
        challenge.id === "sleepSchedule"
    ){

        return "موعد شخصي";

    }


    if(
        challenge.id === "sleep"
    ){

        return `${target} ساعات`;

    }


    return `${Number(target).toLocaleString("ar-DZ")} ${challenge.unit}`;

}



/* =====================================================
   RENDER CHALLENGES
===================================================== */

function renderChallenges(){

    challengeList.innerHTML = "";


    CHALLENGES.forEach(
        challenge => {

            const isSelected =
                selectedChallenges.includes(
                    challenge.id
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "challenge-card" +
                (
                    isSelected
                        ? " selected"
                        : ""
                );


            card.dataset.id =
                challenge.id;


            card.style.setProperty(
                "--card-color",
                challenge.color
            );


            card.style.setProperty(
                "--icon-bg",
                challenge.bg
            );


            /*
             * السكريات
             */

            if(
                challenge.id === "sugar"
            ){

                card.classList.add(
                    "sugar-card"
                );

            }


            /*
             * التدخين
             */

            if(
                challenge.id === "smoking"
            ){

                card.classList.add(
                    "smoking-card"
                );

            }


            let extraHTML = "";


            /*
             * NUMBER TARGET
             */

            if(
                challenge.type === "number"
            ){

                const value =
                    getTarget(challenge);


                extraHTML = `

                    <div class="target-info">

                        <div class="target-label">

                            <i class="fa-solid fa-bullseye"></i>

                            الهدف اليومي

                        </div>

                        <div class="target-default">

                            ${getTargetDisplay(challenge)}

                        </div>

                    </div>


                    <div class="target-panel">

                        <label
                            class="target-label-large">

                            عدّل هدفك اليومي

                        </label>

                        <input
                            class="target-input"
                            type="number"
                            min="1"
                            step="1"
                            value="${value}"
                            data-target="${challenge.id}"
                            aria-label="الهدف اليومي">

                    </div>

                `;

            }


            /*
             * TIME
             */

            if(
                challenge.type === "time"
            ){

                const savedSleep =
                    targets?.sleepTime ||
                    challenge.sleepTime;


                const savedWake =
                    targets?.wakeTime ||
                    challenge.wakeTime;


                extraHTML = `

                    <div class="target-info">

                        <div class="target-label">

                            <i class="fa-solid fa-clock"></i>

                            أوقاتك المطلوبة

                        </div>

                        <div class="target-default">

                            ${savedSleep}
                            -
                            ${savedWake}

                        </div>

                    </div>


                    <div class="target-panel">

                        <div class="time-row">

                            <div class="time-box">

                                <div class="time-box-label">

                                    <i class="fa-solid fa-moon"></i>

                                    وقت النوم

                                </div>

                                <input
                                    class="time-input"
                                    type="time"
                                    value="${savedSleep}"
                                    data-time="sleepTime">

                            </div>


                            <div class="time-box">

                                <div class="time-box-label">

                                    <i class="fa-solid fa-sun"></i>

                                    وقت الاستيقاظ

                                </div>

                                <input
                                    class="time-input"
                                    type="time"
                                    value="${savedWake}"
                                    data-time="wakeTime">

                            </div>

                        </div>

                    </div>

                `;

            }


            /*
             * BOOLEAN
             */

            if(
                challenge.type === "boolean"
            ){

                let defaultValue =
                    challenge.defaultValue;


                const savedValue =
                    challengeValues?.[
                        challenge.id
                    ];


                if(savedValue){

                    defaultValue =
                        savedValue;

                }


                if(
                    challenge.id === "sugar"
                ){

                    extraHTML = `

                        <div class="target-info">

                            <div class="target-label">

                                <i class="fa-solid fa-bullseye"></i>

                                الهدف

                            </div>

                            <div class="target-default">

                                لم آكل

                            </div>

                        </div>


                        <div class="target-panel">

                            <div class="option-row">

                                <label
                                    class="option ${
                                        defaultValue === "yes"
                                            ? "selected"
                                            : ""
                                    }">

                                    <input
                                        type="radio"
                                        name="sugar"
                                        value="yes"
                                        ${
                                            defaultValue === "yes"
                                                ? "checked"
                                                : ""
                                        }>

                                    <i class="fa-solid fa-circle-check"></i>

                                    أكلت

                                </label>


                                <label
                                    class="option ${
                                        defaultValue === "no"
                                            ? "selected"
                                            : ""
                                    }">

                                    <input
                                        type="radio"
                                        name="sugar"
                                        value="no"
                                        ${
                                            defaultValue === "no"
                                                ? "checked"
                                                : ""
                                        }>

                                    <i class="fa-solid fa-circle-xmark"></i>

                                    لم آكل

                                </label>

                            </div>

                        </div>

                    `;

                }


                if(
                    challenge.id === "smoking"
                ){

                    extraHTML = `

                        <div class="target-info">

                            <div class="target-label">

                                <i class="fa-solid fa-bullseye"></i>

                                الهدف

                            </div>

                            <div class="target-default">

                                إيقاف التدخين

                            </div>

                        </div>


                        <div class="target-panel">

                            <div class="option-row">

                                <label
                                    class="option ${
                                        defaultValue === "yes"
                                            ? "selected"
                                            : ""
                                    }">

                                    <input
                                        type="radio"
                                        name="smoking"
                                        value="yes"
                                        ${
                                            defaultValue === "yes"
                                                ? "checked"
                                                : ""
                                        }>

                                    <i class="fa-solid fa-smoking"></i>

                                    نعم

                                </label>


                                <label
                                    class="option ${
                                        defaultValue === "no"
                                            ? "selected"
                                            : ""
                                    }">

                                    <input
                                        type="radio"
                                        name="smoking"
                                        value="no"
                                        ${
                                            defaultValue === "no"
                                                ? "checked"
                                                : ""
                                        }>

                                    <i class="fa-solid fa-ban"></i>

                                    لا

                                </label>

                            </div>

                        </div>

                    `;

                }

            }


            card.innerHTML = `

                <div class="challenge-top">

                    <div class="challenge-icon">

                        <i
                            class="fa-solid ${challenge.icon}">
                        </i>

                    </div>


                    <div class="challenge-content">

                        <div class="challenge-name">

                            ${challenge.name}

                        </div>


                        <div class="challenge-description">

                            ${challenge.description}

                        </div>

                    </div>


                    <div class="check-box">

                        <i class="fa-solid fa-check"></i>

                    </div>

                </div>


                ${extraHTML}

            `;


            /*
             * الضغط على البطاقة
             */

            card.addEventListener(
                "click",
                event => {

                    if(
                        event.target.closest(
                            "input"
                        )
                    ){

                        return;

                    }


                    toggleChallenge(
                        challenge.id
                    );

                }
            );


            /*
             * NUMBER INPUT
             */

            const numberInput =
                card.querySelector(
                    ".target-input"
                );


            if(numberInput){

                numberInput.addEventListener(
                    "input",
                    event => {

                        const value =
                            Number(
                                event.target.value
                            );


                        if(
                            Number.isFinite(value) &&
                            value > 0
                        ){

                            targets[
                                challenge.id
                            ] = value;

                        }

                    }
                );


                numberInput.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                    }
                );

            }


            /*
             * TIME INPUTS
             */

            const timeInputs =
                card.querySelectorAll(
                    ".time-input"
                );


            timeInputs.forEach(
                input => {

                    input.addEventListener(
                        "click",
                        event => {

                            event.stopPropagation();

                        }
                    );


                    input.addEventListener(
                        "change",
                        event => {

                            targets[
                                event.target.dataset.time
                            ] =
                                event.target.value;

                        }
                    );

                }
            );


            /*
             * RADIO OPTIONS
             */

            const radioInputs =
                card.querySelectorAll(
                    'input[type="radio"]'
                );


            radioInputs.forEach(
                input => {

                    input.addEventListener(
                        "click",
                        event => {

                            event.stopPropagation();

                        }
                    );


                    input.addEventListener(
                        "change",
                        event => {

                            const name =
                                event.target.name;


                            challengeValues[
                                name
                            ] =
                                event.target.value;


                            const options =
                                card.querySelectorAll(
                                    ".option"
                                );


                            options.forEach(
                                option => {

                                    const radio =
                                        option.querySelector(
                                            "input"
                                        );


                                    option.classList.toggle(
                                        "selected",
                                        radio.checked
                                    );

                                }
                            );

                        }
                    );

                }
            );


            challengeList.appendChild(
                card
            );

        }
    );

}



/* =====================================================
   TOGGLE CHALLENGE
===================================================== */

function toggleChallenge(id){

    const index =
        selectedChallenges.indexOf(id);


    if(index === -1){

        selectedChallenges.push(id);

    }else{

        selectedChallenges.splice(
            index,
            1
        );

    }


    renderChallenges();

    updateCount();

}



/* =====================================================
   COUNT
===================================================== */

function updateCount(){

    const count =
        selectedChallenges.length;


    selectedCount.textContent =
        `${count.toLocaleString("ar-DZ")} محددة`;

}



/* =====================================================
   SAVE SETTINGS
===================================================== */

async function saveSettings(){

    if(!currentUser){

        showMessage(
            "يجب تسجيل الدخول أولاً",
            "error"
        );

        return;

    }


    saveButton.disabled =
        true;


    const originalHTML =
        saveButton.innerHTML;


    saveButton.innerHTML = `

        <i class="fa-solid fa-spinner fa-spin"></i>

        جاري الحفظ...

    `;


    try{

        const cleanTargets = {};


        /*
         * الأهداف الرقمية
         */

        CHALLENGES.forEach(
            challenge => {

                if(
                    !selectedChallenges.includes(
                        challenge.id
                    )
                ){

                    return;

                }


                if(
                    challenge.type === "number"
                ){

                    let value =
                        Number(
                            targets?.[
                                challenge.id
                            ]
                        );


                    if(
                        !Number.isFinite(value) ||
                        value <= 0
                    ){

                        value =
                            challenge.target;

                    }


                    cleanTargets[
                        challenge.id
                    ] =
                        value;

                }


                /*
                 * أوقات النوم
                 */

                if(
                    challenge.id === "sleepSchedule"
                ){

                    cleanTargets.sleepTime =
                        targets.sleepTime ||
                        "23:00";

                    cleanTargets.wakeTime =
                        targets.wakeTime ||
                        "07:00";

                }

            }
        );


        /*
         * القيم الافتراضية
         */

        const cleanValues = {};


        if(
            selectedChallenges.includes(
                "sugar"
            )
        ){

            cleanValues.sugar =
                challengeValues.sugar ||
                "no";

        }


        if(
            selectedChallenges.includes(
                "smoking"
            )
        ){

            cleanValues.smoking =
                challengeValues.smoking ||
                "no";

        }


        /*
         * حفظ حسب UID
         */

        await setDoc(

            doc(
                db,
                "users",
                currentUser.uid,
                "challengeSettings",
                "main"
            ),

            {

                selected:
                    selectedChallenges,

                targets:
                    cleanTargets,

                values:
                    cleanValues,

                updatedAt:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );


        targets =
            cleanTargets;


        challengeValues =
            cleanValues;


        showMessage(

            selectedChallenges.length > 0

                ? "تم حفظ تحدياتك بنجاح"

                : "تم الحفظ، وستبقى متابعتك اليومية فارغة",

            "success"

        );


        setTimeout(
            () => {

                window.location.href =
                    "dashboard.html";

            },
            900
        );


    }catch(error){

        console.error(
            "Save error:",
            error
        );


        showMessage(
            "حدث خطأ أثناء حفظ الإعدادات",
            "error"
        );


        saveButton.disabled =
            false;


        saveButton.innerHTML =
            originalHTML;

    }

}



/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            user;


        await loadSettings();


        /*
         * إبقاء شاشة Si7a+ ظاهرة
         * قليلًا حتى يظهر الشعار والعنوان
         */

        setTimeout(
            () => {

                loadingScreen.classList.add(
                    "hide"
                );

            },
            850
        );

    }
);

</script>

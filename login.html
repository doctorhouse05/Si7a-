<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#A881EC">
    <meta name="description" content="تسجيل الدخول إلى حسابك في Si7a">
    <title>Si7a | تسجيل الدخول</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Tajawal", sans-serif;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
        }

        /* كارت واجهة الموبايل */
        .mobile-card {
            width: 100%;
            max-width: 380px;
            min-height: 720px;
            background: linear-gradient(165deg, #B991F8 0%, #A472ED 40%, #8E5BE2 100%);
            border-radius: 40px;
            padding: 45px 30px 35px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            color: #fff;
        }

        /* الأشكال المتموجة بالخلفية */
        .wave-bg-1 {
            position: absolute;
            top: -50px;
            right: -60px;
            width: 320px;
            height: 320px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 45%;
            transform: rotate(-15deg);
            pointer-events: none;
        }

        .wave-bg-2 {
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 40%;
            transform: rotate(25deg);
            pointer-events: none;
        }

        /* الشعار */
        .logo-box {
            width: 95px;
            height: 95px;
            background: #ffffff;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            margin-top: 10px;
            margin-bottom: 12px;
            position: relative;
            z-index: 2;
        }

        .logo-box i {
            font-size: 52px;
            color: #A06CE9;
        }

        .app-name {
            font-size: 26px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 35px;
            position: relative;
            z-index: 2;
        }

        /* عنوان الترحيب */
        .welcome-title {
            align-self: flex-start;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
        }

        /* النموذج والحقول */
        #loginForm {
            width: 100%;
            position: relative;
            z-index: 2;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 45px;
            background: transparent;
            border: none;
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.7);
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            padding: 0 10px 8px 35px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.85);
            font-size: 15px;
        }

        .input-wrapper input:focus {
            border-bottom-color: #ffffff;
        }

        /* إظهار/إخفاء كلمة المرور */
        .password-toggle {
            position: absolute;
            left: 5px;
            bottom: 10px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            font-size: 15px;
            padding: 5px;
        }

        .password-toggle:hover {
            color: #fff;
        }

        /* الأزرار والروابط */
        .login-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 25px;
            background: #ffffff;
            color: #A06CE9;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            transition: transform 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            background: #fcfcfc;
        }

        .login-btn:disabled {
            opacity: 0.8;
            cursor: not-allowed;
            transform: none;
        }

        .forgot-link {
            display: block;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 13px;
            margin-top: 14px;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* القسم السفلي - إنشاء حساب */
        .register-section {
            margin-top: auto;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
            padding-top: 20px;
        }

        .register-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
        }

        .create-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60%;
            height: 42px;
            border-radius: 22px;
            background: #ffffff;
            color: #A06CE9;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .create-btn:hover {
            transform: translateY(-2px);
        }

        /* رسائل الخطأ والنجاح */
        .message {
            display: none;
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .message.error {
            background: rgba(255, 235, 235, 0.95);
            color: #d32f2f;
        }

        .message.success {
            background: rgba(235, 255, 238, 0.95);
            color: #2e7d32;
        }

        .message.show {
            display: block;
        }

        /* مؤشر التحميل */
        .loading-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(160, 108, 233, 0.3);
            border-top-color: #A06CE9;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="mobile-card">
        <!-- أشكال الديكور الخلفية -->
        <div class="wave-bg-1"></div>
        <div class="wave-bg-2"></div>

        <!-- الشعار -->
        <div class="logo-box">
            <i class="fa-solid fa-face-smile"></i>
        </div>

        <div class="app-name">Si7a</div>

        <!-- الترحيب -->
        <h1 class="welcome-title">مرحبًا بك!</h1>

        <!-- رسائل التنبيه -->
        <div id="message" class="message"></div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm">
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="البريد الإلكتروني" autocomplete="email" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password" required>
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="إظهار كلمة المرور">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                تسجيل الدخول
            </button>

            <a href="#" class="forgot-link" id="forgotPassword">نسيت كلمة المرور؟</a>
        </form>

        <!-- رابط إنشائ حساب جديد -->
        <div class="register-section">
            <div class="register-text">ليس لديك حساب؟</div>
            <a href="register.html" class="create-btn">إنشاء حساب</a>
        </div>
    </div>

    <script type="module">
        import { auth } from "./js/firebase.js";
        import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

        const form = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");
        const message = document.getElementById("message");
        const forgotPassword = document.getElementById("forgotPassword");

        function showMessage(text, type = "error") {
            message.textContent = text;
            message.className = "message " + type + " show";
        }

        function hideMessage() {
            message.className = "message";
            message.textContent = "";
        }

        // إظهار وإخفاء كلمة المرور
        document.getElementById("togglePassword").addEventListener("click", () => {
            const icon = document.querySelector("#togglePassword i");
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                passwordInput.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        });

        // تسجيل الدخول
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            hideMessage();

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            if (!email) {
                showMessage("يرجى إدخال البريد الإلكتروني.");
                emailInput.focus();
                return;
            }

            if (!password) {
                showMessage("يرجى إدخال كلمة المرور.");
                passwordInput.focus();
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = `
                <span class="loading-spinner"></span>
                <span>جاري تسجيل الدخول...</span>
            `;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showMessage("تم تسجيل الدخول بنجاح. جاري تحويلك...", "success");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 700);
            } catch (error) {
                console.error("Login error:", error);
                let errorMessage = "تعذر تسجيل الدخول. تحقق من بياناتك.";

                switch (error.code) {
                    case "auth/invalid-credential":
                        errorMessage = "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
                        break;
                    case "auth/wrong-password":
                        errorMessage = "كلمة المرور غير صحيحة.";
                        break;
                    case "auth/user-not-found":
                        errorMessage = "لا يوجد حساب بهذا البريد الإلكتروني.";
                        break;
                    case "auth/invalid-email":
                        errorMessage = "البريد الإلكتروني غير صالح.";
                        break;
                    case "auth/too-many-requests":
                        errorMessage = "تمت محاولات كثيرة. انتظر قليلًا ثم حاول مرة أخرى.";
                        break;
                    case "auth/network-request-failed":
                        errorMessage = "تعذر الاتصال بالإنترنت.";
                        break;
                }

                showMessage(errorMessage);
                loginBtn.disabled = false;
                loginBtn.innerHTML = "تسجيل الدخول";
            }
        });

        // استعادة كلمة المرور
        forgotPassword.addEventListener("click", async (event) => {
            event.preventDefault();
            hideMessage();

            const email = emailInput.value.trim().toLowerCase();

            if (!email) {
                showMessage("أدخل بريدك الإلكتروني أولًا، ثم اضغط على «نسيت كلمة المرور؟».");
                emailInput.focus();
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                showMessage("تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.", "success");
            } catch (error) {
                console.error("Password reset error:", error);
                let errorMessage = "تعذر إرسال رابط إعادة تعيين كلمة المرور.";

                switch (error.code) {
                    case "auth/user-not-found":
                        errorMessage = "لا يوجد حساب بهذا البريد الإلكتروني.";
                        break;
                    case "auth/invalid-email":
                        errorMessage = "البريد الإلكتروني غير صالح.";
                        break;
                    case "auth/network-request-failed":
                        errorMessage = "تعذر الاتصال بالإنترنت.";
                        break;
                }

                showMessage(errorMessage);
            }
        });
    </script>
</body>

</html>
